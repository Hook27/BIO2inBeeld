<script>
'use strict';
// Hoofdstuk 2: §4 (verplichtingen), §5 (het managementsysteem), §5.1 (reikwijdte) en §5.2 (samenhang) van de BIO2.
// Beat ids match content/bio2/ch02/narration.nl.json. One idea per beat (BOOK.md).
const CHAPTER = { number: 2, title: 'Wat is verplicht? Het managementsysteem', minutes: 8, language: 'nl', next: '../ch03/' };

/* ---------- chapter drawing helpers (prefixed c2_; the shared b_ helpers live in ../lib/engine.js) ---------- */
// The ring of the management system: an ellipse with four stations. c2_at gives a point on it (degrees, clockwise from the right).
const C2_RING = { cx: 800, cy: 500, rx: 330, ry: 190 };
const c2_at = deg => [C2_RING.cx + C2_RING.rx * Math.cos(deg * Math.PI / 180), C2_RING.cy + C2_RING.ry * Math.sin(deg * Math.PI / 180)];
// An arc of the ring from a1 to a2 degrees with an arrowhead, drawing itself at t0.
function c2_arc(p, a1, a2, t0) {
  const [x1, y1] = c2_at(a1), [x2, y2] = c2_at(a2), r = a2 * Math.PI / 180;
  const tx = -C2_RING.rx * Math.sin(r), ty = C2_RING.ry * Math.cos(r), n = Math.hypot(tx, ty), ux = tx / n, uy = ty / n;   // direction of travel at the end
  const head = k => `L${(x2 - 16 * (ux * Math.cos(k) - uy * Math.sin(k))).toFixed(1)} ${(y2 - 16 * (ux * Math.sin(k) + uy * Math.cos(k))).toFixed(1)}`;
  const e = path(p, `M${x1.toFixed(1)} ${y1.toFixed(1)}A${C2_RING.rx} ${C2_RING.ry} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}${head(.45)}M${x2.toFixed(1)} ${y2.toFixed(1)}${head(-.45)}`,
    { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 });
  draw(e, t0, .6);
  return e;
}
// A column of a picture: frame, small heading in monospace. Returns the group, hidden and a little low.
const c2_col = (p, x, y, w, hgt, kick, col = COL.edge) => {
  const g = G(p, { o: 0, y: 14 });
  b_rect(g, x, y, w, hgt, { fill: COL.panel, stroke: col });
  T(g, kick, { x: x + 26, y: y + 42, size: 17, fill: col === COL.edge ? COL.dim : col, weight: 700, font: MONO }).setAttribute('letter-spacing', '2');
  return g;
};

/* ---------- chapter data (used inside BEATS, so defined above it) ---------- */
// The field of processes and systems for the scope: six columns, two rows; the first three columns are critical.
const C2_FX = c => 275 + c * 180, C2_FY = r => 300 + r * 140;
// The three things an organisation shows about a measure (BIO2 §4).
const C2_EV = [
  { name: 'opzet', icon: 'doc', text: 'vastgelegd hoe het is uitgewerkt' },
  { name: 'bestaan', icon: 'laptop', text: 'de maatregel is er echt' },
  { name: 'werking', icon: 'tijdlijn', text: 'over een periode aantoonbaar gewerkt' },
];
const C2_EX = i => 330 + i * 470;
// Three management systems, four building blocks each: [dx, dy, width] before they share one structure.
const C2_SYS = [
  { name: 'informatiebeveiliging', col: COL.task, start: [[-40, -10, 220], [30, 6, 300], [-20, 18, 260], [10, -6, 180]] },
  { name: 'bedrijfscontinuïteit', col: COL.iso, start: [[20, 14, 280], [-30, -12, 200], [36, 4, 240], [-10, 20, 300]] },
  { name: 'ander managementsysteem', col: COL.rat, start: [[0, -16, 180], [-36, 10, 260], [24, -4, 300], [40, 12, 220]] },
];
const C2_SX = c => 330 + c * 470, C2_SY = r => 310 + r * 88;

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Wat is verplicht?', (m, D) =>
    b_title(m, D, 'DEEL A · HET KADER · HOOFDSTUK 2', 'Wat is verplicht?', 'Drie verplichtingen, en het managementsysteem dat ze bij elkaar houdt.')],

  ['drie', 'Drie verplichtingen', (m) => {
    const p = panel(0);
    b_head(p, '§ 4 · VERPLICHTINGEN BIO');
    b_txt(p, 'de BIO stelt drie verplichtingen', 800, 220, .2, { size: 34, weight: 600 });
    [['een', 'kringloop', 'managementsysteem', 'volgens ISO 27001'],
      ['twee', 'schild', 'beheersmaatregelen', 'ISO 27002 en overheidsmaatregelen'],
      ['drie', 'loep', 'aantonen', 'opzet, bestaan en werking']].forEach(([mark, icon, title, sub], i) => {
      const x = 120 + i * 470;
      show(put(b_rect(p, x, 300, 420, 260, { fill: COL.panel }), { o: 0 }), .3 + i * .12);   // the three frames are there at once
      const g = G(p, { o: 0, y: 12 });
      T(g, String(i + 1), { x: x + 36, y: 378, size: 64, fill: COL.task, weight: 700, font: MONO });
      b_icon(g, icon, { x: x + 340, y: 358, s: 1.3, stroke: COL.dim });
      T(g, title, { x: x + 36, y: 462, size: 32, weight: 600 });
      T(g, sub, { x: x + 36, y: 506, size: 20, fill: COL.dim });
      tw(g, { o: 1, y: 0 }, m(mark), .5, out);
    });
    b_txt(p, 'we lopen ze één voor één langs', 800, 660, m('rij'), { size: 26, fill: COL.dim });
  }],

  ['v1', 'Managementsysteem', (m) => {
    const p = panel(0);
    b_head(p, '§ 4 · VERPLICHTING 1');
    b_tabs(['1 MANAGEMENTSYSTEEM', '2 BEHEERSMAATREGELEN', '3 AANTONEN'], .3); b_tab(0, .3);
    // The system in the middle; the standard it must meet under it.
    b_txt(p, 'managementsysteem', 800, 484, .2, { size: 32, weight: 600 });
    b_txt(p, 'voor informatiebeveiliging', 800, 518, .2, { size: 22, fill: COL.dim });
    b_txt(p, 'NEN-EN-ISO/IEC 27001', 800, 562, m('norm'), { size: 24, fill: COL.iso, weight: 700, font: MONO });
    // A marker that will travel the ring; drawn first, so it passes behind the stations.
    const dot = G(p, { o: 0 });
    mk('circle', { r: 9, fill: COL.task }, dot);
    [['vaststellen', -90, 's1'], ['implementeren', 0, 's2'], ['bijhouden', 90, 's3'], ['continu verbeteren', 180, 's4']].forEach(([str, deg, mark], i) => {
      const [x, y] = c2_at(deg), g = G(p, { o: 0 });
      b_rect(g, x - 135, y - 31, 270, 62, { fill: COL.panel, stroke: COL.dim, rx: 6 });
      T(g, str, { x, y: y + 8, size: 23, anchor: 'middle', font: MONO });
      show(g, m(mark));
      if (i) c2_arc(p, deg - 62, deg - 28, m(mark) - .35);     // the arc that leads into this station
    });
    // Never finished: the ring closes and the marker goes round.
    const tR = m('rond');
    c2_arc(p, 208, 242, tR);
    prog(q => { const [x, y] = c2_at(-90 + 360 * q); put(dot, { x, y, o: 1 }); }, tR + .5, 3.2, lin);
    b_txt(p, 'geen eenmalige klus, maar een kringloop', 800, 792, tR + .4, { size: 30, weight: 600, fill: COL.task });
  }],

  ['scope', 'Reikwijdte', (m) => {
    const p = panel(0);
    b_head(p, '§ 4 EN § 5.1 · REIKWIJDTE');
    b_txt(p, 'reikwijdte van het managementsysteem', 800, 200, m('vast'), { size: 34, weight: 600 });
    // Processes and systems of an organisation; the critical ones in amber.
    for (let c = 0; c < 6; c++) for (let r = 0; r < 2; r++) {
      const crit = c < 3, g = G(p, { o: 0 });
      b_rect(g, C2_FX(c), C2_FY(r), 150, 110, { fill: COL.panel, stroke: crit ? COL.task : COL.edge, rx: 6 });
      b_icon(g, (c + r) % 2 ? 'server' : 'proc', { x: C2_FX(c) + 75, y: C2_FY(r) + 55, s: .9, stroke: crit ? COL.task : COL.dim });
      show(g, .3 + (c * 2 + r) * .05);
    }
    b_txt(p, 'kritisch voor de dienstverlening', 530, 618, .9, { size: 24, weight: 600, fill: COL.task });
    b_txt(p, 'ondersteunend', 1070, 618, 1, { size: 24, fill: COL.dim });
    // The boundary: at least what is critical.
    const tM = m('min');
    const edge = put(b_rect(p, 255, 280, 550, 290, { stroke: COL.chalk, sw: 3, rx: 12 }), { o: 0, a_width: 550 });
    show(edge, tM);
    const tag = (str, x) => { const e = b_txt(p, str, x, 264, tM + .3, { size: 17, anchor: 'start', weight: 700, font: MONO }); e.setAttribute('letter-spacing', '2'); return e; };
    tag('REIKWIJDTE', 257);
    const least = tag('· MINIMAAL', 393);
    // How far it reaches beyond that is the organisation's own decision: the boundary moves out and back.
    const tE = m('extra');
    hide(least, tE, .4);
    tw(edge, { a_width: 910 }, tE, 1.1); tw(edge, { a_width: 730 }, tE + 1.5, .9);
    b_txt(p, 'in welke mate: bepaalt de organisatie zelf', 1070, 662, tE + .6, { size: 24 });
  }],

  ['koepel', 'Niet alles zelf', (m) => {
    const p = panel(0);
    b_head(p, '§ 5.1 · REIKWIJDTE');
    const tS = m('zelfde'), tA = m('aanbod');
    [0, 1, 2].forEach(i => {
      const x = 400 + i * 400;
      show(b_icon(p, 'overheid', { x, y: 470, s: 1.2, o: 0 }), .2 + i * .1);
      b_txt(p, 'organisatie ' + 'ABC'[i], x, 560, .3 + i * .1, { size: 22, fill: COL.dim });
      // The same process in each of them.
      const g = G(p, { x, y: 650, o: 0, s: .6 });
      b_rect(g, -75, -50, 150, 100, { fill: COL.panel, stroke: COL.dim, rx: 6 });
      b_icon(g, 'proc', { s: .9 });
      pop(g, tS + i * .15);
      b_down(p, x, 312, 404, tA + .4 + i * .12);
    });
    b_txt(p, 'gelijkwaardige processen', 800, 760, tS + .5, { size: 26, weight: 600 });
    // What the umbrella organisation offers reaches all three.
    const box = G(p, { o: 0, y: -14 });
    b_rect(box, 300, 200, 1000, 104, { fill: COL.panel, stroke: COL.dim });
    T(box, 'koepelorganisatie', { x: 800, y: 246, size: 30, weight: 600, anchor: 'middle' });
    T(box, 'ondersteuningsaanbod, waar beschikbaar', { x: 800, y: 282, size: 22, fill: COL.dim, anchor: 'middle' });
    T(box, 'AANBEVOLEN', { x: 1276, y: 236, size: 15, fill: COL.dim, anchor: 'end', weight: 700, font: MONO }).setAttribute('letter-spacing', '2');
    tw(box, { o: 1, y: 0 }, tA, .5, out);
  }],

  ['v2', 'Beheersmaatregelen', (m) => {
    const p = panel(0);
    b_head(p, '§ 4 · VERPLICHTING 2');
    b_tab(1, .2);
    // The set that results, on screen at once; the two sources fill it.
    show(put(b_rect(p, 520, 500, 560, 190, { fill: COL.panel, stroke: COL.dim }), { o: 0 }), .3);
    b_txt(p, 'passende beheersmaatregelen', 800, 472, .3, { size: 30, weight: 600 });
    const source = (x, col, fill, code, sub, t0) => {
      const g = G(p, { o: 0, y: 12 });
      b_rect(g, x, 220, 520, 110, { fill, stroke: col });
      T(g, code, { x: x + 28, y: 268, size: 28, fill: col, weight: 700, font: MONO });
      T(g, sub, { x: x + 28, y: 306, size: 23 });
      tw(g, { o: 1, y: 0 }, t0, .5, out);
    };
    source(180, COL.iso, '#172028', 'NEN-EN-ISO/IEC 27002', 'beheersmaatregelen', m('iso'));
    source(900, COL.task, COL.panel, 'BIO DEEL 2', 'verplichte overheidsmaatregelen', m('bio'));
    for (let k = 0; k < 30; k++) {
      const iso = k < 18, t0 = (iso ? m('iso') + k * .05 : m('bio') + (k - 18) * .05) + .5;
      const q = put(mk('rect', { width: 36, height: 36, rx: 4, fill: iso ? COL.iso : COL.task, 'fill-opacity': .8 }, p), { x: iso ? 440 : 1160, y: 290, o: 0, s: .4 });
      show(q, t0, .2);
      tw(q, { x: 557 + (k % 10) * 50, y: 530 + Math.floor(k / 10) * 50, s: 1 }, t0, .7, io);
    }
    // What makes them fitting.
    b_txt(p, 'afgestemd op', 300, 500, m('omg'), { size: 22, fill: COL.dim });
    [['omgeving', m('omg')], ['reikwijdte', m('basis')], ['onderkende risico’s', m('basis', .5)]].forEach(([str, t0], i) => {
      const g = G(p, { o: 0 });
      b_rect(g, 150, 520 + i * 58, 300, 46, { stroke: COL.dim, rx: 6 });
      T(g, str, { x: 300, y: 551 + i * 58, size: 21, anchor: 'middle', font: MONO });
      show(g, t0);
    });
    b_arrow(p, 462, 510, 601, m('basis', .8));
  }],

  ['gelijk', 'Gelijkwaardig vervangen', (m) => {
    const p = panel(0);
    b_head(p, '§ 4 · VERPLICHTING 2');
    // A balance: one measure on the left, waiting for its equal.
    show(path(p, 'M800 372V470 M730 470H870', { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), .2);
    const beam = S.beam = G(p, { x: 800, y: 372, r: -6, o: 0 });
    path(beam, 'M-270 0H270 M-270 0V64 M-350 64H-190 M270 0V64 M190 64H350', { stroke: COL.chalk, 'stroke-width': 4 });
    mk('circle', { r: 8, fill: COL.chalk }, beam);
    mk('rect', { x: -315, y: -28, width: 90, height: 90, rx: 6, fill: COL.task, 'fill-opacity': .82 }, beam);
    show(beam, .2);
    b_txt(p, 'maatregel uit ISO 27002', 530, 524, .5, { size: 22, fill: COL.dim });
    b_txt(p, 'of uit de BIO', 530, 552, .5, { size: 22, fill: COL.dim });
    // Its replacement from another standard lands on the other pan; the beam comes level.
    const tS = m('swap');
    b_txt(p, 'vervangen of combineren', 800, 190, tS, { size: 34, weight: 600 });
    const other = put(mk('rect', { x: -45, width: 90, height: 90, rx: 6, fill: COL.rat, 'fill-opacity': .82 }, beam), { x: 270, y: -230, o: 0 });
    tw(other, { y: -28, o: 1 }, tS + .5, .8, io);
    tw(beam, { r: 3 }, tS + 1.2, .5); tw(beam, { r: -1.5 }, tS + 1.7, .5); tw(beam, { r: 0 }, tS + 2.2, .5);
    b_txt(p, 'maatregel uit een', 1070, 524, tS + .5, { size: 22, fill: COL.dim });
    b_txt(p, 'andere norm of richtlijn', 1070, 552, tS + .5, { size: 22, fill: COL.dim });
    draw(path(p, 'M556 250L568 262L590 236', { stroke: COL.good, 'stroke-width': 5 }, { d: 0 }), m('eis'), .4);
    b_txt(p, 'waar nodig én gelijkwaardig', 820, 262, m('eis'), { size: 30, weight: 600, fill: COL.good });
    // The standards the BIO names. Beat 'q1' fades them to make room for the question card.
    S.gchips = [[380, 'NEN 7510', 'zorginformatie', m('zorg')], [800, 'CSIR', 'operationele technologie', m('ot')], [1220, 'IEC 62443', 'industriële cybersecurity', m('ot', 1.6)]]
      .map(([cx, code, sub, t0]) => { const g = b_code(p, cx, 630, code, sub); b_rise(g, t0); return g; });
  }],

  ['q1', 'Controlevraag', () => { S.gchips.forEach(g => hide(g, 0, .4)); }, { ask: done => quiz(WIDE, [{
    id: 'c-gelijkwaardig', prompt: ['Een waterschap wil voor de besturing van zijn gemalen een maatregel uit ISO 27002 vervangen door een maatregel uit IEC 62443. Wanneer mag dat?'],
    build: choice([['als de vervanger gelijkwaardig is'], ['altijd: eigen keuze'], ['nooit']], 0,
      'Vervangen of combineren mag waar dat nodig is, als de andere maatregel gelijkwaardig is.',
      [null, 'De keuze is niet vrij: de vervangende maatregel moet gelijkwaardig zijn.',
        'Het mag wel. Voor operationele technologie noemt de BIO zelf de CSIR en IEC 62443.'],
      () => { fx(S.beam, { r: 3 }, 0, .2, out); fx(S.beam, { r: 0 }, .2, .5); }),
  }], done) }],

  ['tactisch', 'Van tactisch naar operationeel', (m) => {
    const p = panel(0);
    b_head(p, '§ 4 · VERPLICHTING 3');
    b_tab(2, .2);
    // A real government measure as the example: it says what, not yet how.
    const tac = c2_col(p, 110, 270, 410, 320, 'TACTISCH · WAT', COL.task);
    T(tac, '5.17.02', { x: 136, y: 364, size: 32, fill: COL.task, weight: 700, font: MONO });
    ['De entiteit biedt aan alle', 'medewerkers een wachtwoord-', 'manager of vergelijkbare', 'oplossing aan.'].forEach((str, i) => T(tac, str, { x: 136, y: 420 + i * 32, size: 23 }));
    b_rise(tac, .3);
    // Worked out by the organisation: operational.
    const tO = m('op');
    const ope = c2_col(p, 595, 270, 410, 320, 'OPERATIONEEL · HOE');
    ['welke wachtwoordmanager', 'voor wie en vanaf wanneer', 'wie hem beheert', 'hoe je ziet dat hij werkt'].forEach((str, i) => {
      mk('rect', { x: 623, y: 366 + i * 46, width: 9, height: 9, fill: COL.dim }, ope);
      T(ope, str, { x: 646, y: 378 + i * 46, size: 23 });
    });
    b_arrow(p, 530, 586, 430, tO);
    b_txt(p, 'operationaliseren', 557, 246, tO, { size: 22, weight: 600 });
    b_rise(ope, tO + .3);
    // Only then implemented.
    const tI = m('impl');
    const imp = c2_col(p, 1080, 270, 410, 320, 'GEÏMPLEMENTEERD');
    b_icon(imp, 'laptop', { x: 1285, y: 380, s: 1.5 });
    b_arrow(p, 1015, 1071, 430, tI);
    b_txt(p, 'implementeren', 1042, 246, tI, { size: 22, weight: 600 });
    b_rise(imp, tI + .3);
    ['risicogericht', 'best practices', 'marktstandaarden'].forEach((str, i) => {
      const g = G(p, { o: 0 });
      b_rect(g, 1135, 444 + i * 44, 300, 36, { stroke: COL.dim, rx: 5 });
      T(g, str, { x: 1285, y: 469 + i * 44, size: 19, anchor: 'middle', font: MONO });
      show(g, m('risico') + i * .5);
    });
  }],

  ['uitval', 'Werkt het, en blijft het werken?', (m) => {
    const p = panel(0);
    b_head(p, '§ 4 · VERPLICHTING 3');
    // What is protected, three measures in front of it, and a threat coming from the left.
    show(b_icon(p, 'db', { x: 1270, y: 450, s: 1.9, o: 0 }), .2);
    b_txt(p, 'informatie', 1270, 562, .3, { size: 24, fill: COL.dim });
    const bars = [600, 800, 1000].map((x, i) => {
      const line = path(p, `M${x} 310V590`, { stroke: COL.chalk, 'stroke-width': 7 }, { o: 0 });
      show(line, .3 + i * .12);
      b_txt(p, 'maatregel ' + (i + 1), x, 632, .4 + i * .12, { size: 20, fill: COL.dim });
      // A lamp on each measure: you can see whether it works.
      const lamp = put(mk('circle', { cx: x, cy: 280, r: 11, fill: COL.good }, p), { o: 0 });
      show(lamp, m('detect') + i * .2);
      return { line, lamp };
    });
    b_arrow(p, 190, 568, 450, .7, { stroke: COL.bad, sw: 4 });
    b_txt(p, 'dreiging', 300, 424, .8, { size: 24, fill: COL.bad });
    b_txt(p, 'detecteren of een maatregel goed functioneert', 800, 212, m('detect'), { size: 28, weight: 600 });
    draw(path(p, 'M580 676V692H1020V676', { stroke: COL.dim, 'stroke-width': 2 }, { d: 0 }), m('lagen'), .6);
    b_txt(p, 'het ontwerp als geheel', 800, 722, m('lagen', .2), { size: 22, fill: COL.dim });
    // The first measure fails: its lamp shows it, the threat gets one step further, and stops.
    const tV = m('valt');
    tw(bars[0].line, { o: .22 }, tV, .4); tw(bars[0].lamp, { c_fill: COL.bad }, tV, .3);
    b_txt(p, 'valt uit', 600, 252, tV, { size: 20, weight: 600, fill: COL.bad });
    b_arrow(p, 632, 768, 450, tV + .4, { stroke: COL.bad, sw: 4 });
    b_txt(p, 'uitval van één maatregel leidt niet tot een directe kwetsbaarheid', 800, 790, m('niet'), { size: 28, weight: 600, fill: COL.good });
  }],

  ['v3', 'Opzet, bestaan, werking', (m) => {
    const p = panel(0);
    b_head(p, '§ 4 · VERPLICHTING 3');
    S.ev = C2_EV.map((ev, i) => {
      const cx = C2_EX(i), t0 = m(ev.name);
      show(put(b_rect(p, cx - 200, 230, 400, 300, { fill: COL.panel }), { o: 0 }), .3 + i * .12);   // the three frames are there at once
      const g = G(p, { o: 0 });
      b_icon(g, ev.icon, { x: cx, y: 302, s: 1.4 });
      T(g, ev.text, { x: cx, y: 494, size: 20, anchor: 'middle' });
      show(g, t0);
      // The stamp lands on it.
      const stamp = G(p, { x: cx, y: 410, r: -4, s: 1.6, o: 0 });
      b_rect(stamp, -120, -32, 240, 64, { stroke: COL.task, sw: 3, rx: 6 });
      T(stamp, ev.name.toUpperCase(), { y: 11, size: 30, fill: COL.task, anchor: 'middle', weight: 700, font: MONO }).setAttribute('letter-spacing', '3');
      tw(stamp, { s: 1, o: 1 }, t0 + .3, .35, out);
      if (i) b_arrow(p, cx - 262, cx - 208, 380, t0 - .2);
      return g;
