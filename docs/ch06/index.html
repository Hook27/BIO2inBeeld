<script>
'use strict';
// Hoofdstuk 6: de inleiding van deel 2 (hoe je een overheidsmaatregel leest) en de overheidsmaatregelen 5.01.01
// tot en met 5.08.01 van de BIO2 (pagina 13 en 14).
// Beat ids match content/bio2/ch06/narration.nl.json. One idea per beat.
const CHAPTER = { number: 6, title: 'Deel 2 lezen; beleid, rollen en scholing', minutes: 8, language: 'nl', next: '../ch07/' };

/* ---------- chapter data (used by the helpers and inside BEATS, so defined first) ---------- */
const C6_TABS = ['5.01', '5.02', '5.03', '5.04', '5.05', '5.06', '5.07', '5.08'];
// The first eight controls of ISO 27002 (topics shortened, in our own words) with their government measures in the BIO2.
const C6_CTRL = [
  { code: '5.1', topic: ['beleid voor', 'informatiebeveiliging'], nrs: ['5.01.01', '5.01.02'] },
  { code: '5.2', topic: ['rollen en', 'verantwoordelijkheden'], nrs: ['5.02.01', '5.02.02'] },
  { code: '5.3', topic: ['functiescheiding'], nrs: [] },
  { code: '5.4', topic: ['verantwoordelijkheden', 'van het management'], nrs: ['5.04.01'], moved: ['5.04.02 en 5.04.03 zijn', 'verplaatst naar 5.10'] },
  { code: '5.5', topic: ['contact met', 'overheidsinstanties'], nrs: ['5.05.01'] },
  { code: '5.6', topic: ['contact met', 'belangengroepen'], nrs: [] },
  { code: '5.7', topic: ['informatie over', 'dreigingen'], nrs: [] },
  { code: '5.8', topic: ['informatiebeveiliging', 'in projecten'], nrs: ['5.08.01'] },
];
// The picture of the link between a control and its measures: three controls on the left, their measures on the right.
const C6_ISOY = [216, 356, 496];
const C6_ROWS = ['5.01.01', '5.01.02', '5.02.01', '5.02.02'];
const c6_rowY = i => C6_ISOY[i >> 1] + (i & 1) * 62;
// The six points the policy contains at least (5.01.01): [in short, the detail from the BIO2].
const C6_PUNT = [
  ['strategische uitgangspunten en randvoorwaarden', 'afgestemd op het algemene beveiligingsbeleid en het informatievoorzieningsbeleid'],
  ['organisatie van de informatiebeveiligingsfunctie', 'verantwoordelijkheden, taken en bevoegdheden'],
  ['verantwoordelijkheden toegewezen aan lijnmanagers', 'ketens van informatiesystemen, OT, privacybescherming en continuïteit (BCM)'],
  ['gemeenschappelijke betrouwbaarheidseisen en normen', 'die op de organisatie van toepassing zijn'],
  ['frequentie van de evaluatie', 'hoe vaak het beleid wordt geëvalueerd'],
  ['bevordering van het beveiligingsbewustzijn', ''],
];
const c6_puntY = i => 304 + i * 78;
// The five controls that have government measures, as cards for the second quick check: [number, icon, label].
const C6_Q = [
  ['5.01', 'doc', ['beleid']], ['5.02', 'persoon', ['rollen', 'en CISO']], ['5.04', 'les', ['scholing']],
  ['5.05', 'contact', ['contacten']], ['5.08', 'server', ['risicoafweging', 'bij wijzigingen']],
];
const c6_qX = i => 96 + i * 284;
// The icons 'les', 'contact' and 'doorgaan' started here and moved to the engine when chapters 11 and 12 needed them.

/* ---------- chapter drawing helpers (prefixed c6_; the shared b_ helpers live in ../lib/engine.js,
   among them b_kick, b_kop, b_box, b_matrix and b_dart, which started in this chapter) ---------- */
// A control from ISO 27002 as a blue card at height y. Returns the group, hidden.
const c6_iso = (p, code, y) => {
  const g = G(p, { o: 0 });
  b_rect(g, 150, y, 330, 116, { fill: '#172028', stroke: COL.iso });
  T(g, code, { x: 178, y: y + 56, size: 40, fill: COL.iso, weight: 700, font: MONO });
  T(g, 'beheersmaatregel', { x: 178, y: y + 92, size: 21, fill: COL.dim });
  return g;
};
// A government measure as an amber row with its number, at height y. Returns the group, hidden.
const c6_row = (p, nr, y) => {
  const g = G(p, { o: 0 });
  b_rect(g, 760, y, 560, 54, { fill: COL.panel, stroke: COL.task, rx: 6 });
  T(g, nr, { x: 784, y: y + 36, size: 24, fill: COL.task, weight: 700, font: MONO });
  T(g, 'overheidsmaatregel', { x: 920, y: y + 35, size: 21, fill: COL.dim });
  return g;
};
// The line from a control (its right side, at y1) to a row (its left side, at y2); not yet drawn.
const c6_join = (p, y1, y2) => path(p, `M480 ${y1}C620 ${y1} 620 ${y2} 760 ${y2}`, { stroke: COL.dim, 'stroke-width': 2.5 }, { d: 0 });
// Point i of the policy enters on the sheet (S.sheet) and its number lights up.
const c6_punt = (i, t0) => {
  const y = c6_puntY(i), g = G(S.sheet, { o: 0, x: 14 }), [main, sub] = C6_PUNT[i];
  T(g, main, { x: 656, y: y + (sub ? 34 : 45), size: 24, weight: 600 });
  if (sub) T(g, sub, { x: 656, y: y + 60, size: 18, fill: COL.dim });
  tw(g, { o: 1, x: 0 }, t0, .5, out);
  tw(S.slots[i].frame, { c_stroke: COL.task }, t0, .4); tw(S.slots[i].num, { c_fill: COL.task }, t0, .4);
};

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Deel 2 lezen', (m, D) =>
    b_title(m, D, 'DEEL B · MAATREGELEN VOOR DE ORGANISATIE · HOOFDSTUK 6', 'Deel 2 lezen', 'Hoe je een overheidsmaatregel leest, en de eerste: beleid, rollen en scholing.')],

  ['deel2', 'Deel 2', (m) => {
    const p = panel(0);
    b_head(p, 'INLEIDING DEEL 2 · BIO-OVERHEIDSMAATREGELEN');
    const tA = m('alle'), tK = m('koppel');
    // Where we come from: part 1, the framework.
    const was = G(p, { o: 0 });
    T(was, 'deel 1 van de BIO: het kader', { x: 800, y: 430, size: 36, weight: 600, anchor: 'middle' });
    T(was, 'hoofdstuk 1 tot en met 5 van dit boek', { x: 800, y: 478, size: 24, fill: COL.dim, anchor: 'middle' });
    show(was, .2); hide(was, tA - .5, .4);
    // Part 2: the government measures on the right, each tied to a control from ISO 27002 on the left.
    const right = S.right = G(p);
    b_kick(right, 'BIO · DEEL 2 · OVERHEIDSMAATREGELEN', 760, COL.task, tA);
    S.rows = C6_ROWS.map((nr, i) => { const g = c6_row(right, nr, c6_rowY(i)); show(g, tA + .3 + i * .25); return g; });
    S.joins = C6_ROWS.map((nr, i) => { const e = c6_join(right, C6_ISOY[i >> 1] + 58, c6_rowY(i) + 27); draw(e, tK + .7 + i * .2, .6); return e; });
    S.isoKick = b_kick(p, 'NEN-EN-ISO/IEC 27002:2022', 150, COL.iso, tK);
    S.iso = ['5.1', '5.2'].map((code, k) => { const g = c6_iso(p, code, C6_ISOY[k]); show(g, tK + k * .5); return g; });
  }],

  ['nummer', 'Het nummer', (m) => {
    // Same picture. Everything steps back except measure 5.01.02 and its control; the number is taken apart below.
    const p = S.panel, tN = m('neem'), tD = m('drie'), tV = m('volg'), tS = m('dus');
    [S.rows[0], S.rows[2], S.rows[3], S.iso[1], S.joins[0], S.joins[2], S.joins[3]].forEach(e => tw(e, { o: .25 }, tN, .5));
    const band = S.band = G(p);
    ctx2d.font = `700 104px ${MONO}`;
    const w1 = ctx2d.measureText('5.01').width, w2 = ctx2d.measureText('.02').width, x0 = 190 + w1, xl = x0 + w2 + 60;
    const a = T(band, '5.01', { x: x0, y: 752, size: 104, weight: 700, font: MONO, anchor: 'end', o: 0 });
    const b = T(band, '.02', { x: x0, y: 752, size: 104, weight: 700, font: MONO, o: 0 });
    show(a, tN); show(b, tN);
    tw(a, { c_fill: COL.iso }, tD, .4);
    draw(path(band, `M192 774H${x0 - 6}`, { stroke: COL.iso, 'stroke-width': 4 }, { d: 0 }), tD, .5);
    show(T(band, 'de eerste drie cijfers: beheersmaatregel 5.1 uit ISO 27002', { x: xl, y: 704, size: 25, fill: COL.iso, weight: 600, o: 0 }), tD + .3);
    tw(b, { c_fill: COL.task }, tV, .4);
    draw(path(band, `M${x0 + 20} 774H${x0 + w2 - 2}`, { stroke: COL.task, 'stroke-width': 4 }, { d: 0 }), tV, .5);
    show(T(band, 'de cijfers daarna: volgnummer van de overheidsmaatregel', { x: xl, y: 748, size: 25, fill: COL.task, weight: 600, o: 0 }), tV + .3);
    // So this is measure two under control 5.1: the line between them lights up.
    tw(S.joins[1], { c_stroke: COL.iso, 'a_stroke-width': 4.5 }, tS, .4);
  }],

  ['minimum', 'Het verplichte minimum', (m) => {
    const p = S.panel, tM = m('min'), tG = m('genoeg');
    hide(S.band, 0, .4);
    [...S.rows, ...S.iso, ...S.joins].forEach(e => tw(e, { o: 1 }, .2, .5));
    tw(S.joins[1], { c_stroke: COL.dim, 'a_stroke-width': 2.5 }, .2, .4);
    // The measures under a control are its mandatory minimum.
    const br = S.brace = G(S.right);
    [0, 1].forEach(k => draw(path(br, `M1334 ${C6_ISOY[k]}H1348V${C6_ISOY[k] + 116}H1334`, { stroke: COL.task, 'stroke-width': 3 }, { d: 0 }), tM + k * .3, .5));
    ['verplichte', 'minimale', 'invulling'].forEach((str, i) => show(T(br, str, { x: 1368, y: 322 + i * 30, size: 23, fill: COL.task, weight: 600, o: 0 }), tM + .5));
    // Whether that is enough is for a risk analysis to show.
    const band = S.band = G(p);
    show(put(b_matrix(band, 200, 716, 1.3), { o: 0 }), tG);
    show(T(band, 'genoeg om het risico te beheersen?', { x: 268, y: 708, size: 30, weight: 600, o: 0 }), tG);
    show(T(band, 'dat blijkt uit een risicoanalyse', { x: 268, y: 748, size: 25, fill: COL.dim, o: 0 }), tG + 1.2);
  }],

  ['zonder', 'Zonder overheidsmaatregel', (m) => {
    const p = S.panel, tL = m('leeg'), tR = m('richtlijn');
    hide(S.band, 0, .4); hide(S.brace, 0, .4);
    const g3 = c6_iso(p, '5.3', C6_ISOY[2]);
    S.iso.push(g3); show(g3, .3);
    // Where its measures would be, the table says: none.
    const slot = G(S.right, { o: 0 });
    b_rect(slot, 760, 527, 560, 54, { stroke: COL.dim, rx: 6, 'stroke-dasharray': '8 7' });
    T(slot, '5.03.01', { x: 784, y: 563, size: 24, fill: COL.dim, weight: 700, font: MONO });
    const none = T(slot, 'geen overheidsmaatregel', { x: 920, y: 562, size: 21, fill: COL.dim });
    show(slot, tL);
    draw(c6_join(S.right, 554, 554), tL, .5);
    // If the control applies, the implementation guidance of ISO 27002 takes that place.
    const tip = b_chip(S.right, 912, 533, 396, 'implementatierichtlijn ISO 27002', { col: COL.iso, fill: COL.iso, hgt: 42, size: 18, bg: '#172028' });
    put(tip, { x: -500 }); show(tip, tR, .3); tw(tip, { x: 0 }, tR + .2, .9, io);
    hide(none, tR + .4, .3);
    b_txt(S.right, 'als de beheersmaatregel van toepassing is', 760, 614, tR + 1.1, { size: 21, fill: COL.dim, anchor: 'start' });
  }],

  ['afwijken', 'Afwijken', (m) => {
    // Same picture: what it takes to leave such a control out, or to deviate from it.
    const p = S.panel, tR = m('ra'), tV = m('vvt');
    const band = S.band = G(p);
    show(b_box(band, 150, 664, 340, ['niet toepassen of afwijken?'], { col: COL.dim, hgt: 76, size: 21 }), .3);
    b_arrow(band, 502, 548, 702, tR);
    show(b_box(band, 560, 664, 400, ['onderbouwen met een risicoanalyse'], { hgt: 76, size: 21 }), tR + .3);
    b_arrow(band, 972, 1018, 702, tV);
    show(b_box(band, 1030, 664, 440, ['verwijzing in de bijlage uitzonderingen', 'van de verklaring van toepasselijkheid'], { col: COL.task, hgt: 76, size: 19 }), tV + .3);
  }],

  ['q1', 'Controlevraag', () => {
    // The three controls line up; their measures are out of sight, so the number has to tell.
    hide(S.right, 0, .3); hide(S.band, 0, .3); hide(S.isoKick, 0, .3);
    S.iso.forEach((g, k) => tw(g, { x: 105 + k * 380, y: 372 - C6_ISOY[k] }, .2, .7));
    b_txt(S.panel, 'drie beheersmaatregelen uit ISO 27002', 800, 310, .6, { size: 26, fill: COL.dim });
  }, { ask: done => {
    const items = S.iso.map((g, k) => ({ el: g, box: [255 + k * 380, 372, 330, 116], label: 'beheersmaatregel 5.' + (k + 1) }));
    quiz(WIDE, [{
      id: 'c-nummer-1', prompt: ['Bij welke beheersmaatregel hoort overheidsmaatregel 5.02.02?'],
      build: pickEls(items, 1, 'De eerste drie cijfers, 5.02, verwijzen naar beheersmaatregel 5.2.', i => [
        'Bij 5.1 horen de nummers die met 5.01 beginnen. 5.02.02 begint met 5.02 en hoort bij 5.2.', null,
        'Bij 5.3 zouden de nummers met 5.03 beginnen. 5.02.02 begint met 5.02 en hoort bij 5.2.'][i]),
    }, {
      id: 'c-nummer-2', prompt: ['En overheidsmaatregel 5.01.02?'],
      build: pickEls(items, 0, '5.01 verwijst naar beheersmaatregel 5.1; 02 is het volgnummer.', i => [null,
        'Bij 5.2 horen de nummers die met 5.02 beginnen. 5.01.02 begint met 5.01 en hoort bij 5.1.',
        'Bij 5.3 zouden de nummers met 5.03 beginnen. 5.01.02 begint met 5.01 en hoort bij 5.1.'][i]),
    }, {
      id: 'c-nummer-3', prompt: ['Welke beheersmaatregel heeft geen overheidsmaatregel, zodat de richtlijn uit ISO 27002 geldt?'],
      build: pickEls(items, 2, 'Bij 5.3 staat: geen overheidsmaatregel. Is 5.3 van toepassing, dan gebruik je de implementatierichtlijn.', i => [
        'Bij 5.1 horen de overheidsmaatregelen 5.01.01 en 5.01.02. Geen overheidsmaatregel heeft 5.3.',
        'Bij 5.2 horen de overheidsmaatregelen 5.02.01 en 5.02.02. Geen overheidsmaatregel heeft 5.3.', null][i]),
    }], done);
  } }],

  ['grijs', 'Grijs gemarkeerd', (m) => {
    const p = panel(0);
    b_head(p, 'INLEIDING DEEL 2 · GRIJS GEMARKEERD');
    const tG = m('grijs'), tB = m('buiten'), tZ = m('zelf'), tD = m('dus');
    // The table of part 2, schematic: a number and a text on every row. The last two rows are marked grey.
    b_txt(p, 'SCHEMATISCH', 770, 204, .6, { size: 15, fill: COL.faint, anchor: 'end', weight: 600, font: MONO }).setAttribute('letter-spacing', '1.5');
    const tab = G(p, { o: 0 });
    b_rect(tab, 130, 220, 640, 50, { fill: COL.panel, rx: 0 });
    [['NUMMER', 154], ['OVERHEIDSMAATREGEL', 300]].forEach(([str, x]) =>
      T(tab, str, { x, y: 252, size: 15, fill: COL.dim, weight: 700, font: MONO }).setAttribute('letter-spacing', '1.5'));
    for (let i = 0; i < 5; i++) {
      const y = 270 + i * 76, cell = b_rect(tab, 130, y, 640, 76, { fill: COL.board, rx: 0 });
      mk('rect', { x: 154, y: y + 30, width: 96, height: 16, rx: 3, fill: COL.edge }, tab);
      mk('rect', { x: 300, y: y + 22, width: 400, height: 12, rx: 3, fill: COL.edge }, tab);
      mk('rect', { x: 300, y: y + 44, width: 290, height: 12, rx: 3, fill: COL.edge }, tab);
      if (i > 2) tw(cell, { c_fill: '#4a5159' }, tG + (i - 3) * .25, .6);
    }
    path(tab, 'M276 220V650', { stroke: COL.edge, 'stroke-width': 2 });
    show(tab, .2);
    // Grey: outside the Cyberbeveiligingswet, so binding self-regulation (dashed, as in chapter 4). Not grey: the law itself.
    const area = (y, kick, title, dash, tK, tT, bracket) => {
      draw(path(p, bracket, { stroke: COL.task, 'stroke-width': 3 }, { d: 0 }), tK, .6);
      show(put(b_rect(p, 900, y, 580, 150, { fill: COL.task, stroke: COL.task, sw: 3, 'fill-opacity': dash ? .04 : .12, ...(dash ? { 'stroke-dasharray': '10 8' } : {}) }), { o: 0 }), tK + .3);
      b_kick(p, kick, 928, COL.task, tK + .4, y + 50);
      b_txt(p, title, 928, y + 108, tT, { size: 34, weight: 600, fill: COL.task, anchor: 'start' });
    };
    area(499, 'GRIJS · NIET ONDER DE CBW', 'verplichtende zelfregulering', true, tB, tZ, 'M784 502H800V646H784 M800 574H900');
    area(309, 'NIET GRIJS · ONDER DE CBW', 'wettelijk verplicht', false, tD, tD + .5, 'M784 274H800V494H784 M800 384H900');
    b_txt(p, 'verplicht zijn ze allemaal', 800, 736, tD + 1, { size: 32, weight: 600, fill: COL.task });
  }],

  ['acht', '5.01 tot en met 5.08', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 2 · 5.01 TOT EN MET 5.08');
    // The strip of this chapter: the eight controls. The three without a government measure get a dashed frame.
    b_tabs(C6_TABS, .4);
    C6_CTRL.forEach((c, i) => { if (!c.nrs.length) b_tabNone(i); });
    const tV = m('vijf'), tD = m('drie');
    let withNr = 0, without = 0;
    C6_CTRL.forEach((c, i) => {
      const x = 120 + (i % 4) * 346, y = 176 + (i >> 2) * 286, g = G(p, { o: 0, y: 12 });
      b_rect(g, x, y, 320, 262, { fill: COL.panel });
      T(g, c.code, { x: x + 24, y: y + 52, size: 34, fill: COL.iso, weight: 700, font: MONO });
      c.topic.forEach((str, k) => T(g, str, { x: x + 24, y: y + 92 + k * 28, size: 21 }));
      tw(g, { o: 1, y: 0 }, .3 + i * .1, .5, out);
      if (c.nrs.length) {
        const t0 = tV + .2 + withNr++ * .3;
        c.nrs.forEach((nr, k) => show(b_chip(g, x + 24 + k * 140, y + 156, 128, nr, { col: COL.task, fill: COL.task, hgt: 42, size: 19 }), t0));
        if (c.moved) c.moved.forEach((str, k) => show(T(g, str, { x: x + 24, y: y + 226 + k * 20, size: 15, fill: COL.dim, font: MONO, o: 0 }), t0 + .6));
      } else {
        const t0 = tD + .2 + without++ * .3;
        show(T(g, 'geen overheidsmaatregel', { x: x + 24, y: y + 176, size: 17, fill: COL.dim, font: MONO, o: 0 }), t0);
        show(b_chip(g, x + 24, y + 196, 272, 'richtlijn uit ISO 27002', { col: COL.iso, fill: COL.iso, hgt: 42, size: 18 }), t0 + 1.6);
      }
    });
    b_txt(p, 'BRON ONDERWERPEN: NEN-EN-ISO/IEC 27002:2022 · VERKORT WEERGEGEVEN', 120, 772, 1.6, { size: 14, fill: COL.faint, anchor: 'start', weight: 700, font: MONO }).setAttribute('letter-spacing', '1.5');
  }],

  ['beleid', 'Beleid', (m) => {
    const p = panel(0);
    b_head(p, '5.01.01 · INFORMATIEBEVEILIGINGSBELEID');
    b_tab(0, .2);
    b_kop(p, '5.01.01', 'informatiebeveiligingsbeleid');
    const tD = m('doc'), tV = m('vast'), tZ = m('zes');
    // The policy as a sheet with six numbered places.
    const sheet = S.sheet = G(p, { o: 0, y: 14 });
    b_rect(sheet, 560, 236, 920, 540, { fill: COL.panel });
    T(sheet, 'INFORMATIEBEVEILIGINGSBELEID', { x: 592, y: 276, size: 16, fill: COL.dim, weight: 700, font: MONO }).setAttribute('letter-spacing', '2');
    path(sheet, 'M592 294H1448', { stroke: COL.edge, 'stroke-width': 2 });
    b_rise(sheet, tD);
    show(b_icon(p, 'overheid', { x: 320, y: 318, s: 1.2, o: 0 }), tD);
    b_txt(p, 'de organisatie stelt het op', 320, 420, tD + .3, { size: 23 });
    // The board adopts it: its stamp lands on the sheet.
    show(b_icon(p, 'persoon', { x: 320, y: 522, s: 1.5, o: 0 }), tV);
    b_txt(p, 'het bestuur stelt het vast', 320, 618, tV + .3, { size: 23, weight: 600, fill: COL.task });
    const stamp = G(p, { x: 320, y: 678, r: -5, o: 0 });
    b_rect(stamp, -108, -22, 216, 44, { fill: COL.board, stroke: COL.task, sw: 3, rx: 5 });
    T(stamp, 'VASTGESTELD', { y: 7, size: 18, fill: COL.task, anchor: 'middle', weight: 700, font: MONO }).setAttribute('letter-spacing', '2');
    show(stamp, tV + .6, .3); tw(stamp, { x: 1350, y: 242 }, tV + 1.1, .9, io);
    S.slots = C6_PUNT.map((pt, i) => {
      const y = c6_puntY(i), g = G(sheet, { o: 0 });
      const frame = b_rect(g, 592, y + 14, 44, 44, { stroke: COL.edge, rx: 5 });
