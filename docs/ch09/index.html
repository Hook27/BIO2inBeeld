<script>
'use strict';
// Hoofdstuk 9: de overheidsmaatregelen 5.19.01 tot en met 5.23.01 van de BIO2 (pagina 18 en 19): eisen bij de inkoop,
// afspraken in het contract, de keten van toeleveranciers, het beoordelen van leveranciers en clouddiensten.
// Beat ids match content/bio2/ch09/narration.nl.json. One idea per beat. The organisation is always on the left,
// the supplier on the right, its own suppliers behind it.
const CHAPTER = { number: 9, title: 'Leveranciers en de keten', minutes: 7, language: 'nl', next: '../ch10/' };

/* ---------- chapter data (used by the helpers and inside BEATS, so defined first) ---------- */
const C9_TABS = ['5.19', '5.20', '5.21', '5.22', '5.23'];
// Five controls of ISO 27002 (topics shortened, in our own words) with their government measures in the BIO2.
const C9_CTRL = [
  { code: '5.19', topic: ['leveranciers-', 'relaties'], nrs: ['5.19.01'] },
  { code: '5.20', topic: ['leveranciers-', 'overeenkomsten'], nrs: ['5.20.01', '5.20.02', '5.20.03', '5.20.04', '5.20.05', '5.20.06'] },
  { code: '5.21', topic: ['de ICT-', 'toeleveringsketen'], nrs: ['5.21.02', '5.21.03', '5.21.04', '5.21.05'], gone: '5.21.01 vervallen' },
  { code: '5.22', topic: ['leveranciers', 'beoordelen'], nrs: ['5.22.01', '5.22.02'] },
  { code: '5.23', topic: ['gebruik van', 'clouddiensten'], nrs: ['5.23.01'] },
];
const C9_SUBY = [300, 440, 580];   // the three sub-suppliers of the chain picture
// Five agreements in the contract, as rows to point at in the first quick check.
const C9_Q1 = ['beveiligingseisen uit de offerteaanvraag', 'aantonen: opzet, bestaan en werking', 'een externe audit is mogelijk',
  'transparant over kwetsbaarheden en incidenten', 'exit-strategie'];
const c9_q1Y = i => 262 + i * 68;
// The five controls as cards for the second quick check: [number, icon, label].
const C9_Q2 = [['5.19', 'doc', ['eisen bij', 'de inkoop']], ['5.20', 'cert', ['afspraken in', 'het contract']], ['5.21', 'keten', ['keten van', 'toeleveranciers']],
  ['5.22', 'loep', ['leverancier', 'beoordelen']], ['5.23', 'wolk', ['clouddiensten']]];
const c9_q2X = i => 104 + i * 284;
// The six verbs of the cloud policy (5.23.01), with the moment after 'beleid' at which each is named.
const C9_VERB = [[['inventariseren'], 1.6], [['classificeren'], 3.2], [['selecteren'], 4.5], [['beoordelen'], 5.6], [['managen'], 6.8], [['dienstverlening', 'beëindigen'], 8.6]];

/* ---------- chapter drawing helpers (prefixed c9_; the shared b_ helpers live in ../lib/engine.js) ---------- */
// The two parties of this chapter, each on its own side (b_party and b_sheet, which started here, live in ../lib/engine.js).
const c9_org = (p, y = 430) => b_party(p, 200, y, 'overheid', 'organisatie');
const c9_lev = (p, y = 440) => b_party(p, 1400, y, 'bedrijf', 'leverancier', { lab: 84 });
// The chain: the organisation, its supplier and three sub-suppliers behind it, with the lines between them.
// Everything starts hidden; returns { org, lev, main, subs, links }.
const c9_chain = p => {
  const line = d => path(p, d, { stroke: COL.dim, 'stroke-width': 3 }, { o: 0 });
  const main = line('M300 440H550'), links = C9_SUBY.map(y => line(`M692 440C800 440 840 ${y} 976 ${y}`));
  const org = c9_org(p), lev = b_party(p, 620, 440, 'bedrijf', 'leverancier', { lab: 84 });
  const subs = C9_SUBY.map((y, k) => {
    const g = G(p, { o: 0 });
    g._ic = b_icon(g, 'bedrijf', { x: 1030, y, s: .95 });
    g._lab = T(g, 'toeleverancier ' + 'ABC'[k], { x: 1084, y: y + 8, size: 21 });
    return g;
  });
  return { org, lev, main, subs, links };
};
const c9_chainOn = (c, t0) => [c.org, c.main, c.lev, ...c.links, ...c.subs].forEach(e => show(e, t0, .4));

/* ---------- beats: [id, title, run(m, D), { ask, hold }?] ---------- */
const BEATS = [
  ['intro', 'Leveranciers', (m, D) =>
    b_title(m, D, 'DEEL B · MAATREGELEN VOOR DE ORGANISATIE · HOOFDSTUK 9', 'Leveranciers', 'Inkoop, contract, de keten van toeleveranciers en clouddiensten.')],

  ['vijf', '5.19 tot en met 5.23', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 2 · 5.19 TOT EN MET 5.23');
    // The strip of this chapter: the five controls. All of them have government measures.
    b_tabs(C9_TABS, .4);
    const tA = m('alle');
    C9_CTRL.forEach((c, i) => {
      const x = 120 + i * 276, y = 226, g = G(p, { o: 0, y: 12 });
      b_rect(g, x, y, 260, 330, { fill: COL.panel });
      T(g, c.code, { x: x + 20, y: y + 52, size: 34, fill: COL.iso, weight: 700, font: MONO });
      c.topic.forEach((str, k) => T(g, str, { x: x + 20, y: y + 92 + k * 27, size: 20 }));
      tw(g, { o: 1, y: 0 }, .3 + i * .1, .5, out);
      c.nrs.forEach((nr, k) => show(b_chip(g, x + 20 + (k % 2) * 114, y + 156 + Math.floor(k / 2) * 48, 106, nr, { col: COL.task, fill: COL.task, hgt: 38, size: 16 }), tA + .2 + i * .2 + k * .06));
      if (c.gone) show(T(g, c.gone, { x: x + 20, y: y + 274, size: 15, fill: COL.dim, font: MONO, o: 0 }), m('verv'));
    });
    b_txt(p, 'BRON ONDERWERPEN: NEN-EN-ISO/IEC 27002:2022 · VERKORT WEERGEGEVEN', 120, 596, 1.6, { size: 14, fill: COL.faint, anchor: 'start', weight: 700, font: MONO }).setAttribute('letter-spacing', '1.5');
    b_txt(p, 'samen veertien overheidsmaatregelen', 800, 678, m('veertien'), { size: 27, weight: 600, fill: COL.task });
  }],

  ['offerte', 'Eisen bij de inkoop', (m) => {
    const p = panel(0);
    b_head(p, '5.19.01 · EISEN BIJ DE INKOOP');
    b_tab(0, .2);
    b_kop(p, '5.19.01', 'beveiligingseisen bij de inkoop');
    const tO = m('off'), tB = m('biv'), tR = m('ra');
    show(c9_org(p), .3); show(c9_lev(p), .5);
    // The request for quotation travels from the organisation to the supplier; the security requirements are part of it.
    b_rise(b_sheet(p, 560, 250, 480, 440, 'OFFERTEAANVRAAG · INKOOPEISEN', 3), tO);
    b_arrow(p, 300, 546, 430, tO + .2); b_arrow(p, 1054, 1300, 430, tO + .9);
    show(b_box(p, 588, 400, 424, ['informatiebeveiligingseisen'], { col: COL.task, fill: COL.task }), tO + 3.6);
    ['beschikbaarheid', 'integriteit', 'vertrouwelijkheid'].forEach((str, k) => b_txt(p, str, 800, 512 + k * 36, tB + k * 1.05, { size: 23, fill: COL.task }));
    // They rest on an explicit risk assessment.
    show(put(b_matrix(p, 400, 606, 1.2), { o: 0 }), tR);
    b_txt(p, 'expliciete risicoafweging', 400, 676, tR, { size: 20, fill: COL.dim });
    show(b_dart(p, 446, 588, 576, 452, { stroke: COL.task }), tR + .4);
  }],

  ['contract', 'In het contract', (m) => {
    const p = panel(0);
    b_head(p, '5.20.01 · EISEN IN HET CONTRACT');
    b_tab(1, .2);
    b_kop(p, '5.20.01', 'dezelfde eisen in het contract');
    const tC = m('con'), eisen = x => b_box(p, x, 400, 424, ['informatiebeveiligingseisen'], { col: COL.task, fill: COL.task });
    b_rise(b_sheet(p, 250, 260, 480, 380, 'OFFERTEAANVRAAG', 2), .2);
    show(eisen(278), .5);
    b_rise(b_sheet(p, 870, 260, 480, 380, 'CONTRACT', 2), .4);
    // The block of requirements travels from the request into the contract.
    const copy = put(eisen(898), { x: -620 });
    show(copy, tC, .3); tw(copy, { x: 0 }, tC + .2, 1, io);
    b_txt(p, 'expliciet opgenomen', 1110, 694, tC + 1.3, { size: 24, weight: 600, fill: COL.task });
  }],

  ['voorwaarden', 'Algemene voorwaarden', (m) => {
    const p = panel(0);
    b_head(p, '5.20.02 · ALGEMENE VOORWAARDEN');
    b_kop(p, '5.20.02', 'algemene voorwaarden van de leverancier');
    const tU = m('uit'), tA = m('aanv');
    b_rise(b_sheet(p, 330, 250, 480, 440, 'CONTRACT', 2), .3);
    show(b_box(p, 358, 370, 424, ['beveiligingseisen'], { col: COL.task, fill: COL.task, hgt: 60 }), .6);
    show(c9_lev(p), .3);
    // The supplier's own terms come along; where possible they are excluded explicitly.
    const av = G(p, { o: 0, x: 120 });
    b_icon(av, 'doc', { x: 1120, y: 410, s: 2.2 });
    T(av, 'algemene voorwaarden', { x: 1120, y: 502, size: 21, weight: 600, anchor: 'middle' });
    T(av, 'van de leverancier', { x: 1120, y: 529, size: 19, fill: COL.dim, anchor: 'middle' });
    tw(av, { o: 1, x: 0 }, .8, .7, out);
    draw(path(p, 'M1040 474L1200 346', { stroke: COL.task, 'stroke-width': 5 }, { d: 0 }), tU, .5);
    tw(av, { o: .45 }, tU + .4, .4);
    b_txt(p, 'waar mogelijk: expliciet uitgesloten', 1120, 600, tU + .3, { size: 22, weight: 600, fill: COL.task });
    // If needed, additional terms take their place in the contract.
    show(put(b_caps(p, 'EVENTUEEL', 358, 470), { o: 0 }), tA);
    const extra = b_box(p, 358, 482, 424, ['aanvullende voorwaarden'], { col: COL.task, fill: COL.task, hgt: 60 });
    extra.firstChild.setAttribute('stroke-dasharray', '8 6');
    show(extra, tA);
  }],

  ['nietuit', 'Als uitsluiten niet kan', (m) => {
    const p = panel(0);
    b_head(p, '5.20.02 · ALGEMENE VOORWAARDEN');
    b_kop(p, '5.20.02', 'als uitsluiten niet mogelijk is');
    const tB = m('beoord'), tE = m('expl');
    const av = G(p, { o: 0 });
    b_icon(av, 'doc', { x: 220, y: 420, s: 2.2 });
    T(av, 'algemene voorwaarden', { x: 220, y: 512, size: 21, weight: 600, anchor: 'middle' });
    T(av, 'niet uit te sluiten', { x: 220, y: 539, size: 19, fill: COL.dim, anchor: 'middle' });
    show(av, .3);
    // Then the risks are assessed, and it is made explicit what happens with each.
    b_arrow(p, 312, 408, 420, tB);
    const gate = G(p, { o: 0, y: 14 });
    b_rect(gate, 420, 320, 330, 200, { fill: COL.panel, stroke: COL.task, sw: 3 });
    b_matrix(gate, 585, 388, 1.2);
    T(gate, 'risico’s beoordeeld', { x: 585, y: 484, size: 24, weight: 600, fill: COL.task, anchor: 'middle' });
    b_rise(gate, tB + .2);
    b_txt(p, 'expliciet gemaakt', 870, 290, tE, { size: 24, weight: 600, anchor: 'start' });
    [['acc', 'welke consequenties geaccepteerd worden', COL.dim, COL.chalk], ['mit', 'welke gemitigeerd zijn', COL.good, COL.good],
      ['nooit', 'welke voorwaarden nooit geaccepteerd worden', COL.bad, COL.bad]].forEach(([mark, str, col, fill], k) => {
      show(b_dart(p, 762, 420, 858, 354 + k * 100, { stroke: col }), m(mark));
      show(b_box(p, 870, 316 + k * 100, 600, [str], { col, fill, hgt: 76, size: 22 }), m(mark));
    });
  }],

  ['aantonen', 'Aantonen', (m) => {
    const p = panel(0);
    b_head(p, '5.20.03 · AANTONEN');
    b_kop(p, '5.20.03', 'de leverancier toont aan');
    const tO = m('obw'), tD = m('derden');
    show(c9_org(p), .3); show(c9_lev(p), .3);
    show(put(b_caps(p, 'AFSPRAAK IN HET CONTRACT', 120, 264), { o: 0 }), .5);
    // The supplier's evidence: all requirements met, in design, existence and operation.
    b_rise(b_sheet(p, 560, 290, 480, 310, 'BEWIJS VAN DE LEVERANCIER'), tO);
    b_arrow(p, 1300, 1054, 430, tO + .2); b_arrow(p, 546, 300, 430, tO + .9);
    ['opzet', 'bestaan', 'werking'].forEach((str, k) => {
      const g = G(p, { o: 0 }), y = 386 + k * 60;
      b_tick(g, 608, y, COL.task);
      T(g, str, { x: 644, y: y + 9, size: 27, weight: 600 });
      show(g, tO + 2.6 + k * .75);
    });
    // It rests on research by independent third parties: their stamp lands on the evidence.
    show(b_icon(p, 'loep', { x: 1400, y: 640, s: 1.2, o: 0, stroke: COL.task }), tD);
    b_txt(p, 'onafhankelijke derde', 1400, 716, tD, { size: 21, weight: 600 });
    const stamp = b_stamp(p, 1180, 650, 'ONAFHANKELIJK ONDERZOCHT', 340);
    show(stamp, tD + .5, .3); tw(stamp, { x: 850, y: 566 }, tD + 1, .9, io);
  }],

  ['scope', 'Wat het onderzoek dekt', (m) => {
    const p = panel(0);
    b_head(p, '5.20.03 · AANTONEN');
    b_kop(p, '5.20.03', 'wat het onderzoek dekt');
    const tS = m('scope'), tK = m('keten'), tJ = m('jaar'), cx = 1320, cy = 440, R = 100;
    show(b_party(p, 300, 470, 'bedrijf', 'leverancier', { s: 1.3, lab: 84 }), .3);
    // The research covers the whole contracted service: one frame around the supplier and the chain behind it.
    const frame = G(p, { o: 0 });
    b_rect(frame, 130, 290, 1010, 330, { stroke: COL.task });
    b_caps(frame, 'HET ONDERZOEK DEKT DE GECONTRACTEERDE DIENSTVERLENING', 158, 332, { fill: COL.task });
    show(frame, tS);
    [640, 820, 1000].forEach((x, k) => {
      const g = G(p, { o: 0 });
      path(g, `M${k ? x - 136 : 362} 470H${x - 44}`, { stroke: COL.dim, 'stroke-width': 3 });
      b_icon(g, 'bedrijf', { x, y: 470, s: .9 });
      show(g, tK + k * .3);
    });
    b_txt(p, 'toeleveranciers', 820, 554, tK + .3, { size: 22, weight: 600 });
    b_txt(p, 'met expliciet aandacht voor de toeleveringsketen', 635, 664, tK + 1, { size: 22, weight: 600 });
    b_txt(p, 'en voor hoe de leverancier zijn eigen leveranciers beheert', 635, 696, tK + 4, { size: 20, fill: COL.dim });
    // And the supplier shows it again every year.
    show(b_year(p, cx, cy, R), tJ);
    const hand = G(p, { x: cx, y: cy, o: 0 });
    mk('circle', { cx: 0, cy: -R, r: 11, fill: COL.task }, hand);
    show(hand, tJ + .2, .3); tw(hand, { r: 360 }, tJ + .4, 2.2, io);
    show(b_chip(p, cx - 100, cy - R - 62, 200, 'aangetoond', { col: COL.task, fill: COL.task, hgt: 38, size: 17, bg: COL.board }), tJ + 2.5);
    b_txt(p, 'elk jaar opnieuw', cx, cy + R + 60, tJ + .4, { size: 23, weight: 600, fill: COL.task });
  }],

  ['eigen', 'Zelf onderzoeken', (m) => {
    const p = panel(0);
    b_head(p, '5.20.04 · ZELFSTANDIG ONDERZOEK');
    b_kop(p, '5.20.04', 'de organisatie onderzoekt zelf');
    const tV = m('val'), tA = m('audit'), tR = m('rest');
    show(c9_org(p, 380), .3); show(c9_lev(p, 390), .3);
    // The organisation's own magnifying glass travels to the supplier.
    draw(path(p, 'M310 380H1290', { stroke: COL.edge, 'stroke-width': 3 }, { d: 0 }), .5, 1.6);
    const lens = b_icon(p, 'loep', { x: 340, y: 372, s: 1.2, o: 0, stroke: COL.task });
    show(lens, .5, .3); tw(lens, { x: 1250 }, .7, 1.7, io);
    b_txt(p, 'zelfstandig onderzoek', 800, 330, .6, { size: 24, weight: 600, fill: COL.task });
    // Also to check what the supplier reports.
    b_rise(b_sheet(p, 600, 410, 400, 130, 'RAPPORTAGE VAN DE LEVERANCIER'), tV);
    const ok = G(p, { o: 0 });
    b_tick(ok, 644, 500, COL.task);
    T(ok, 'gevalideerd', { x: 676, y: 508, size: 23, weight: 600, fill: COL.task });
    show(ok, tV + 1.6);
    // What makes that possible, and what happens with what remains.
    show(b_box(p, 120, 606, 600, ['in het contract:', 'een externe audit is mogelijk'], { col: COL.task, fill: COL.task, hgt: 100, size: 23 }), tA);
    show(put(b_matrix(p, 826, 656, 1.2), { o: 0 }), tR);
    show(b_box(p, 890, 606, 590, ['restrisico’s: beheerst met de', 'vastgestelde risicomanagementmethodiek'], { hgt: 100, size: 21 }), tR);
  }],

  ['transparant', 'Transparantie', (m) => {
    const p = panel(0);
    b_head(p, '5.20.05 · TRANSPARANTIE');
    b_kop(p, '5.20.05', 'de leverancier is transparant');
    const tT = m('tr'), tR = m('reageer');
    show(c9_org(p, 400), .3); show(c9_lev(p, 410), .3);
    // Two kinds of news travel from the supplier to the organisation.
    b_arrow(p, 1300, 300, 540, tT + .2);
    b_txt(p, 'transparant', 800, 574, tT + .4, { size: 21, weight: 600, fill: COL.task });
    [[290, ['kwetsbaarheden in de dienstverlening'], 72, tT], [380, ['informatiebeveiligingsincidenten,', 'waaronder datalekken'], 96, m('inc')]].forEach(([y, lines, hgt, t0]) => {
      const g = put(b_box(p, 520, y, 560, lines, { col: COL.bad, fill: COL.bad, hgt, size: 22 }), { x: 300 });
      show(g, t0, .3); tw(g, { x: 0 }, t0 + .1, .9, io);
    });
    // So that the organisation can respond.
    b_kick(p, 'PASSEND REAGEREN, ONDER MEER', 120, COL.dim, tR, 636);
    show(b_box(p, 120, 652, 300, ['rapporteren']), tR + .4);
    show(b_box(p, 440, 652, 460, ['mitigerende maatregelen nemen']), tR + 2.6);
  }],

  ['exit', 'Afhankelijkheid en exit', (m) => {
    const p = panel(0);
    b_head(p, '5.20.06 · AFHANKELIJKHEID EN EXIT');
    b_kop(p, '5.20.06', 'afhankelijkheid en exit-strategie');
    const tA = m('afh'), tE = m('exit');
    // Before the contract: is the dependence manageable?
    const pre = G(p, { o: 0, y: 14 });
    b_caps(pre, 'VÓÓR HET CONTRACT', 120, 292);
    b_rect(pre, 120, 310, 600, 260, { fill: COL.panel, stroke: COL.task, sw: 3 });
    b_matrix(pre, 222, 440, 1.5);
    T(pre, 'is de afhankelijkheid van', { x: 316, y: 420, size: 25, weight: 600, fill: COL.task });
    T(pre, 'de leverancier beheersbaar?', { x: 316, y: 454, size: 25, weight: 600, fill: COL.task });
    T(pre, 'bepaald in een risicoafweging', { x: 316, y: 496, size: 20, fill: COL.dim });
    b_rise(pre, tA);
    b_arrow(p, 736, 824, 440, tE);
    // In the contract: the way out, worked out explicitly.
    const con = b_sheet(p, 840, 310, 620, 260, 'CONTRACT', 2);
    b_caps(con, 'IN HET CONTRACT', 840, 292);
    b_caps(con, 'VAST ONDERDEEL', 868, 440, { fill: COL.task, size: 13 });
    b_rise(con, tE);
    show(b_box(p, 868, 452, 564, ['exit-strategie, expliciet uitgewerkt'], { col: COL.task, fill: COL.task, hgt: 76 }), tE + .7);
  }],

  ['q1', 'Controlevraag', () => {
    // The contract with five agreements, as rows to point at.
    const p = panel(0);
    b_head(p, '5.20 · AFSPRAKEN IN HET CONTRACT');
    b_rise(b_sheet(p, 330, 196, 940, 414, 'CONTRACT MET DE LEVERANCIER'), .3);
    S.rowsQ = C9_Q1.map((str, i) => {
      const g = b_box(p, 370, c9_q1Y(i), 860, [str], { hgt: 56, size: 22 });
      show(g, .7 + i * .1);
      return g;
    });
  }, { ask: done => {
    const items = S.rowsQ.map((g, i) => ({ el: g, box: [370, c9_q1Y(i), 860, 56], label: C9_Q1[i] }));
    const wrong = (hint) => () => 'Dat is een andere afspraak. ' + hint;
    quiz(WIDE, [{
      id: 'c-contract-1', prompt: ['De leverancier ontdekt een datalek. Welke afspraak zorgt dat de organisatie het hoort?'],
      build: pickEls(items, 3, '5.20.05: de leverancier is transparant over kwetsbaarheden en incidenten, waaronder datalekken.',
        wrong('Een datalek melden valt onder transparantie over kwetsbaarheden en incidenten (5.20.05).')),
    }, {
      id: 'c-contract-2', prompt: ['De organisatie wil de rapportages zelf laten toetsen. Welke afspraak maakt dat mogelijk?'],
      build: pickEls(items, 2, '5.20.04: in het contract staat dat een externe audit mogelijk is.',
        wrong('Zelf laten toetsen kan doordat een externe audit mogelijk is (5.20.04).')),
    }, {
      id: 'c-contract-3', prompt: ['Het contract wordt beëindigd. Wat is daarvoor vooraf uitgewerkt?'],
      build: pickEls(items, 4, '5.20.06: een expliciet uitgewerkte exit-strategie is een vast onderdeel van het contract.',
        wrong('Voor het beëindigen is de exit-strategie uitgewerkt (5.20.06).')),
