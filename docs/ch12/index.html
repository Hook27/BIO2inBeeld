<script>
'use strict';
// Hoofdstuk 12: de overheidsmaatregelen 6.01.01 tot en met 7.10.03 van de BIO2 (pagina 21 tot en met 23): screening,
// verantwoordelijkheden, bewustzijn en training, melden; beveiligde zones, waarschuwen, het token en opslagmedia.
// The first chapter of part C. Two halves, each with its own overview and its own strip: the people controls (6.x)
// and the physical controls (7.x). Beat ids match content/bio2/ch12/narration.nl.json. One idea per beat.
const CHAPTER = { number: 12, title: 'De mens en de fysieke omgeving', minutes: 7, language: 'nl', next: '../ch13/' };

/* ---------- chapter data (used by the helpers and inside BEATS, so defined first) ---------- */
// The strips: a run of controls without a government measure is one dashed step.
const C12_TABS6 = ['6.01', '6.02', '6.03', '6.04–6.07', '6.08'];
const C12_TABS7 = ['7.01', '7.02', '7.03–7.06', '7.07', '7.08–7.09', '7.10', '7.11–7.14'];
// The controls of ISO 27002 (topics shortened, in our own words) with their government measures in the BIO2.
const C12_MENS = [
  { code: '6.1', topic: ['screening'], nrs: ['6.01.01'] },
  { code: '6.2', topic: ['arbeidsovereenkomst'], nrs: ['6.02.01'] },
  { code: '6.3', topic: ['bewustwording,', 'opleiding en training'], nrs: ['6.03.01', '6.03.02', '6.03.03', '6.03.04'] },
  { code: '6.4', topic: ['disciplinaire', 'procedure'], nrs: [] },
  { code: '6.5', topic: ['na einde of wijziging', 'van het dienstverband'], nrs: [] },
  { code: '6.6', topic: ['geheimhoudings-', 'overeenkomsten'], nrs: [] },
  { code: '6.7', topic: ['werken op afstand'], nrs: [] },
  { code: '6.8', topic: ['gebeurtenissen', 'melden'], nrs: ['6.08.01'] },
];
const C12_FYSIEK = [
  { code: '7.1', topic: ['fysieke', 'beveiligingszones'], nrs: ['7.01.02'], note: '7.01.01 vervallen' },
  { code: '7.2', topic: ['fysieke', 'toegangsbeveiliging'], nrs: ['7.02.01'] },
  { code: '7.3', topic: ['kantoren, ruimten', 'en faciliteiten'], nrs: [] },
  { code: '7.4', topic: ['fysieke beveiliging', 'monitoren'], nrs: [] },
  { code: '7.5', topic: ['fysieke en', 'omgevingsdreigingen'], nrs: [] },
  { code: '7.6', topic: ['werken in', 'beveiligde zones'], nrs: [] },
  { code: '7.7', topic: ['clear desk en', 'clear screen'], nrs: ['7.07.01'] },
  { code: '7.8', topic: ['apparatuur plaatsen', 'en beschermen'], nrs: [] },
  { code: '7.9', topic: ['bedrijfsmiddelen', 'buiten het terrein'], nrs: [] },
  { code: '7.10', topic: ['opslagmedia'], nrs: ['7.10.01', '7.10.02', '7.10.03'] },
  { code: '7.11', topic: ['nutsvoorzieningen'], nrs: [] },
  { code: '7.12', topic: ['bekabeling', 'beveiligen'], nrs: [] },
  { code: '7.13', topic: ['onderhoud van', 'apparatuur'], nrs: [] },
  { code: '7.14', topic: ['apparatuur verwijderen', 'of hergebruiken'], nrs: [] },
];
// The controls that have government measures, as cards for the two quick checks: [number, icon, label].
const C12_Q1 = [['6.01', 'cert', ['screening']], ['6.02', 'doc', ['verantwoordelijkheden']], ['6.03', 'les', ['bewustzijn', 'en training']], ['6.08', 'proc', ['incidenten', 'melden']]];
const C12_Q2 = [['7.01', 'schild', ['beveiligde', 'zones']], ['7.02', 'contact', ['waarschuwen']], ['7.07', 'slot', ['vergrendelen']], ['7.10', 'usb', ['opslagmedia']]];
Object.assign(ICON, {
  bus: 'M-40 -18H6V16H-40Z M6 -8H24L36 4V16H6 M-30 16a8 8 0 1 0 16 0a8 8 0 1 0 -16 0 M10 16a8 8 0 1 0 16 0a8 8 0 1 0 -16 0',
});

/* ---------- chapter drawing helpers (prefixed c12_; the shared b_ helpers live in ../lib/engine.js) ---------- */
// A tile of an overview: the control's code, its topic, and its government measures or 'geen overheidsmaatregel'.
// big: the roomy tiles of the first overview, with the chip for the guideline; t0: when the lower half appears.
const c12_tile = (p, c, x, y, w, h, i, t0, big) => {
  const g = G(p, { o: 0, y: 12 }), pad = big ? 24 : 16, per = big ? 2 : 3, yb = y + h - (big ? 100 : 46);
  b_rect(g, x, y, w, h, { fill: COL.panel });
  T(g, c.code, { x: x + pad, y: y + (big ? 52 : 40), size: big ? 34 : 28, fill: COL.iso, weight: 700, font: MONO });
  c.topic.forEach((str, k) => T(g, str, { x: x + pad, y: y + (big ? 92 : 66) + k * (big ? 27 : 21), size: big ? 21 : 17 }));
  tw(g, { o: 1, y: 0 }, .3 + i * .06, .5, out);
  if (c.nrs.length) {
    c.nrs.forEach((nr, k) => show(b_chip(g, x + pad + (k % per) * (big ? 140 : 80), yb + Math.floor(k / per) * 46, big ? 128 : 74, nr,
      { col: COL.task, fill: COL.task, hgt: big ? 38 : 32, size: big ? 17 : 13 }), t0 + k * .08));
    if (c.note) show(T(g, c.note, { x: x + pad + 84, y: yb + 21, size: 12, fill: COL.dim, font: MONO, o: 0 }), t0 + .6);
  } else {
    show(T(g, 'geen overheidsmaatregel', { x: x + pad, y: yb + (big ? 16 : 22), size: big ? 16 : 13, fill: COL.dim, font: MONO, o: 0 }), t0);
    if (big) show(b_chip(g, x + pad, yb + 34, 256, 'richtlijn uit ISO 27002', { col: COL.iso, fill: COL.iso, hgt: 40, size: 17 }), t0 + 1.4);
  }
  return g;
};
// The staff of an organisation, on the left: three internal and two external employees. Returns the two groups, hidden.
const c12_staff = p => [[[180, 280, 380], 330, 'interne medewerkers'], [[230, 330], 520, 'externe medewerkers']].map(([xs, y, str]) => {
  const g = G(p, { o: 0 });
  xs.forEach(x => b_icon(g, 'persoon', { x, y, s: 1.1 }));
  T(g, str, { x: 280, y: y + 76, size: 22, weight: 600, anchor: 'middle' });
  return g;
});
// The source line (b_source) and the cards of the quick checks (b_cards, b_cardItems) started here and moved to the
// engine when chapter 13 needed them; so did the icon 'usb'.

/* ---------- beats: [id, title, run(m, D), { ask, hold }?] ---------- */
const BEATS = [
  ['intro', 'Mens en gebouw', (m, D) =>
    b_title(m, D, 'DEEL C · MENS, GEBOUW EN TECHNIEK · HOOFDSTUK 12', 'Mens en gebouw', 'Screening, bewustzijn en training; beveiligde zones en opslagmedia.')],

  ['deelc', 'Deel C', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 2 · HET EERSTE CIJFER VAN HET NUMMER');
    b_txt(p, 'het eerste cijfer zegt om welk soort beheersmaatregel het gaat', 800, 222, .4, { size: 25, fill: COL.dim });
    // The four kinds of control in ISO 27002; this chapter covers the six and the seven.
    [['5', 'organisatorisch', '5.01 – 5.37', 'HOOFDSTUK 6 – 11', 'vijf', false], ['6', 'mensgericht', '6.01 – 6.08', 'DIT HOOFDSTUK', 'zes', true],
      ['7', 'fysiek', '7.01 – 7.14', 'DIT HOOFDSTUK', 'zeven', true], ['8', 'technologisch', '8.01 – 8.34', 'HOOFDSTUK 13 – 15', 'acht', false]].forEach(([d, name, range, where, mark, now], i) => {
      const x = 120 + i * 350, g = G(p, { o: 0, y: 14 });
      b_rect(g, x, 270, 330, 330, { fill: COL.panel, stroke: now ? COL.task : COL.edge, sw: now ? 3 : 2 });
      T(g, d, { x: x + 165, y: 396, size: 110, fill: COL.iso, weight: 700, anchor: 'middle', font: MONO });
      T(g, name, { x: x + 165, y: 458, size: 28, weight: 600, anchor: 'middle' });
      T(g, range, { x: x + 165, y: 498, size: 20, fill: COL.dim, anchor: 'middle', font: MONO });
      b_caps(g, where, x + 165, 562, { fill: now ? COL.task : COL.faint, anchor: 'middle' });
      if (!i) b_tick(g, x + 292, 306);
      b_rise(g, m(mark));
    });
    b_txt(p, 'BRON INDELING: NEN-EN-ISO/IEC 27002:2022', 120, 650, 1.6, { size: 14, fill: COL.faint, anchor: 'start', weight: 700, font: MONO }).setAttribute('letter-spacing', '1.5');
  }],

  ['mens', '6.01 tot en met 6.08', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 2 · 6.01 TOT EN MET 6.08');
    // The strip of the first half: the people controls. The four without a government measure are one dashed step.
    b_tabs(C12_TABS6, .4);
    b_tabNone(3);
    const tV = m('vier'), tG = m('geen');
    let withNr = 0, without = 0;
    C12_MENS.forEach((c, i) => c12_tile(p, c, 120 + (i % 4) * 346, 150 + (i >> 2) * 266, 320, 250, i,
      c.nrs.length ? tV + .2 + withNr++ * .25 : tG + .2 + without++ * .15, true));
    b_source(p, 700);
    b_txt(p, 'samen zeven overheidsmaatregelen', 800, 752, tV + 1.6, { size: 27, weight: 600, fill: COL.task });
  }],

  ['screening', 'Screening', (m) => {
    const p = panel(0);
    b_head(p, '6.01.01 · SCREENING');
    b_tab(0, .2);
    b_kop(p, '6.01.01', 'screening');
    const tB = m('beleid'), tV = m('vast'), tW = m('wanneer'), tK = m('kan'), tR = m('risico');
    // The screening policy, adopted: the stamp lands on it.
    b_rise(b_sheet(p, 120, 262, 420, 260, 'SCREENINGSBELEID', 3), tB);
    const stamp = b_stamp(p, 330, 620, 'VASTGESTELD');
    show(stamp, tV, .3); tw(stamp, { x: 404, y: 476 }, tV + .4, .9, io);
    // Two moments at which a certificate of conduct can be asked for; 'can', so a dashed arrow.
    show(b_box(p, 640, 290, 300, ['bij indiensttreding'], { hgt: 60, size: 22 }), tW);
    show(b_box(p, 640, 366, 300, ['bij functiewijziging'], { hgt: 60, size: 22 }), tW + .9);
    show(b_dart(p, 952, 358, 1046, 358, { stroke: COL.task, dash: true }), tK);
    b_txt(p, 'kan', 999, 338, tK, { size: 21, weight: 600, fill: COL.task });
    const vog = G(p, { o: 0, y: 14 });
    b_rect(vog, 1060, 262, 400, 200, { fill: COL.panel, stroke: COL.task, sw: 3 });
    b_icon(vog, 'cert', { x: 1130, y: 356, s: 1.2, stroke: COL.task });
    T(vog, 'Verklaring Omtrent', { x: 1200, y: 340, size: 24, weight: 600, fill: COL.task });
    T(vog, 'het Gedrag', { x: 1200, y: 372, size: 24, weight: 600, fill: COL.task });
    b_caps(vog, 'VOG', 1200, 410, { fill: COL.task, size: 17 });
    b_rise(vog, tK + .3);
    show(b_box(p, 640, 520, 820, ['of dat gebeurt: op basis van een risicoafweging'], { col: COL.task, fill: COL.task, hgt: 70, size: 23 }), tR);
    show(put(b_matrix(p, 1400, 555, .7), { o: 0 }), tR);
  }],

  ['gewezen', 'Verantwoordelijkheden', (m) => {
    const p = panel(0);
    b_head(p, '6.02.01 · VERANTWOORDELIJKHEDEN');
    b_tab(1, .2);
    b_kop(p, '6.02.01', 'gewezen op verantwoordelijkheden');
    const tA = m('alle'), tW = m('wijzen'), tM = m('moment'), tT = m('toeg');
    const [inn, ext] = c12_staff(p);
    show(inn, tA); show(ext, tA + .8);
    // They are pointed to their responsibilities, at two moments.
    show(put(b_caps(p, 'GEWEZEN OP', 560, 366, { fill: COL.task }), { o: 0 }), tW);
    show(b_box(p, 560, 380, 420, ['verantwoordelijkheden voor', 'informatiebeveiliging'], { col: COL.task, fill: COL.task, hgt: 100, size: 23 }), tW);
    show(b_dart(p, 548, 410, 446, 350, { stroke: COL.task }), tW + .4);
    show(b_dart(p, 548, 450, 400, 520, { stroke: COL.task }), tW + .6);
    show(b_box(p, 560, 506, 190, ['bij aanstelling'], { hgt: 54, size: 19 }), tM);
    show(b_box(p, 762, 506, 218, ['bij functiewisseling'], { hgt: 54, size: 19 }), tM + 1.6);
    // What applies to them is easy to find.
    b_rise(b_sheet(p, 1080, 300, 400, 230, 'REGELINGEN EN INSTRUCTIES', 3), tT);
    show(put(b_tick(p, 1108, 572), { o: 0 }), tT + .8);
    b_txt(p, 'eenvoudig toegankelijk', 1136, 580, tT + .8, { size: 23, weight: 600, fill: COL.task, anchor: 'start' });
  }],

  ['verantwoordelijk', 'Beschermen', (m) => {
    const p = panel(0);
    b_head(p, '6.03.01 · BEWUSTWORDING');
    b_tab(2, .2);
    b_kop(p, '6.03.01', 'bedrijfsinformatie beschermen');
    const tD = m('drie'), tR = m('regels'), tU = m('rubr');
    show(b_party(p, 1200, 322, 'schild', 'bedrijfsinformatie', { s: 1.7, lab: 96, col: COL.task }), .4);
    // Three groups share the responsibility.
    ['medewerkers', 'lijnmanagers', 'bestuurders'].forEach((name, k) => show(b_role(p, 250 + k * 250, 330, name, COL.task), tD + k * .5));
    b_arrow(p, 840, 1076, 330, tD + 1.6, { stroke: COL.task });
    b_txt(p, 'verantwoordelijk', 958, 308, tD + 1.6, { size: 20, weight: 600, fill: COL.task });
    show(b_box(p, 170, 480, 740, ['iedereen kent de regels en verplichtingen', 'voor informatiebeveiliging'], { hgt: 96, size: 23 }), tR);
    // Where relevant: a dashed frame.
    const extra = b_box(p, 170, 600, 740, ['waar relevant: de speciale eisen', 'voor gerubriceerde omgevingen'], { col: COL.dim, hgt: 96, size: 22, weight: 500 });
    extra.firstChild.setAttribute('stroke-dasharray', '8 7');
    show(extra, tU);
  }],

  ['training', 'Training', (m) => {
    const p = panel(0);
    b_head(p, '6.03.02 · TRAINING');
    b_kop(p, '6.03.02', 'training binnen drie maanden');
    const tW = m('wie'), tT = m('train'), tD = m('drie'), x0 = 1000, step = 140;
    show(b_party(p, 200, 350, 'persoon', 'medewerkers', { s: 1.3, lab: 80 }), tW);
    show(b_party(p, 420, 350, 'bedrijf', 'contractanten', { s: 1.2, lab: 80 }), tW + .8);
    b_txt(p, 'die informatiesystemen', 310, 496, tW + 1.6, { size: 20, fill: COL.dim });
    b_txt(p, 'en -diensten gebruiken', 310, 522, tW + 1.6, { size: 20, fill: COL.dim });
    // The training, named as the BIO2 names it.
    b_arrow(p, 530, 616, 350, tT);
    const tr = b_tile(p, { x: 630, y: 250, w: 280, h: 200, icon: 'les', iconY: 78, iconS: 1.4, col: COL.task });
    put(b_chip(tr, 646, 388, 248, 'training I-bewustzijn', { col: COL.task, fill: COL.task, hgt: 40, size: 16 }), { o: 1 });
    b_rise(tr, tT);
    // Within three months after starting: the bar runs to the third month.
    const line = G(p, { o: 0 });
    path(line, `M${x0} 350H${x0 + step * 3 + 40}`, { stroke: COL.edge, 'stroke-width': 3 });
    ['in dienst', '1', '2', '3 maanden'].forEach((str, k) => {
      path(line, `M${x0 + k * step} 338V362`, { stroke: COL.dim, 'stroke-width': 3 });
      T(line, str, { x: x0 + k * step, y: 394, size: 18, fill: COL.dim, anchor: 'middle', font: MONO });
    });
    show(line, tD - .4);
    b_arrow(p, 922, 984, 350, tD - .4);
    draw(path(p, `M${x0} 350H${x0 + step * 3}`, { stroke: COL.task, 'stroke-width': 9 }, { d: 0 }), tD, 1.6);
    b_txt(p, 'binnen drie maanden na indiensttreding', x0 + step * 1.5, 470, tD + .4, { size: 22, weight: 600, fill: COL.task });
    show(put(b_tick(p, x0 + 40, 506), { o: 0 }), tD + 2);
    b_txt(p, 'aantoonbaar en met succes gevolgd', x0 + 64, 514, tD + 2, { size: 21, anchor: 'start' });
  }],

  ['management', 'Het management', (m) => {
    const p = panel(0);
    b_head(p, '6.03.03 · OPLEIDING EN TRAINING');
    b_kop(p, '6.03.03', 'het management benadrukt en stimuleert');
    const tB = m('belang'), tW = m('wanneer'), tV = m('bv'), tS = m('stim');
    show(b_role(p, 220, 340, 'management', COL.task), .3);
    b_arrow(p, 290, 396, 340, tB, { stroke: COL.task });
    show(b_box(p, 410, 290, 400, ['het belang van opleiding', 'en training'], { col: COL.task, fill: COL.task, hgt: 100, size: 23 }), tB);
    b_arrow(p, 822, 916, 340, tB + .8, { stroke: COL.task });
    const staff = G(p, { o: 0 });
    [1000, 1100, 1200].forEach(x => b_icon(staff, 'persoon', { x, y: 330, s: 1.1 }));
    T(staff, 'medewerkers en contractanten', { x: 1100, y: 412, size: 22, weight: 600, anchor: 'middle' });
    show(staff, tB + .8);
    // When: two fixed moments, and two examples (dashed).
    show(put(b_caps(p, 'BIJ', 410, 500), { o: 0 }), tW);
    show(b_box(p, 410, 512, 190, ['aanstelling'], { hgt: 54, size: 20 }), tW);
    show(b_box(p, 612, 512, 270, ['interne overplaatsing'], { hgt: 54, size: 20 }), tW + 1);
    show(put(b_caps(p, 'EN BIJVOORBEELD IN', 410, 610), { o: 0 }), tV);
    [['het werkoverleg', 410, 210], ['een personeelsgesprek', 632, 250]].forEach(([str, x, w], k) => {
      const g = b_box(p, x, 622, w, [str], { col: COL.dim, hgt: 54, size: 20, weight: 500 });
      g.firstChild.setAttribute('stroke-dasharray', '8 7');
      show(g, tV + k * 1.4);
    });
    // And it actively encourages them to keep following training.
    show(put(b_caps(p, 'STIMULEERT ACTIEF', 1000, 500, { fill: COL.task }), { o: 0 }), tS);
    show(put(path(p, 'M1000 548H1440', { stroke: COL.edge, 'stroke-width': 3 }), { o: 0 }), tS);
    [0, 1, 2, 3].forEach(k => show(put(mk('circle', { cx: 1044 + k * 118, cy: 548, r: 9, fill: COL.task }, p), { o: 0 }), tS + 1.6 + k * .3));
    b_txt(p, 'training periodiek volgen', 1000, 604, tS + 1.2, { size: 23, weight: 600, anchor: 'start' });
  }],

  ['mobiel', 'Mobiel werken', (m) => {
    const p = panel(0);
    b_head(p, '6.03.04 · MOBIEL WERKEN');
    b_kop(p, '6.03.04', 'veilig mobiel werken');
    const tM = m('mob');
    b_rise(b_sheet(p, 140, 270, 640, 300, 'BEWUSTWORDINGSPROGRAMMA', 2), .3);
    show(b_box(p, 168, 420, 584, ['gedragsaspecten van', 'veilig mobiel werken'], { col: COL.task, fill: COL.task, hgt: 100, size: 24 }), tM);
    show(b_icon(p, 'laptop', { x: 1030, y: 400, s: 1.8, o: 0 }), tM + .4);
    show(b_icon(p, 'telefoon', { x: 1250, y: 392, s: 1.6, o: 0 }), tM + .8);
    b_txt(p, 'mobiel werken', 1130, 520, tM + .8, { size: 23, fill: COL.dim });
  }],

  ['melden', 'De meldingsprocedure', (m) => {
    const p = panel(0);
    b_head(p, '6.08.01 · INCIDENTEN MELDEN');
    b_tab(4, .2);
    b_kop(p, '6.08.01', 'de meldingsprocedure kennen');
    const tA = m('alle'), tP = m('proc'), tH = m('h10');
    b_rise(b_sheet(p, 940, 270, 520, 300, 'MELDINGSPROCEDURE', 2), .3);
    show(b_box(p, 968, 420, 464, ['informatiebeveiligingsincidenten'], { col: COL.bad, fill: COL.bad, hgt: 62, size: 22 }), .8);
    const [inn, ext] = c12_staff(p);
    show(inn, tA); show(ext, tA + .8);
    // All of them have taken note of it, and that can be shown.
    b_arrow(p, 470, 548, 430, tP, { stroke: COL.task });
    show(b_box(p, 560, 380, 280, ['aantoonbaar', 'kennisgenomen'], { col: COL.task, fill: COL.task, hgt: 100, size: 23 }), tP);
    b_arrow(p, 852, 926, 430, tP + .6, { stroke: COL.task });
    show(put(b_caps(p, 'ZIE OOK HOOFDSTUK 10', 1200, 610, { anchor: 'middle' }), { o: 0 }), tH);
  }],

  ['q1', 'Controlevraag', () => {
    // The four people controls that have government measures, as cards to point at.
    const p = panel(0);
    b_head(p, 'DEEL 2 · 6.01 TOT EN MET 6.08');
    b_tab(-1, .2);
    b_txt(p, 'de vier mensgerichte beheersmaatregelen met overheidsmaatregelen', 800, 232, .3, { size: 26, fill: COL.dim });
    S.cards = b_cards(p, C12_Q1);
  }, { ask: done => {
    const items = b_cardItems(S.cards, C12_Q1);
