<script>
'use strict';
// Hoofdstuk 3: §6 (risicomanagement), §7 (verklaring van toepasselijkheid), §16 (aanvullende maatregelen)
// en §17 (impact van risico's) van de BIO2. Beat ids match content/bio2/ch03/narration.nl.json. One idea per beat.
const CHAPTER = { number: 3, title: 'Risico’s in vijf stappen', minutes: 9, language: 'nl', next: '../ch04/' };

/* ---------- chapter drawing helpers (prefixed c3_; the shared b_ helpers live in ../lib/engine.js) ---------- */
Object.assign(ICON, {
  klok: 'M-14 0a14 14 0 1 0 28 0a14 14 0 1 0 -28 0 M0 -8V0L6 4',   // 'slot' started here and moved to the engine when chapter 12 needed it
  gevaar: 'M0 -30L32 26H-32Z M0 -10V8 M0 16V18',
  opening: 'M0 -36V-10 M0 10V36 M-12 -10H12 M-12 10H12',
  gevolg: 'M0 -32V-14 M0 14V32 M-32 0H-14 M14 0H32 M-23 -23L-10 -10 M10 10L23 23 M-23 23L-10 10 M10 -10L23 -23',
});
// A part of the risk management method: frame, its number in amber, a title and sub lines. Hidden and a little low.
const c3_part = (p, n, x, y, w, hgt, title, subs = []) => {
  const g = G(p, { o: 0, y: 14 });
  b_rect(g, x, y, w, hgt, { fill: COL.panel });
  T(g, String(n), { x: x + 26, y: y + 50, size: 32, fill: COL.task, weight: 700, font: MONO });
  T(g, title, { x: x + 66, y: y + 48, size: 27, weight: 600 });
  subs.forEach((str, i) => T(g, str, { x: x + 66, y: y + 84 + i * 26, size: 19, fill: COL.dim }));
  return g;
};
// The tile of impact area i (C3_IMPACT), entering at t0.
const c3_area = (p, i, t0) => {
  const x = 230 + (i % 4) * 310, y = 290 + Math.floor(i / 4) * 180, g = G(p, { o: 0, y: 12 });
  b_rect(g, x, y, 290, 150, { fill: COL.panel });
  T(g, String(i + 1), { x: x + 20, y: y + 36, size: 19, fill: COL.dim, weight: 700, font: MONO });
  C3_IMPACT[i].forEach((str, k) => {
    const look = { x: x + 145, y: y + 86 + k * 28, size: 20, weight: 600, anchor: 'middle' };
    if (str === 'management control') b_term(g, str, 'management-control', { ...look, o: 1 });   // English: said in Dutch, heard on a click
    else T(g, str, look);
  });
  tw(g, { o: 1, y: 0 }, t0, .45, out);
};

/* ---------- chapter data (used inside BEATS, so defined above it) ---------- */
const C3_STEPS = ['1 CONTEXT', '2 METHODIEK', '3 IDENTIFICATIE', '4 ANALYSE', '5 BEHANDELING'];
// The four things you establish when identifying a risk (BIO2 §6.3), laid out as cause and effect.
const C3_RISK = [
  { mark: 'dreig', icon: 'gevaar', name: 'bedreiging', sub: 'wat kan er gebeuren', col: COL.bad },
  { mark: 'kwets', icon: 'opening', name: 'kwetsbaarheid', sub: 'waar zit de zwakke plek', col: COL.chalk },
  { mark: 'middel', icon: 'db', name: 'waardevol middel', sub: 'informatie en middelen', col: COL.chalk },
  { mark: 'gevolg', icon: 'gevolg', name: 'consequentie', sub: 'wat zijn de gevolgen', col: COL.chalk },
];
const C3_RX = i => 130 + i * 350;
// The risk matrix: cell (c, r) with c = likelihood and r = impact, counted from the bottom left. Schematic risks.
const C3_MX = c => 460 + c * 96, C3_MY = r => 640 - (r + 1) * 96;
const C3_DOTS = [[3, 3], [1, 3], [2, 1], [0, 0], [3, 1], [1, 2]];
// The impact areas an organisation weighs at least (BIO2 §17), in the order of the text.
const C3_IMPACT = [['politieke schade', 'aan een bestuurder'], ['diplomatieke', 'schade'], ['financiële', 'gevolgen'], ['directe', 'imagoschade'],
  ['verlies van publiek', 'respect of vertrouwen'], ['organisatiebrede', 'negatieve publiciteit'], ['significant verlies van', 'motivatie van medewerkers'], ['belangrijk verlies van', 'management control']];
// The kinds of information weighed for additional measures (BIO2 §16) and, schematically, how many extra blocks.
const C3_INFO = [[['open data'], 0], [['(bijzondere)', 'persoonsgegevens'], 2], [['gevoelige of', 'interne informatie'], 1], [['gerubriceerde', 'informatie'], 3]];
// Rows of the statement of applicability: controls from ISO 27002, then government measures from the BIO.
const C3_VVT = [['5.15', 'toegangsbeveiliging', 1], ['5.17', 'authenticatie-informatie', 1], ['8.13', 'back-up van informatie', 0], ['8.30', 'uitbestede ontwikkeling', -1],
  ['5.17.01', 'meerfactorauthenticatie', 1], ['5.17.02', 'wachtwoordmanager', 1], ['8.13.04', 'herstelprocedure testen', 0]];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Risico’s in vijf stappen', (m, D) =>
    b_title(m, D, 'DEEL A · HET KADER · HOOFDSTUK 3', 'Risico’s in vijf stappen', 'Hoe je risico’s vindt, weegt en behandelt, en wat je daarover vastlegt.')],

  ['kern', 'De kern', (m) => {
    const p = panel(0);
    b_head(p, '§ 6 · RISICOMANAGEMENT');
    b_txt(p, 'risicomanagement', 800, 236, .2, { size: 46, weight: 600 });
    show(b_chip(p, 330, 280, 450, 'kernonderdeel van ISO 27001', { col: COL.iso, fill: COL.iso, hgt: 52 }), .5);
    show(b_chip(p, 820, 280, 450, 'basis van de BIO-aanpak', { col: COL.task, fill: COL.task, hgt: 52 }), m('basis'));
    // What it is for: four verbs, and round again.
    ['identificeren', 'beoordelen', 'beheersen', 'monitoren'].forEach((str, i) => {
      const x = 150 + i * 340, t0 = m('abcd'[i]);
      show(b_chip(p, x, 470, 280, str, { hgt: 120, size: 26 }), t0);
      if (i) b_arrow(p, x - 50, x - 10, 530, t0 - .2);
    });
    draw(path(p, 'M1310 596V672H290V602 M280 618L290 602L300 618', { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), m('d', .5), 1);
    b_txt(p, 'continu', 800, 706, m('d', .9), { size: 24, fill: COL.dim });
  }],

  ['vijf', 'Vijf stappen', (m) => {
    const p = panel(0);
    b_head(p, '§ 6 · RISICOMANAGEMENT');
    b_txt(p, 'het proces in vijf stappen', 800, 230, .2, { size: 34, weight: 600 });
    [['context', 'bepalen'], ['methodiek', 'kiezen'], ['risico’s', 'identificeren'], ['risico’s', 'analyseren'], ['risico’s', 'behandelen']].forEach(([a, b2], i) => {
      const x = 100 + i * 285;
      show(put(b_rect(p, x, 320, 260, 250, { fill: COL.panel }), { o: 0 }), .3 + i * .08);   // the five frames are there at once
      const g = G(p, { o: 0, y: 12 });
      T(g, String(i + 1), { x: x + 28, y: 398, size: 58, fill: COL.task, weight: 700, font: MONO });
      T(g, a, { x: x + 28, y: 468, size: 28, weight: 600 });
      T(g, b2, { x: x + 28, y: 504, size: 28, weight: 600 });
      if (i === 4) T(g, 'en maatregelen selecteren', { x: x + 28, y: 540, size: 17, fill: COL.dim });
      tw(g, { o: 1, y: 0 }, m('s' + (i + 1)), .5, out);
    });
    b_txt(p, 'we nemen ze één voor één door', 800, 660, m('rij'), { size: 26, fill: COL.dim });
  }],

  ['context', 'Context', (m) => {
    const p = panel(0);
    b_head(p, '§ 6.1 · CONTEXTBEPALING');
    b_tabs(C3_STEPS, .3); b_tab(0, .3);
    // The organisation, what is inside it and what acts on it from outside.
    show(put(b_rect(p, 520, 300, 560, 330, { stroke: COL.dim, rx: 12 }), { o: 0 }), .2);
    b_txt(p, 'ORGANISATIE', 548, 340, .2, { size: 17, fill: COL.dim, anchor: 'start', weight: 700, font: MONO }).setAttribute('letter-spacing', '2');
    const tI = m('intern'), tE = m('extern');
    b_txt(p, 'interne factoren', 800, 396, tI, { size: 24, weight: 600 });
    ['processen', 'mensen', 'informatiesystemen'].forEach((str, i) => show(b_chip(p, 670, 418 + i * 60, 260, str), tI + .2 + i * .2));
    [[130, 420, 510, ['ketenpartners', 'leveranciers']], [1190, 1180, 1090, ['dreigingen', 'nieuwe technologie']]].forEach(([x, a1, a2, items], side) => {
      b_txt(p, 'externe factoren', x + 140, 396, tE + side * .5, { size: 24, weight: 600 });
      items.forEach((str, i) => {
        show(b_chip(p, x, 418 + i * 70, 280, str), tE + .2 + side * .5 + i * .2);
        b_arrow(p, a1, a2, 441 + i * 70, tE + .4 + side * .5 + i * .2);
      });
    });
    // And the law.
    b_rise(b_code(p, 800, 150, 'Cbw', 'wettelijke verplichtingen', 420), m('wet'));
    b_down(p, 800, 240, 294, m('wet', .4), COL.iso);
  }],

  ['methodiek', 'Methodiek', (m) => {
    const p = panel(0);
    b_head(p, '§ 6.2 · RISICOMANAGEMENTMETHODIEK');
    b_tab(1, .2);
    b_txt(p, 'een risicomanagementmethodiek kiezen', 800, 200, .2, { size: 34, weight: 600 });
    b_txt(p, 'aansluitend bij NEN-EN-ISO/IEC 27001', 800, 240, .5, { size: 19, fill: COL.iso, weight: 600, font: MONO });
    b_txt(p, 'met ten minste vier onderdelen', 800, 296, m('vier'), { size: 24, fill: COL.dim });
    [['quickscan', 'is het basisniveau toereikend?'], ['volledige risicoanalyse', 'om tot aanvullende maatregelen te komen'],
      ['risicoregister', 'met de tijdelijk geaccepteerde risico’s'], ['opvolging', 'om die risico’s structureel op te lossen']].forEach(([title, sub], i) =>
      b_rise(c3_part(p, i + 1, 170 + (i % 2) * 660, 340 + Math.floor(i / 2) * 170, 600, 140, title, [sub]), m('p' + (i + 1))));
  }],

  ['quickscan', 'Quickscan', (m) => {
    const p = panel(0);
    b_head(p, '§ 6.2 · RISICOMANAGEMENTMETHODIEK');
    // Part 1 asks one question; the answer decides what follows.
    b_rise(c3_part(p, 1, 110, 370, 340, 150, 'quickscan', ['classificatie van proces', 'en informatiesysteem']), .2);
    const tQ = m('vraag');
    b_arrow(p, 460, 550, 445, tQ - .2);
    const ask = G(p, { o: 0 });
    b_rect(ask, 560, 395, 300, 100, { stroke: COL.chalk, rx: 50 });
    T(ask, 'basisniveau', { x: 710, y: 438, size: 24, weight: 600, anchor: 'middle' });
    T(ask, 'toereikend?', { x: 710, y: 470, size: 24, weight: 600, anchor: 'middle' });
    show(ask, tQ);
    const tJ = m('ja'), tN = m('nee');
    draw(path(p, 'M870 420H930V300H976 M962 290L976 300L962 310', { stroke: COL.good, 'stroke-width': 3 }, { d: 0 }), tJ, .6);
    b_txt(p, 'ja', 900, 366, tJ, { size: 22, weight: 600, fill: COL.good });
    const base = G(p, { o: 0, y: 14 });
    b_rect(base, 990, 250, 460, 100, { fill: COL.panel, stroke: COL.task });
    T(base, 'het basisniveau volstaat', { x: 1220, y: 310, size: 26, weight: 600, fill: COL.task, anchor: 'middle' });
    b_rise(base, tJ + .4);
    draw(path(p, 'M870 470H930V570H976 M962 560L976 570L962 580', { stroke: COL.chalk, 'stroke-width': 3 }, { d: 0 }), tN, .6);
    b_txt(p, 'nee', 898, 536, tN, { size: 22, weight: 600 });
    b_rise(c3_part(p, 2, 990, 500, 460, 140, 'volledige risicoanalyse'), tN + .6);
    b_down(p, 1220, 646, 706, m('extra'));
    const more = G(p, { o: 0, y: 14 });
    b_rect(more, 990, 712, 460, 80, { fill: COL.panel, stroke: COL.dim });
    T(more, 'aanvullende maatregelen', { x: 1220, y: 762, size: 26, weight: 600, anchor: 'middle' });
    b_rise(more, m('extra', .3));
  }],

  ['register', 'Risicoregister', (m) => {
    const p = panel(0);
    b_head(p, '§ 6.2 · RISICOMANAGEMENTMETHODIEK');
    b_rise(c3_part(p, 3, 200, 250, 640, 420, 'risicoregister'), .2);
    // Risks that are accepted for now. The clock says: not for good.
    const tT = m('tijd'), tL = m('los');
    const rows = [0, 1, 2, 3, 4].map(i => {
      const y = 372 + i * 56, g = G(p, { o: 0 });
      T(g, 'R-0' + (i + 1), { x: 232, y, size: 21, fill: COL.dim, weight: 600, font: MONO });
      mk('rect', { x: 316, y: y - 16, width: [200, 150, 230, 170, 210][i], height: 18, rx: 3, fill: COL.dim, 'fill-opacity': .45 }, g);
      const clock = b_icon(g, 'klok', { x: 592, y: y - 7, s: .8 });
      const label = T(g, 'tijdelijk geaccepteerd', { x: 616, y, size: 19, fill: COL.dim });
      show(g, m('rows') + i * .15);
      tw(clock, { s: 1.1 }, tT + i * .08, .2, out); tw(clock, { s: .8 }, tT + i * .08 + .22, .4); tw(label, { c_fill: COL.chalk }, tT, .4);
      return g;
    });
    // Part 4 follows them up until they are solved for good: three leave the register.
    b_rise(c3_part(p, 4, 1000, 380, 420, 150, 'opvolging', ['van tijdelijk geaccepteerde risico’s']), tT + 1.4);
    b_arrow(p, 852, 990, 455, tL - .2);
    rows.slice(0, 3).forEach((g, i) => {
      tw(g, { x: 640, o: 0 }, tL + i * .5, .8, io);
      const done = G(p, { o: 0 });
      b_tick(done, 1070 + i * 70, 600);
      show(done, tL + .7 + i * .5);
    });
    rows.slice(3).forEach(g => tw(g, { y: -168 }, tL + 2.2, .6, io));
    b_txt(p, 'structureel opgelost', 1210, 668, tL + 1, { size: 26, weight: 600, fill: COL.good });
  }],

  ['identificatie', 'Risico-identificatie', (m) => {
    const p = panel(0);
    b_head(p, '§ 6.3 · RISICO-IDENTIFICATIE');
    b_tab(2, .2);
    S.risk = C3_RISK.map((part, i) => {
      const x = C3_RX(i), cx = x + 145;
      show(put(b_rect(p, x, 250, 290, 290, { fill: COL.panel }), { o: 0 }), .3 + i * .1);   // the four frames are there at once
      const g = G(p, { o: 0 });
      b_icon(g, part.icon, { x: cx, y: 352, s: 1.7, stroke: part.col });
      T(g, part.name, { x: cx, y: 464, size: 26, weight: 600, fill: part.col, anchor: 'middle' });
      T(g, part.sub, { x: cx, y: 500, size: 19, fill: COL.dim, anchor: 'middle' });
      show(g, m(part.mark));
      return g;
    });
    // From threat, through the weak spot, to the asset and what follows.
    b_arrow(p, C3_RX(0) + 298, C3_RX(1) - 8, 395, m('kwets'), { stroke: COL.bad });
    b_arrow(p, C3_RX(1) + 298, C3_RX(2) - 8, 395, m('kwets', .4), { stroke: COL.bad });
    b_arrow(p, C3_RX(2) + 298, C3_RX(3) - 8, 395, m('gevolg'), { stroke: COL.bad });
  }],

  ['q1', 'Controlevraag', () => {}, { ask: done => {
    const items = C3_RISK.map((part, i) => ({ el: S.risk[i], box: [C3_RX(i), 250, 290, 290], label: part.name }));
    quiz(WIDE, [{
      id: 'c-risico-1', prompt: ['Een gemaal wordt op afstand bediend via een modem dat geen updates meer krijgt. Wat is het ontbreken van updates?'],
      build: pickEls(items, 1, 'Een zwakke plek waar een bedreiging gebruik van kan maken: een kwetsbaarheid.', i => [
        'De bedreiging is wat er kan gebeuren, bijvoorbeeld een aanvaller. Het ontbreken van updates is de zwakke plek.', null,
        'Het gemaal met zijn besturing is het waardevolle middel. Het ontbreken van updates is de zwakke plek daarin.',
        'De consequentie is het gevolg als het misgaat. Het ontbreken van updates is de zwakke plek.'][i]),
    }, {
      id: 'c-risico-2', prompt: ['Een aanvaller wil de besturing van het gemaal overnemen. Wat is dat?'],
      build: pickEls(items, 0, 'Iets dat het middel kan treffen: een bedreiging.', i => [null,
        'De kwetsbaarheid is de zwakke plek. De aanvaller is wat er kan gebeuren: de bedreiging.',
        'Het middel is wat je wilt beschermen. De aanvaller is de bedreiging.',
        'De consequentie is het gevolg van een geslaagde aanval. De aanvaller zelf is de bedreiging.'][i]),
    }, {
      id: 'c-risico-3', prompt: ['Het waterpeil kan dan niet meer worden geregeld. Wat is dat?'],
      build: pickEls(items, 3, 'Het gevolg als de bedreiging zich voordoet: de consequentie.', i => [
        'De bedreiging is de aanvaller. Dat het peil niet meer te regelen is, is het gevolg.',
        'De kwetsbaarheid is de zwakke plek. Dat het peil niet meer te regelen is, is het gevolg.',
        'Het middel is het gemaal zelf. Dat het peil niet meer te regelen is, is het gevolg.', null][i]),
    }], done);
  } }],

  ['hulp', 'Inventariseren', (m) => {
    const p = panel(0);
    b_head(p, '§ 6.3 · RISICO-IDENTIFICATIE');
    // The inventory fills up; the list is never complete.
    show(put(b_rect(p, 150, 250, 760, 400, { fill: COL.panel }), { o: 0 }), .2);
    b_txt(p, 'INVENTARIS VAN DREIGINGEN EN SCENARIO’S', 180, 294, .2, { size: 16, fill: COL.dim, anchor: 'start', weight: 700, font: MONO }).setAttribute('letter-spacing', '1.5');
    [['keten', 'ketenafhankelijkheden', 'vb'], ['tandwiel', 'operationele technologie', 'ot'], ['zorg', 'gegevensuitwisseling met zorginstellingen', 'zorg']].forEach(([icon, str, mark], i) => {
      const y = 360 + i * 70, g = G(p, { o: 0, x: -14 });
      b_icon(g, icon, { x: 210, y, s: .62, stroke: COL.dim });
      T(g, str, { x: 262, y: y + 8, size: 24 });
      path(g, `M180 ${y + 36}H880`, { stroke: COL.edge, 'stroke-width': 1.5 });
      tw(g, { o: 1, x: 0 }, m(mark), .5, out);
    });
    [0, 1].forEach(i => show(put(mk('rect', { x: 262, y: 562 + i * 36, width: 300 - i * 80, height: 14, rx: 3, fill: COL.edge }, p), { o: 0 }), m('zorg', 1.2) + i * .2));
    // Aids for the job.
    b_txt(p, 'hulpmiddelen', 1210, 232, m('tools'), { size: 22, fill: COL.dim });
    [['NEN-ISO/IEC 27005', 'richtlijn voor risicobeheer'], ['NIST CSF', 'Cybersecurity Framework'], ['NIST SP 800-30', 'risicobeoordeling']].forEach(([code, sub], i) =>
      b_rise(b_code(p, 1210, 256 + i * 116, code, sub, 440), m('tools') + .2 + i * .6));
  }],

  ['analyse', 'Risicoanalyse', (m) => {
    const p = panel(0);
    b_head(p, '§ 6.4 · RISICOANALYSE');
    b_tab(3, .2);
    // The risks that were found, as a list on the left.
    const found = [b_txt(p, 'geïdentificeerde', 250, 222, .3, { size: 20, fill: COL.dim }), b_txt(p, 'risico’s', 250, 248, .3, { size: 20, fill: COL.dim })];
    found.forEach(e => hide(e, m('plaats') + 1.4, .4));
    const dots = C3_DOTS.map((cell, i) => {
      const g = G(p, { x: 250, y: 296 + i * 60, o: 0 });
      mk('circle', { r: 18, fill: COL.panel, stroke: COL.chalk, 'stroke-width': 2.5 }, g);
      T(g, String(i + 1), { y: 7, size: 19, anchor: 'middle', weight: 700, font: MONO });
      show(g, .3 + i * .07);
      return g;
    });
    // Two measures: how likely, and how heavy. Darker means more of both.
    const grid = G(p, { o: 0 });
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
      mk('rect', { x: C3_MX(c), y: C3_MY(r), width: 96, height: 96, fill: COL.bad, 'fill-opacity': (.05 + .065 * (c + r)).toFixed(2), stroke: COL.edge, 'stroke-width': 1.5 }, grid);
    p.insertBefore(grid, dots[0]);                 // the risks will lie on top of the cells
    show(grid, m('as'));
    draw(path(p, 'M460 664H844 M830 654L844 664L830 674', { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), m('w'), .6);
    b_txt(p, 'waarschijnlijkheid', 652, 702, m('w'), { size: 24, weight: 600 });
    draw(path(p, 'M436 640V256 M426 270L436 256L446 270', { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), m('i'), .6);
    put(b_txt(p, 'impact', 410, 448, m('i'), { size: 24, weight: 600 }), { r: -90 });
    dots.forEach((g, i) => tw(g, { x: C3_MX(C3_DOTS[i][0]) + 48, y: C3_MY(C3_DOTS[i][1]) + 48 }, m('plaats') + i * .18, .8, io));
    // What that gives: an order to work in.
    const tP = m('prio');
    b_txt(p, 'prioriteiten', 1200, 292, tP, { size: 28, weight: 600 });
    [['eerst', '1', .8], ['daarna', '2 · 5 · 3 · 6', .45], ['later', '4', .16]].forEach(([str, ids, op], i) => {
      const y = 326 + i * 84, g = G(p, { o: 0, x: 16 });
      mk('rect', { x: 980, y, width: 22, height: 64, rx: 3, fill: COL.bad, 'fill-opacity': op }, g);
      T(g, str, { x: 1026, y: y + 41, size: 24, weight: 600 });
