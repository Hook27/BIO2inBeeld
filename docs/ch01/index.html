<script>
'use strict';
// Hoofdstuk 1: inleiding deel 1 en §1–3 van de BIO2, plus de copyright-notitie (verhouding tot ISO).
// Beat ids match content/bio2/ch01/narration.nl.json.
const CHAPTER = { number: 1, title: 'Waarom de BIO?', minutes: 7, language: 'nl', next: '../ch02/' };

// Drawing helpers (b_txt, b_head, b_rect, b_round, ICON, b_icon, b_tile, b_rise, b_arrow, ...) are shared by the
// chapters and live in ../lib/engine.js.

/* ---------- chapter data (used inside BEATS, so defined above it) ---------- */
// Schematic levels of four organisations; not measurements. The baseline sits at B_BASE.
const B_BARS = [['A', 130], ['B', 300], ['C', 190], ['D', 360]], B_BASE = 250, B_GROUND = 560, B_BARW = 120;
const B_BARX = i => 360 + i * 240;
// The five parts of an information system (BIO2 §3).
const B_PARTS = [
  { icon: 'db', lines: ['gegevens-', 'verzamelingen'], name: 'gegevensverzamelingen', mark: 'geg' },
  { icon: 'persoon', lines: ['personen'], name: 'personen', mark: 'pers' },
  { icon: 'proc', lines: ['procedures', 'en processen'], name: 'procedures en processen', mark: 'proc' },
  { icon: 'code', lines: ['programmatuur'], name: 'programmatuur', mark: 'prog' },
  { icon: null, lines: ['voorzieningen voor', 'opslag, verwerking', 'en communicatie'], name: 'voorzieningen voor opslag, verwerking en communicatie', mark: 'voorz' },
];
const B_TX = i => 175 + i * 255, B_TY = 262, B_TW = 230, B_TH = 220;

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Waarom de BIO?', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    const k = T(g, 'DEEL A · HET KADER · HOOFDSTUK 1', { x: 800, y: 318, size: 22, fill: COL.quiz, anchor: 'middle', weight: 600, font: MONO });
    k.setAttribute('letter-spacing', '3');
    T(g, 'Waarom de BIO?', { x: 800, y: 432, size: 96, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const line = path(scene, 'M560 482H1040', { stroke: COL.task, 'stroke-width': 4 }, { d: 0 });   // the baseline, the book's motif
    draw(line, .9, 1);
    const r = b_txt(scene, 'Wat de BIO is, voor wie ze geldt en hoe ze in elkaar zit.', 800, 572, m('sub'), { size: 32, fill: COL.dim });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(line, D - .9, .8);
  }],

  ['rol', 'De rol van de overheid', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 1 · INLEIDING');
    show(b_icon(p, 'overheid', { x: 800, y: 380, s: 2.2, o: 0 }), .2);
    b_txt(p, 'overheid', 800, 522, .3, { size: 30, weight: 600 });
    const ys = [300, 420, 540];
    ys.forEach((y, i) => {
      show(b_icon(p, 'persoon', { x: 220, y, s: 1.15, o: 0 }), m('burgers', i * .12));
      show(b_icon(p, 'bedrijf', { x: 1380, y, s: 1.15, o: 0 }), m('bedrijven', i * .12));
    });
    b_txt(p, 'burgers', 220, 640, m('burgers', .2), { fill: COL.dim });
    b_txt(p, 'bedrijven', 1380, 640, m('bedrijven', .2), { fill: COL.dim });

    // Sharing: documents travel in and are kept under the building.
    const tIn = m('deel');
    b_arrow(p, 300, 640, 360, tIn); b_arrow(p, 1300, 960, 360, tIn);
    b_txt(p, 'informatie delen', 470, 338, tIn + .2, { size: 22, fill: COL.dim });
    b_txt(p, 'informatie delen', 1130, 338, tIn + .2, { size: 22, fill: COL.dim });
    show(b_rect(p, 690, 550, 220, 90, { stroke: COL.dim, 'stroke-dasharray': '6 6', opacity: 0 }), tIn + .3);
    b_txt(p, 'informatie van burgers en bedrijven', 800, 674, tIn + .5, { size: 20, fill: COL.dim });
    const slots = [[740, 578], [860, 578], [800, 578], [860, 616], [740, 616], [800, 616]];
    slots.forEach(([sx, sy], k) => {
      const left = k % 2 === 0, t0 = tIn + .8 + k * .42;
      const d = b_icon(p, 'doc', { x: left ? 310 : 1290, y: 360, s: .7, o: 0 });
      show(d, t0, .2);
      tw(d, { x: left ? 640 : 960 }, t0, .8, io);
      tw(d, { x: sx, y: sy, s: .55 }, t0 + .8, .55, io);
    });

    // Receiving: information travels back out.
    const tOut = m('terug');
    b_arrow(p, 640, 300, 450, tOut); b_arrow(p, 960, 1300, 450, tOut);
    b_txt(p, 'informatie ontvangen', 470, 486, tOut + .2, { size: 22, fill: COL.dim });
    b_txt(p, 'informatie ontvangen', 1130, 486, tOut + .2, { size: 22, fill: COL.dim });
    [0, 1, 2, 3].forEach(k => {
      const left = k % 2 === 0, t0 = tOut + .7 + k * .45;
      const d = b_icon(p, 'doc', { x: left ? 640 : 960, y: 450, s: .7, o: 0 });
      show(d, t0, .2);
      tw(d, { x: left ? 320 : 1280 }, t0, .9, io);
      hide(d, t0 + .9, .3);
    });

    // No choice: sharing is a must, receiving a dependency.
    const tag = (str, x, y, t0) => b_txt(p, str, x, y, t0, { size: 18, weight: 700, font: MONO }).setAttribute('letter-spacing', '2');
    tag('MOET', 470, 310, m('keus')); tag('MOET', 1130, 310, m('keus'));
    tag('AFHANKELIJK', 470, 516, m('keus', .3)); tag('AFHANKELIJK', 1130, 516, m('keus', .3));

    // The duty that follows from it.
    draw(path(p, b_round(676, 538, 248, 114, 12), { stroke: COL.task, 'stroke-width': 4 }, { d: 0 }), m('plicht'), 1);
    b_txt(p, 'plicht: zorgvuldig omgaan met deze informatie', 800, 772, m('plicht', .7), { size: 36, weight: 600, fill: COL.task });
  }],

  ['bio', 'Wat is de BIO?', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 1 · INLEIDING');
    // B I O: the three capitals part, and their words grow behind them.
    const words = ['Baseline', 'Informatiebeveiliging', 'Overheid'], size = 62, gap = 26, capGap = 10;
    const wCap = words.map(w => uiW(w[0], size)), wAll = words.map(w => uiW(w, size));
    let x = 800 - (wAll.reduce((a, b) => a + b, 0) + gap * 2) / 2, cx = 800 - (wCap.reduce((a, b) => a + b, 0) + capGap * 2) / 2;
    words.forEach((w, i) => {
      const cap = T(p, w[0], { x: cx, y: 240, size, weight: 600, fill: COL.task, o: 0 });
      const rest = T(p, w.slice(1), { x: x + wCap[i], y: 240, size, weight: 600, o: 0 });
      show(cap, .2 + i * .08, .4);
      tw(cap, { x }, .85, .8, io);
      show(rest, 1.25 + i * .3, .6);
      pulse(cap, m('kort', .35) + i * .1, 1.18);
      cx += wCap[i] + capGap; x += wAll[i] + gap;
    });
    b_txt(p, 'het normenkader voor informatiebeveiliging binnen alle overheidsentiteiten', 800, 312, m('kader'), { size: 30 });
    b_txt(p, 'entiteit = overheidsorganisatie', 800, 358, m('ent'), { size: 20, fill: COL.dim, font: MONO });

    // What it offers; only the last one is mandatory, so only that one is amber.
    [[170, 330, 'richtlijnen', 'r1'], [540, 330, 'algemene principes', 'r2'], [910, 520, 'verplichte overheidsmaatregelen', 'r3', COL.task]].forEach(([tx, w, str, mark, col]) =>
      b_rise(b_tile(p, { x: tx, y: 420, w, h: 120, lines: [str], col: col || COL.chalk, size: 28 }), m(mark)));

    // What it is for: four steps in a row.
    ['initiëren', 'implementeren', 'onderhouden', 'verbeteren'].forEach((str, i) => {
      const cx2 = 335 + i * 310, t0 = m('c' + (i + 1));
      const g = G(p, { o: 0 });
      b_rect(g, cx2 - 125, 628, 250, 64, { stroke: COL.dim, rx: 6 });
      T(g, str, { x: cx2, y: 669, size: 24, anchor: 'middle', font: MONO });
      show(g, t0);
      if (i) b_arrow(p, cx2 - 173, cx2 - 137, 660, t0 - .15);
    });
    show(b_icon(p, 'keten', { x: 520, y: 780, o: 0, stroke: COL.dim }), m('keten'));
    b_txt(p, 'binnen de overheid en in haar ketens', 840, 790, m('keten', .15), { size: 30 });
  }],

  ['doel', 'Eén basisniveau', (m) => {
    const frame = panel(0);
    b_head(frame, '§ 2 · DOEL VAN DE BIO');
    const p = S.pic = G(frame, { y: 90 });   // centred while it is explained; beat 'q1' moves it up for the question card
    // The subject at once: an axis for the level of security, and the ground the bars stand on.
    draw(path(p, `M240 ${B_GROUND}H1200`, { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), .2, .7);
    draw(path(p, `M240 ${B_GROUND}V190 M232 206L240 190L248 206`, { stroke: COL.dim, 'stroke-width': 2 }, { d: 0 }), .3, .7);
    put(b_txt(p, 'niveau van beveiliging', 218, 375, .5, { size: 20, fill: COL.dim }), { r: -90 });
    b_txt(p, 'SCHEMATISCH, GEEN METING', 1220, 596, .6, { size: 15, fill: COL.faint, anchor: 'start', weight: 600, font: MONO }).setAttribute('letter-spacing', '1.5');

    const yBase = B_GROUND - B_BASE;
    S.bars = B_BARS.map(([name, hgt], i) => {
      const x0 = B_BARX(i) - B_BARW / 2, t0 = m('ongelijk') + i * .22;
      const body = put(b_rect(p, x0, B_GROUND, B_BARW, 0, { fill: '#3b434c', stroke: COL.dim, rx: 3, 'fill-opacity': 1, 'stroke-opacity': 0 }), { a_y: B_GROUND, a_height: 0 });
      tw(body, { a_y: B_GROUND - hgt, a_height: hgt }, t0, .8, out);
      b_txt(p, 'organisatie ' + name, B_BARX(i), 596, t0, { size: 22, fill: COL.dim });
      // Below the baseline: the part that is lifted, in the colour of the BIO.
      let lift = null;
      if (hgt < B_BASE) {
        lift = put(b_rect(p, x0, B_GROUND - hgt, B_BARW, 0, { fill: COL.task, stroke: COL.task, rx: 3, 'fill-opacity': .82, 'stroke-opacity': 0 }), { a_y: B_GROUND - hgt, a_height: 0 });
        tw(lift, { a_y: yBase, a_height: B_BASE - hgt }, m('til') + (i ? .35 : 0), .9, io);
      }
      // The inside of the bar, shown once the organisation is open about how it is arranged (beat 'taal').
      const rows = G(p, { o: 0 }), top = Math.max(hgt, B_BASE);
      for (let y = B_GROUND - 26; y > B_GROUND - top + 8; y -= 28) path(rows, `M${x0 + 14} ${y}H${x0 + B_BARW - 14}`, { stroke: COL.chalk, 'stroke-width': 2, 'stroke-opacity': .55 });
      return { body, lift, rows, x: B_BARX(i), hgt };
    });

    // The baseline: one common level for the whole of government.
    S.base = path(p, `M240 ${yBase}H1200`, { stroke: COL.task, 'stroke-width': 4 }, { d: 0 });
    draw(S.base, m('lijn'), 1);
    b_txt(p, 'gemeenschappelijk', 1220, yBase - 8, m('lijn', .7), { size: 26, weight: 600, fill: COL.task, anchor: 'start' });
    b_txt(p, 'basisniveau', 1220, yBase + 24, m('lijn', .7), { size: 26, weight: 600, fill: COL.task, anchor: 'start' });

    // A floor, not a ceiling: what rises above the line stays.
    S.bars.filter(b => b.hgt > B_BASE).forEach((b, k) =>
      draw(path(p, `M${b.x - 16} ${B_GROUND - b.hgt - 14}L${b.x} ${B_GROUND - b.hgt - 30}L${b.x + 16} ${B_GROUND - b.hgt - 14}`, { stroke: COL.chalk, 'stroke-width': 3 }, { d: 0 }), m('boven', 1.6) + k * .2, .4));
    b_txt(p, 'waar de risico’s groter zijn:', 1220, 200, m('boven', 1.8), { size: 22, anchor: 'start' });
    b_txt(p, 'maatregelen erbij', 1220, 230, m('boven', 1.8), { size: 22, anchor: 'start' });

    // Chain partners can rely on each other.
    [0, 1, 2].forEach(i => b_arrow(p, B_BARX(i) + 72, B_BARX(i + 1) - 72, 480, m('keten') + i * .2, { stroke: COL.good, both: true }));
    S.top = b_txt(p, 'basis van vertrouwen bij gegevensuitwisseling', 720, 150, m('keten', .5), { size: 28, weight: 600, fill: COL.good });
  }],

  ['taal', 'Open, in één taal', (m) => {
    // Same picture. The bars open up, then all carry the same word.
    const p = S.pic;
    hide(S.top, m('open') - .3, .3);
    const t1 = b_txt(p, 'transparant over de inrichting: intern en extern', 720, 150, m('open'), { size: 28, weight: 600 });
    S.bars.forEach((b, i) => {
      const t0 = m('open') + .2 + i * .15;
      tw(b.body, { 'a_fill-opacity': .14, 'a_stroke-opacity': 1 }, t0, .7);
      if (b.lift) tw(b.lift, { 'a_fill-opacity': .2, 'a_stroke-opacity': 1 }, t0, .7);
      show(b.rows, t0 + .2, .6);
      // One language: the same mark on every organisation, at the baseline.
      const g = G(p, { x: b.x, y: B_GROUND - B_BASE, s: 0, o: 0 });
      b_rect(g, -38, -17, 76, 34, { fill: COL.board, stroke: COL.task, rx: 4 });
      T(g, 'BIO', { y: 7, size: 20, fill: COL.task, anchor: 'middle', weight: 700, font: MONO });
      pop(g, m('taal', .5) + i * .18);
    });
    hide(t1, m('taal') - .3, .3);
    b_txt(p, 'één gezamenlijke taal, één gezamenlijk doel', 720, 150, m('taal'), { size: 28, weight: 600, fill: COL.task });
    tw(S.base, { 'a_stroke-width': 9 }, m('doel'), .25, out); tw(S.base, { 'a_stroke-width': 4 }, m('doel', .3), .6);
  }],

  ['q1', 'Controlevraag', () => { tw(S.pic, { y: 0 }, 0, .6); }, { ask: done => quiz(WIDE, [{
    id: 'c-basisniveau', prompt: ['De BIO brengt de overheid op een gemeenschappelijk basisniveau. Wat is dat basisniveau?'],
    build: choice([['een ondergrens: minstens dit'], ['een plafond: hooguit dit'], ['een gemiddelde']], 0,
      'Iedere organisatie voldoet minstens aan het basisniveau. Waar de risico’s groter zijn, komen er maatregelen bij.',
      [null, 'Een plafond zou meer beveiliging tegenhouden. Waar de risico’s groter zijn, vraagt de BIO juist om aanvullende maatregelen.',
        'Bij een gemiddelde mag een deel eronder zitten. Het basisniveau geldt voor iedere organisatie.'],
      () => { fx(S.base, { 'a_stroke-width': 10 }, 0, .22, out); fx(S.base, { 'a_stroke-width': 4 }, .25, .5); }),
  }], done) }],

  ['delen', 'Twee delen', (m) => {
    const frame = panel(0);
    S.head = b_head(frame, '§ 1 · LEESWIJZER');
    const p = S.pic = G(frame, { y: 110 });   // centred for now; beat 'iso' moves it up to make room underneath
    b_txt(p, 'BIO2', 800, 152, .2, { size: 46, weight: 700, fill: COL.task, font: MONO });
    // One slab, cut in two. The halves share a fill, so the seam only shows once they part.
    const half = x => { const g = G(p, { x, y: 220, o: 0 }); g._frame = b_rect(g, 0, 0, 600, 300, { fill: COL.panel, stroke: COL.dim, 'stroke-opacity': 0 }); show(g, .2); return g; };
    const d1 = S.d1 = half(200), d2 = S.d2 = half(800);
    const slab = b_rect(p, 200, 220, 1200, 300, { stroke: COL.dim, opacity: 0 });
    show(slab, .2);
    const tCut = m('doc');
    const cut = path(p, 'M800 196V544', { stroke: COL.chalk, 'stroke-width': 2 }, { d: 0 });
    draw(cut, tCut, .5); hide(cut, tCut + .6, .4); hide(slab, tCut + .5, .3);
    [d1, d2].forEach((g, i) => { tw(g._frame, { 'a_stroke-opacity': 1 }, tCut + .5, .3); tw(g, { x: i ? 840 : 160 }, tCut + .6, .7); });

    const title = (g, kick, str, t0) => {
      const k = T(g, kick, { x: 28, y: 46, size: 18, fill: COL.task, weight: 700, font: MONO, o: 0 }); k.setAttribute('letter-spacing', '2');
      show(k, t0); show(T(g, str, { x: 28, y: 96, size: 36, weight: 600, o: 0 }), t0 + .15);
    };
    title(d1, 'DEEL 1', 'BIO2-kader', m('d1'));
    S.d1items = [['context en belang van informatiebeveiliging', 'd1a'], ['structuur en toepasselijkheid van de BIO', 'd1b']].map(([str, mark], i) => {
      const g = G(d1, { o: 0 });
      mk('rect', { x: 30, y: 148 + i * 46, width: 9, height: 9, fill: COL.dim }, g);
      T(g, str, { x: 54, y: 160 + i * 46, size: 24 });
      show(g, m(mark));
      return g;
    });
    title(d2, 'DEEL 2', 'BIO-overheidsmaatregelen', m('d2'));
    // Numbered rows; 5.03.01 really has no government measure of its own (beat 'iso' fills it from the standard).
    S.rows = [['5.01.01', 360], ['5.02.02', 290], ['5.03.01', 0], ['5.04.01', 340]].map(([nr, w], i) => {
      const g = G(d2, { o: 0 }), y = 150 + i * 38;
      const num = T(g, nr, { x: 28, y, size: 22, fill: w ? COL.task : COL.dim, weight: 600, font: MONO });
      const bar = w ? b_rect(g, 140, y - 17, w, 18, { fill: COL.task, stroke: 'none', rx: 3, 'fill-opacity': .6 })
        : b_rect(g, 140, y - 17, 330, 18, { stroke: COL.dim, sw: 1.5, rx: 3, 'stroke-dasharray': '5 5' });
      show(g, m('d2a') + i * .18);
      return { g, num, bar, y };
    });

    // Together: one complete framework.
    draw(path(p, 'M160 208V192H1440V208', { stroke: COL.chalk, 'stroke-width': 2 }, { d: 0 }), m('samen'), .8);
    show(b_rect(p, 664, 178, 272, 30, { fill: COL.board, stroke: 'none', rx: 0, opacity: 0 }), m('samen', .3));
    b_txt(p, 'één compleet kader', 800, 201, m('samen', .4), { size: 24, weight: 600 });
  }],

  ['iso', 'Het fundament', (m) => {
    // Same picture. Two standards slide in underneath the two parts.
    const p = S.pic;
    hide(S.head, 0, .3); b_head(S.panel, 'VERHOUDING TOT DE ISO-NORMEN', .3);
    tw(p, { y: 0 }, .2, .8);
    S.iso = []; S.notes = [];   // the standards (the next beat dims and restores them) and the labels that have then done their work
    const block = (x, code, sub, tUp, tCode, tSub) => {
      const g = G(p, { x, y: 610, o: 0 });
      b_rect(g, 0, 0, 600, 120, { fill: '#172028', stroke: COL.iso });
      show(T(g, code, { x: 28, y: 52, size: 28, fill: COL.iso, weight: 700, font: MONO, o: 0 }), tCode);
      show(T(g, sub, { x: 28, y: 92, size: 23, o: 0 }), tSub);
      tw(g, { y: 560, o: 1 }, tUp, .7, out);
      const link = path(p, `M${x + 300} 526V554`, { stroke: COL.iso, 'stroke-width': 3 }, { d: 0 });
      draw(link, tCode, .4);
      S.iso.push(g, link);
      S.notes.push(b_txt(p, 'volgt de structuur van', x + 316, 547, tCode + .2, { size: 18, fill: COL.dim, anchor: 'start' }));
    };
    block(160, 'NEN-EN-ISO/IEC 27001', 'managementsysteem voor informatiebeveiliging', m('fund'), m('n1'), m('n1b'));
    block(840, 'NEN-EN-ISO/IEC 27002', 'beheersmaatregelen', m('fund', .2), m('n2'), m('n2b'));
  }],

  ['aanvulling', 'Aanvullen, niet vervangen', (m) => {
    // Same picture, one idea: how the two layers relate. The labels of the last beat step back first.
    const p = S.pic;
    S.notes.forEach(e => hide(e, .2, .5));

    // The misunderstanding: as if the standards were gone. It is struck through, and they are back.
    const wrong = b_txt(p, 'BIO vervangt ISO', 470, 772, m('niet'), { size: 34, weight: 600 });
    S.iso.forEach(e => { tw(e, { o: .2 }, m('niet', .2), .5); tw(e, { o: 1 }, m('streep', .2), .5); });
    draw(path(p, 'M312 762H628', { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 }), m('streep'), .4);
    tw(wrong, { c_fill: COL.faint }, m('streep', .2), .4);

    // The right reading.
    draw(path(p, 'M946 760L958 772L980 746', { stroke: COL.good, 'stroke-width': 5 }, { d: 0 }), m('vult'), .4);
    b_txt(p, 'BIO vult ISO aan', 1140, 772, m('vult'), { size: 34, weight: 600 });
    b_txt(p, 'met maatregelen voor de overheid', 1140, 808, m('vult', 1.1), { size: 22, fill: COL.dim });

    // Where the BIO prescribes nothing, the standard applies: the empty row fills from below.
    const row = S.rows[2], tG = m('gat');
    draw(path(p, `M1392 560V${220 + row.y - 8}H1326 M1340 ${220 + row.y - 18}L1326 ${220 + row.y - 8}L1340 ${220 + row.y + 2}`, { stroke: COL.iso, 'stroke-width': 3 }, { d: 0 }), tG, .8);
    const fill = put(b_rect(row.g, 140, row.y - 17, 0, 18, { fill: COL.iso, stroke: 'none', rx: 3, 'fill-opacity': .75 }), { a_width: 0 });
    tw(fill, { a_width: 330 }, tG + .7, .8, out);
    tw(row.num, { c_fill: COL.iso }, tG + .7, .5);
    b_txt(p, 'waar de BIO niets voorschrijft: de ISO-normen', 800, 856, tG + 1, { size: 26, weight: 600, fill: COL.iso });
  }],

  ['toepassing', 'Alle omgevingen', (m) => {
    const p = panel(0);
    b_head(p, '§ 3 · TOEPASSING BIO');
    // The BIO spans every kind of environment.
    b_txt(p, 'BIO', 800, 152, .2, { size: 46, weight: 700, fill: COL.task, font: MONO });
    draw(path(p, 'M130 220V194H1470V220', { stroke: COL.task, 'stroke-width': 3 }, { d: 0 }), .3, .9);
    show(b_rect(p, 640, 178, 320, 32, { fill: COL.board, stroke: 'none', rx: 0, opacity: 0 }), m('alle'));
    b_txt(p, 'alle typen omgevingen', 800, 203, m('alle'), { size: 26, weight: 600 });
    const tiles = [
      { x: 130, icon: 'laptop', label: 'kantooromgeving', mark: 'kantoor' },
      { x: 590, icon: 'tandwiel', label: 'operationele technologie (OT)', sub: 'besturing van gemalen, sluizen, bruggen', mark: 'ot' },
      { x: 1050, icon: 'zorg', label: 'zorginformatie', mark: 'zorg' },
    ];
    tiles.forEach((t, i) => {
      show(b_rect(p, t.x, 240, 420, 230, { fill: COL.panel, opacity: 0 }), .3 + i * .12);   // the three frames are there at once
      const g = G(p, { o: 0, y: 12 });
      b_icon(g, t.icon, { x: t.x + 210, y: 322, s: 1.6 });
      T(g, t.label, { x: t.x + 210, y: 412, size: 26, weight: 600, anchor: 'middle' });
      if (t.sub) T(g, t.sub, { x: t.x + 210, y: 444, size: 20, fill: COL.dim, anchor: 'middle' });
      tw(g, { o: 1, y: 0 }, m(t.mark), .5, out);
    });

    // Other standards and guidelines help to reach the level needed.
    b_txt(p, 'met behulp van andere', 340, 532, m('extra'), { size: 22, fill: COL.dim });
    b_txt(p, 'normen en richtlijnen', 340, 562, m('extra'), { size: 22, fill: COL.dim });
    b_arrow(p, 470, 610, 540, m('extra', .3), { stroke: COL.dim, sw: 2 });
    [[800, 'CSIR', 'Cybersecurity implementatierichtlijn', 'csir'], [1260, 'NEN 7510', 'Informatiebeveiliging in de zorg', 'nen']].forEach(([cx, code, sub, mark]) => {
      const g = G(p, { o: 0, y: 12 });
      path(g, `M${cx} 470V500`, { stroke: COL.iso, 'stroke-width': 3 });
      b_rect(g, cx - 180, 500, 360, 84, { fill: '#172028', stroke: COL.iso });
      T(g, code, { x: cx, y: 537, size: 26, fill: COL.iso, weight: 700, anchor: 'middle', font: MONO });
      T(g, sub, { x: cx, y: 566, size: 18, anchor: 'middle' });
      tw(g, { o: 1, y: 0 }, m(mark), .5, out);
    });

    // Both parts are mandatory.
    [[355, 330, 'DEEL 1 · BIO2-KADER', .5], [725, 520, 'DEEL 2 · BIO-OVERHEIDSMAATREGELEN', 1.1]].forEach(([x, w, str, off]) => {
      const g = G(p, { o: 0 });
      b_rect(g, x, 664, w, 56, { fill: COL.panel, stroke: COL.task, rx: 6 });
      T(g, str, { x: x + w / 2, y: 700, size: 22, fill: COL.task, weight: 700, anchor: 'middle', font: MONO }).setAttribute('letter-spacing', '1');
      show(g, m('altijd', off));
    });
    b_txt(p, 'verplichtend karakter: altijd gevolgd', 800, 792, m('gevolgd'), { size: 36, weight: 600, fill: COL.task });
  }],

  ['systeem', 'Informatiesysteem', (m) => {
    const frame = panel(0);
    b_head(frame, '§ 3 · TOEPASSING BIO');
    const p = S.pic = G(frame, { y: 70 });   // centred while it is explained; beat 'q2' moves it up for the question card
    // The narrow reading first: a single machine.
    const title = b_txt(p, 'informatiesysteem', 800, 224, .2, { size: 40, weight: 600 });
    const srv = b_icon(p, 'server', { x: 800, y: 380, s: 2.4, o: 0 });
    show(srv, .3);
    const wrong = b_txt(p, 'een server of een applicatie', 800, 520, m('fout'), { size: 30 });
    const strike = path(p, 'M596 510H1004', { stroke: COL.bad, 'stroke-width': 4 }, { d: 0 });
    const tD = m('def');
    draw(strike, tD, .4); tw(wrong, { c_fill: COL.faint }, tD + .2, .4);
    hide(wrong, tD + 1.3, .4); hide(strike, tD + 1.3, .4);

    // The BIO means the whole: the machine shrinks into one of five parts.
    tw(title, { x: 650 }, tD + 1.3, .7);
    b_txt(p, '= een samenhangend geheel', 846, 224, tD + 1.8, { size: 30, anchor: 'start', fill: COL.dim });
    draw(path(p, b_round(140, 170, 1320, 440, 14), { stroke: COL.dim, 'stroke-width': 2 }, { d: 0 }), tD + 1.3, 1.1);
    tw(srv, { x: B_TX(4) + B_TW / 2, y: B_TY + 74, s: 1.25, o: .45 }, tD + 1.3, .9);
    tw(srv._line, { 'a_stroke-width': 2.4 }, tD + 1.3, .9);
    S.tiles = B_PARTS.map((part, i) => {
      const g = b_tile(p, { x: B_TX(i), y: B_TY, w: B_TW, h: B_TH, icon: part.icon, lines: part.lines, textY: B_TY + (part.lines.length === 3 ? 140 : 152) });
      b_rise(g, m(part.mark));
      return g;
    });
    p.appendChild(srv);                       // keep the machine above the tile that forms around it
    tw(srv, { o: 1 }, m('voorz'), .5);
    b_txt(p, 'niet alleen techniek, maar informatie en organisatie', 800, 562, m('dus', .6), { size: 34, weight: 600, fill: COL.task });
  }],

  ['q2', 'Controlevraag', () => { tw(S.pic, { y: 0 }, 0, .6); }, { ask: done => {
    const items = B_PARTS.map((part, i) => ({ el: S.tiles[i], box: [B_TX(i), B_TY, B_TW, B_TH], label: part.name }));
    quiz(WIDE, [{
      id: 'c-systeem-1', prompt: ['Een medewerker beoordeelt aanvragen volgens een vaste werkinstructie. Bij welk onderdeel hoort die werkinstructie?'],
      build: pickEls(items, 2, 'Een werkinstructie legt vast hoe het werk gaat: dat is een procedure.', i => [
        'Gegevensverzamelingen zijn de gegevens zelf, zoals de aanvragen. De werkinstructie beschrijft hoe je ermee werkt.',
        'De medewerker hoort bij de personen. De werkinstructie is een afspraak over de werkwijze.', null,
        'Programmatuur is de software. Een werkinstructie is een afspraak over de werkwijze.',
        'Voorzieningen zijn de middelen voor opslag, verwerking en communicatie. Een werkinstructie beschrijft de werkwijze.'][i]),
    }, {
      id: 'c-systeem-2', prompt: ['Het netwerk waarover de aanvragen worden verstuurd: bij welk onderdeel hoort dat?'],
      build: pickEls(items, 4, 'Het netwerk is een voorziening voor communicatie.', i => [
        'De aanvragen zelf zijn gegevens. Het netwerk is het middel waarmee ze worden verstuurd.',
        'Personen zijn de mensen die bij het systeem horen. Het netwerk is een middel.',
        'Procedures en processen beschrijven de werkwijze, niet het middel waarmee gegevens worden verstuurd.',
        'Programmatuur is software. Het netwerk is een voorziening voor communicatie.', null][i]),
    }], done);
  } }],

  ['wrap', 'Samenvatting', (m) => {
    const p = panel(0);
    b_head(p, 'SAMENVATTING');
    [['De overheid moet zorgvuldig omgaan met informatie.', 'Burgers en bedrijven moeten die delen en zijn van de overheid afhankelijk.', 'w1'],
      ['De BIO legt één gemeenschappelijk basisniveau.', 'Een ondergrens voor de hele overheid, in één gezamenlijke taal.', 'w2'],
      ['De BIO2 heeft twee delen: het kader en de overheidsmaatregelen.', 'Beide zijn verplicht en vullen ISO 27001 en ISO 27002 aan.', 'w3'],
      ['Een informatiesysteem is meer dan techniek.', 'Ook gegevens, mensen en werkwijze horen erbij.', 'w4'],
    ].forEach(([main, sub, mark], i) => {
      const g = G(p, { x: -16, y: 232 + i * 150, o: 0 });
      b_rect(g, 170, -44, 58, 58, { stroke: COL.task, rx: 6 });
      T(g, String(i + 1), { x: 199, y: -4, size: 30, fill: COL.task, weight: 700, anchor: 'middle', font: MONO });
      T(g, main, { x: 264, y: -12, size: 34, weight: 600 });
      T(g, sub, { x: 264, y: 26, size: 24, fill: COL.dim });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Oefenronde 1', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-stellingen', prompt: ['Klopt het, of klopt het niet?'],
    build: grid([
      { parts: ['De BIO vervangt ISO 27001 en ISO 27002.'], ans: ['n'], why: 'De BIO vervangt deze normen niet, maar vult ze aan.' },
      { parts: ['Deel 2 van de BIO2 bevat de verplichte overheidsmaatregelen.'], ans: ['k'], why: 'Deel 1 is het kader, deel 2 bevat de overheidsmaatregelen.' },
      { parts: ['De BIO geldt alleen voor de kantooromgeving.'], ans: ['n'], why: 'De BIO geldt voor alle typen omgevingen, ook operationele technologie en zorginformatie.' },
      { parts: ['Alleen deel 2 is verplicht; deel 1 is achtergrondinformatie.'], ans: ['n'], why: 'Beide delen hebben een verplichtend karakter en worden altijd gevolgd.' },
      { parts: ['Met de BIO hanteert de overheid één gezamenlijke taal.'], ans: ['k'], why: 'Eén gezamenlijke taal en één gezamenlijk doel voor informatiebeveiliging.' },
    ], KN, { multi: false, text: true }),
  }], done, 'Oefenronde 1 van 2') }],

  ['final2', 'Oefenronde 2', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ot', prompt: ['Je organisatie beheert ook gemalen en sluizen. Geldt de BIO voor de systemen die deze aansturen?'],
    build: choice([['Nee. De BIO gaat alleen over de kantooromgeving.'], ['Ja. De BIO geldt voor alle typen omgevingen, ook operationele technologie.'], ['Alleen als de organisatie daar zelf voor kiest.']], 1,
      'De BIO noemt operationele technologie uitdrukkelijk als omgeving waarvoor ze geldt.',
      ['De BIO geldt voor alle typen omgevingen en noemt operationele technologie uitdrukkelijk.', null, 'Het is geen keuze: beide delen van de BIO hebben een verplichtend karakter.']),
  }, {
    id: 'p-gat', prompt: ['De BIO schrijft over een onderwerp niets voor. Wat gebruik je dan?'],
    build: choice([['Niets: wat niet in de BIO staat, hoeft niet.'], ['Een eigen norm van de organisatie.'], ['De ISO-normen 27001 en 27002.']], 2,
      'Waar de BIO zelf niets voorschrijft, gebruik je de ISO-normen.',
      ['De BIO vult de ISO-normen aan. Waar de BIO niets voorschrijft, gelden die normen nog steeds.', 'De BIO is gebouwd op ISO 27001 en ISO 27002. Waar de BIO niets voorschrijft, gebruik je die normen.', null]),
  }, {
    id: 'p-systeem', prompt: ['Een afdeling behandelt aanvragen in een applicatie. Wat hoort volgens de BIO bij het informatiesysteem?'],
    build: choice([['Alleen de applicatie en de server waarop die draait.'], ['De gegevens, de mensen, hun werkwijze, de applicatie en de voorzieningen eromheen.'], ['Alleen de gegevens in de applicatie.']], 1,
      'Een informatiesysteem is een samenhangend geheel: niet alleen techniek, maar informatie en organisatie.',
      ['Dat is alleen de techniek. Ook gegevens, personen, procedures en processen horen erbij.', null, 'De gegevens horen erbij, maar ook de personen, de werkwijze, de programmatuur en de voorzieningen.']),
  }], done, 'Oefenronde 2 van 2 · vraag') }],

  ['finish', 'Afgerond', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
