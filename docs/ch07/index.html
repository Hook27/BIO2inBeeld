<script>
'use strict';
// Hoofdstuk 7: de overheidsmaatregelen 5.09.01 tot en met 5.14.05 van de BIO2 (pagina 15 en 16): de inventaris van
// bedrijfsmiddelen, gedragsregels, classificeren en het overdragen van informatie.
// Beat ids match content/bio2/ch07/narration.nl.json. One idea per beat.
const CHAPTER = { number: 7, title: 'Weten wat je hebt en hoe je het deelt', minutes: 7, language: 'nl', next: '../ch08/' };

/* ---------- chapter data (used by the helpers and inside BEATS, so defined first) ---------- */
const C7_TABS = ['5.09', '5.10', '5.11', '5.12', '5.13', '5.14'];
// Six controls of ISO 27002 (topics shortened, in our own words) with their government measures in the BIO2.
const C7_CTRL = [
  { code: '5.9', topic: ['inventaris van informatie', 'en bedrijfsmiddelen'], nrs: ['5.09.01'] },
  { code: '5.10', topic: ['aanvaardbaar gebruik', 'van bedrijfsmiddelen'], nrs: ['5.10.02', '5.10.03'], note: ['5.10.01: geen overheidsmaatregel', '5.10.02 en 5.10.03 komen uit 5.04'] },
  { code: '5.11', topic: ['bedrijfsmiddelen', 'retourneren'], nrs: [] },
  { code: '5.12', topic: ['informatie', 'classificeren'], nrs: ['5.12.01'] },
  { code: '5.13', topic: ['informatie', 'labelen'], nrs: [] },
  { code: '5.14', topic: ['informatie', 'overdragen'], nrs: ['5.14.01', '5.14.02', '5.14.03', '5.14.04', '5.14.05'] },
];
// The inventory (5.09.01), schematic. Four assets inside the organisation: [icon, x, y, label there, name in the inventory].
const C7_OWN = [
  ['server', 230, 380, 'server', 'server'],
  ['laptop', 430, 380, 'laptop', 'laptop'],
  ['code', 230, 560, 'applicatie', 'applicatie'],
  ['tandwiel', 430, 560, 'besturing gemaal', 'besturing van een gemaal'],
];
// Three kinds the measure names separately: [icon, y beside the organisation, label there, name in the inventory, mark].
const C7_ALSO = [
  ['laptop', 322, ['op afstand'], 'bedrijfsmiddel op afstand', 'afstand'],
  ['wolk', 474, ['cloud-omgeving'], 'cloud-omgeving', 'cloud'],
  ['laptop', 626, ['regelmatig verbonden,', 'niet onder controle'], 'verbonden, niet onder controle', 'verbonden'],
];
const c7_rowY = i => 318 + i * 60;
// Five assets as cards for the first quick check: [icon, label].
const C7_Q1 = [
  ['server', ['server in de', 'eigen serverruimte']],
  ['laptop', ['laptop van de', 'organisatie, bij een', 'medewerker thuis']],
  ['wolk', ['cloud-omgeving']],
  ['tandwiel', ['besturing van', 'een gemaal']],
  ['laptop', ['laptop van een', 'leverancier, regelmatig', 'aan het netwerk']],
];
const c7_q1X = i => 96 + i * 284;
// What 5.14.04 asks a current registration of: [icon, label, small print].
const C7_REG = [
  ['server', ['informatiesystemen', 'bereikbaar vanaf internet']],
  ['code', ['webapplicaties']],
  ['adres', ['IP-adressen']],
  ['api', ['API’s'], 'koppelvlakken'],
];
// The four controls that have government measures, as cards for the second quick check: [number, icon, label].
const C7_Q2 = [['5.09', 'proc', ['inventaris']], ['5.10', 'doc', ['gedragsregels']], ['5.12', null, ['classificeren']], ['5.14', 'wereld', ['informatie', 'overdragen']]];
const c7_q2X = i => 146 + i * 336;
Object.assign(ICON, {
  mail: 'M-34 -22H34V22H-34Z M-34 -22L0 6L34 -22',
  adres: 'M-44 -12H-22V12H-44Z M-11 -12H11V12H-11Z M22 -12H44V12H22Z M-16.5 9V12 M16.5 9V12',
  api: 'M-42 0H-18 M-18 -15V15 M-18 -8H-2 M-18 8H-2 M42 0H20 M20 -15H6V15H20Z',
});

/* ---------- chapter drawing helpers (prefixed c7_; the shared b_ helpers live in ../lib/engine.js,
   among them b_caps and b_year, which started in this chapter, and the icons 'wereld' and 'cert') ---------- */
// Row i of the inventory (S.sheet): a small icon, a name and three bars for its properties. Returns the group, hidden.
const c7_row = (i, icon, name, lit = false) => {
  const y = c7_rowY(i), g = G(S.sheet, { o: 0 });
  b_icon(g, icon, { x: 912, y: y + 26, s: .5 });
  T(g, name, { x: 948, y: y + 33, size: 20 });
  g._bars = [0, 1, 2].map(k => mk('rect', { x: 1330 + k * 44, y: y + 19, width: 34, height: 14, rx: 3, fill: lit ? COL.dim : COL.edge }, g));
  path(g, `M888 ${y + 56}H1452`, { stroke: COL.edge, 'stroke-width': 1.5 });
  return g;
};
// A copy of an asset travels from (x,y) to row i of the inventory and gives way to the row's own icon.
const c7_fly = (p, icon, x, y, s, i, t0) => {
  const g = b_icon(p, icon, { x, y, s, o: 0 });
  show(g, t0, .15); tw(g, { x: 912, y: c7_rowY(i) + 26, s: .5 }, t0 + .1, .7, io); hide(g, t0 + .7, .2);
};
// A certificate as a small card with its top left at (x,y). Returns the group, hidden.
const c7_cert = (p, x, y, w, main, sub) => {
  const g = G(p, { o: 0 });
  b_rect(g, x, y, w, 76, { fill: COL.panel, stroke: COL.task, rx: 6 });
  b_icon(g, 'cert', { x: x + 44, y: y + 34, s: .62, stroke: COL.task });
  T(g, main, { x: x + 88, y: y + 33, size: 21, weight: 700, fill: COL.task, font: MONO });   // monospace: PKIo must not read as PKlo
  T(g, sub, { x: x + 88, y: y + 59, size: 17, fill: COL.dim, font: MONO });
  return g;
};

/* ---------- beats: [id, title, run(m, D), { ask, hold }?] ---------- */
const BEATS = [
  ['intro', 'Weten wat je hebt', (m, D) =>
    b_title(m, D, 'DEEL B · MAATREGELEN VOOR DE ORGANISATIE · HOOFDSTUK 7', 'Weten wat je hebt', 'En hoe je het deelt: inventaris, gedragsregels, classificeren en overdragen.')],

  ['zes', '5.09 tot en met 5.14', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 2 · 5.09 TOT EN MET 5.14');
    // The strip of this chapter: the six controls. The two without a government measure get a dashed frame.
    b_tabs(C7_TABS, .4);
    C7_CTRL.forEach((c, i) => { if (!c.nrs.length) b_tabNone(i); });
    const tV = m('vier'), tT = m('twee');
    let withNr = 0, without = 0;
    C7_CTRL.forEach((c, i) => {
      const x = 120 + (i % 3) * 466, y = 176 + Math.floor(i / 3) * 286, g = G(p, { o: 0, y: 12 });
      b_rect(g, x, y, 440, 262, { fill: COL.panel });
      T(g, c.code, { x: x + 24, y: y + 52, size: 34, fill: COL.iso, weight: 700, font: MONO });
      c.topic.forEach((str, k) => T(g, str, { x: x + 24, y: y + 92 + k * 28, size: 21 }));
      tw(g, { o: 1, y: 0 }, .3 + i * .1, .5, out);
      if (c.nrs.length) {
        const t0 = tV + .2 + withNr++ * .3;
        c.nrs.forEach((nr, k) => show(b_chip(g, x + 24 + (k % 3) * 132, y + 156 + Math.floor(k / 3) * 50, 122, nr, { col: COL.task, fill: COL.task, hgt: 42, size: 19 }), t0 + k * .08));
        if (c.note) c.note.forEach((str, k) => show(T(g, str, { x: x + 24, y: y + 226 + k * 20, size: 15, fill: COL.dim, font: MONO, o: 0 }), t0 + .6));
      } else {
        const t0 = tT + .2 + without++ * .3;
        show(T(g, 'geen overheidsmaatregel', { x: x + 24, y: y + 176, size: 17, fill: COL.dim, font: MONO, o: 0 }), t0);
        show(b_chip(g, x + 24, y + 196, 272, 'richtlijn uit ISO 27002', { col: COL.iso, fill: COL.iso, hgt: 42, size: 18 }), t0 + 1.6);
      }
    });
    b_txt(p, 'BRON ONDERWERPEN: NEN-EN-ISO/IEC 27002:2022 · VERKORT WEERGEGEVEN', 120, 772, 1.6, { size: 14, fill: COL.faint, anchor: 'start', weight: 700, font: MONO }).setAttribute('letter-spacing', '1.5');
  }],

  ['inventaris', 'De inventaris', (m) => {
    const p = panel(0);
    b_head(p, '5.09.01 · INVENTARIS VAN BEDRIJFSMIDDELEN');
    b_tab(0, .2);
    b_kop(p, '5.09.01', 'een inventaris van bedrijfsmiddelen');
    const tI = m('inv'), tO = m('ot'), tE = m('eig');
    // The organisation and four of its assets, schematic.
    const land = G(p, { o: 0 });
    b_rect(land, 120, 250, 420, 450, { fill: COL.panel });
    b_caps(land, 'DE ORGANISATIE', 144, 284);
    show(land, .3);
    S.own = C7_OWN.map(([icon, x, y, label], i) => {
      const g = G(p, { o: 0 }), ic = b_icon(g, icon, { x, y, s: 1.2 });
      const lab = T(g, label, { x, y: y + 66, size: 20, anchor: 'middle' });
      show(g, .4 + i * .12);
      return { ic, lab };
    });
    // The inventory: a list with a row for every asset. The assets travel to their rows.
    const sheet = S.sheet = G(p, { o: 0, y: 14 });
    b_rect(sheet, 860, 244, 620, 506, { fill: COL.panel });
    b_caps(sheet, 'INVENTARIS', 888, 284, { size: 16 });
    path(sheet, 'M888 298H1452', { stroke: COL.edge, 'stroke-width': 2 });
    b_rise(sheet, tI);
    S.inv = C7_OWN.map(([icon, x, y, , name], i) => {
      const t0 = tI + .8 + i * .35, g = c7_row(i, icon, name);
      c7_fly(p, icon, x, y, 1.2, i, t0); show(g, t0 + .65, .3);
      return g;
    });
    b_txt(p, 'SCHEMATISCH', 860, 776, tI + .4, { size: 15, fill: COL.faint, anchor: 'start', weight: 700, font: MONO }).setAttribute('letter-spacing', '1.5');
    S.notes = G(p);
    b_txt(S.notes, 'van belang voor informatieverwerking', 330, 736, tI + .4, { size: 21, fill: COL.dim });
    // Operational technology belongs in it too.
    const ot = S.own[3];
    tw(ot.ic._line, { c_stroke: COL.task }, tO, .4); tw(ot.lab, { c_fill: COL.task }, tO, .4);
    show(b_chip(S.inv[3], 1214, c7_rowY(3) + 11, 60, 'OT', { col: COL.task, fill: COL.task, hgt: 30, size: 16 }), tO + .2);
    b_txt(S.notes, 'met inbegrip van operationele technologie (OT)', 330, 766, tO, { size: 21, fill: COL.task, weight: 600 });
    // Every row carries the properties that management and maintenance need.
    show(put(b_caps(sheet, 'EIGENSCHAPPEN', 1452, 284, { fill: COL.task, anchor: 'end' }), { o: 0 }), tE);
    S.inv.forEach((g, i) => g._bars.forEach((bar, k) => tw(bar, { c_fill: COL.dim }, tE + .2 + i * .12 + k * .06, .3)));
    b_txt(S.notes, 'alles wat nodig is voor beheer en onderhoud', 1480, 776, tE + .4, { size: 20, fill: COL.dim, anchor: 'end' });
  }],

  ['ookin', 'Ook in de inventaris', (m) => {
    // Same picture: three kinds of assets beside the organisation get a row of their own.
    const p = S.panel, ot = S.own[3];
    hide(S.notes, 0, .4);
    tw(ot.ic._line, { c_stroke: COL.chalk }, .2, .4); tw(ot.lab, { c_fill: COL.chalk }, .2, .4);
    b_txt(p, 'ook opgenomen in de inventaris', 330, 736, 1.2, { size: 21, fill: COL.dim });
    C7_ALSO.forEach(([icon, y, lines, name, mark], k) => {
      const i = 4 + k, t0 = m(mark), ry = c7_rowY(i);
      // an empty place in the list first: three kinds are named separately
      const slot = put(b_rect(S.sheet, 880, ry + 5, 580, 46, { stroke: COL.dim, rx: 5, 'stroke-dasharray': '6 6' }), { o: 0 });
      show(slot, 1.2 + k * .25, .4); hide(slot, t0 + 1.3, .3);
      const g = G(p, { o: 0 });
      path(g, `M540 ${y}H${k === 2 ? 640 : 652}`, { stroke: COL.dim, 'stroke-width': 2.5 });
      b_icon(g, icon, { x: 700, y, s: 1.05 });
      if (k === 2) b_rect(g, 644, y - 42, 112, 84, { stroke: COL.dim, rx: 6, 'stroke-dasharray': '6 6' });   // not under the organisation's control
      lines.forEach((str, n) => T(g, str, { x: 700, y: y + 64 + n * 23, size: 18, anchor: 'middle' }));
      show(g, t0);
      const row = c7_row(i, icon, name, true);
      c7_fly(p, icon, 700, y, 1.05, i, t0 + .9); show(row, t0 + 1.5, .3);
    });
  }],

  ['actueel', 'Volledig en actueel', (m) => {
    const p = panel(0);
    b_head(p, '5.09.01 · INVENTARIS VAN BEDRIJFSMIDDELEN');
    b_kop(p, '5.09.01', 'volledig en actueel');
    const tC = m('check'), tP = m('passend');
    // The inventory, looked over from time to time.
    show(b_icon(p, 'proc', { x: 230, y: 400, s: 2, o: 0 }), .3);
    b_txt(p, 'inventaris', 230, 500, .4, { size: 25, weight: 600 });
    show(b_icon(p, 'loep', { x: 352, y: 408, s: 1.3, o: 0, stroke: COL.task }), tC);
    b_txt(p, 'periodiek gecontroleerd', 290, 566, tC + .3, { size: 25, weight: 600, fill: COL.task });
    b_txt(p, 'op volledigheid en actualiteit', 290, 600, tC + .8, { size: 21, fill: COL.dim });
    // How often depends on how often things change: two time lines, schematic.
    b_txt(p, 'tussenpozen die passen bij hoe vaak er iets wijzigt', 600, 290, tP, { size: 24, weight: 600, fill: COL.task, anchor: 'start' });
    const leg = G(p, { o: 0 });
    path(leg, 'M606 687V713', { stroke: COL.dim, 'stroke-width': 3 });
    T(leg, 'wijziging', { x: 624, y: 707, size: 20, fill: COL.dim });
    mk('circle', { cx: 780, cy: 700, r: 9, fill: COL.task }, leg);
    T(leg, 'controle van de inventaris', { x: 800, y: 707, size: 20, fill: COL.dim });
    b_caps(leg, 'SCHEMATISCH', 1440, 706, { fill: COL.faint, anchor: 'end' });
    show(leg, tP + .5);
    const lane = (y, title, verdict, changes, checks, t0) => {
      const g = G(p, { o: 0 });
      T(g, title, { x: 600, y: y - 44, size: 24, weight: 600 });
      path(g, `M600 ${y}H1440`, { stroke: COL.edge, 'stroke-width': 3 });
      show(g, t0);
      changes.forEach((q, k) => show(path(p, `M${600 + q * 840} ${y - 13}V${y + 13}`, { stroke: COL.dim, 'stroke-width': 3 }, { o: 0 }), t0 + .2 + k * .05, .25));
      checks.forEach((q, k) => show(put(mk('circle', { cx: 600 + q * 840, cy: y, r: 9, fill: COL.task }, p), { o: 0 }), t0 + 1 + k * .15, .3));
      b_txt(p, verdict, 1440, y - 44, t0 + 1, { size: 22, fill: COL.task, anchor: 'end' });
    };
    lane(400, 'veel wijzigingen', 'vaker controleren', Array.from({ length: 14 }, (_, k) => (k + .5) / 14), [1, 2, 3, 4, 5, 6, 7].map(k => k / 7), m('veel'));   // a check after every second change
    lane(590, 'weinig wijzigingen', 'minder vaak', [.2, .55, .84], [.48, .96], m('weinig'));
  }],

  ['q1', 'Controlevraag', () => {
    // Five assets as cards to point at.
    const p = panel(0);
    b_head(p, '5.09.01 · INVENTARIS VAN BEDRIJFSMIDDELEN');
    b_txt(p, 'vijf bedrijfsmiddelen', 800, 232, .3, { size: 26, fill: COL.dim });
    S.cards = C7_Q1.map(([icon, lines], i) => {
      const g = b_tile(p, { x: c7_q1X(i), y: 264, w: 268, h: 250, icon, lines, iconY: 84, iconS: 1.15, size: 20 });
      b_rise(g, .3 + i * .1);
      return g;
    });
  }, { ask: done => {
    const items = S.cards.map((g, i) => ({ el: g, box: [c7_q1X(i), 264, 268, 250], label: C7_Q1[i][1].join(' ') }));
    const ot = 'Operationele technologie is hier de besturing van een gemaal. Ook OT staat in de inventaris.';
    quiz(WIDE, [{
      id: 'c-inventaris-1', prompt: ['Welk bedrijfsmiddel is operationele technologie (OT)?'],
      build: pickEls(items, 3, 'De besturing van een gemaal is operationele technologie. Ook OT staat in de inventaris.', i => [
        'Een server is geen operationele technologie. ' + ot, 'Een laptop is geen operationele technologie. ' + ot,
        'Een cloud-omgeving is geen operationele technologie. ' + ot, null, 'Een laptop is geen operationele technologie. ' + ot][i]),
    }, {
      id: 'c-inventaris-2', prompt: ['Welk bedrijfsmiddel is regelmatig verbonden, maar staat niet onder controle van de organisatie?'],
      build: pickEls(items, 4, 'De laptop van de leverancier is regelmatig met het netwerk verbonden. Ook zonder controle erover staat hij in de inventaris.', i => [
        'De eigen server staat onder controle van de organisatie. Verbonden zonder controle: de laptop van de leverancier.',
        'Die laptop is van de organisatie; hij staat alleen op afstand. Verbonden zonder controle: de laptop van de leverancier.',
        'Een cloud-omgeving noemt de maatregel apart. Regelmatig verbonden zonder controle: de laptop van de leverancier.',
        'De besturing van een gemaal is van de organisatie zelf. Verbonden zonder controle: de laptop van de leverancier.', null][i]),
    }, {
      id: 'c-inventaris-3', prompt: ['Hoe vaak wordt de inventaris gecontroleerd op volledigheid en actualiteit?'],
      // not a pointing question: clear the frames the pointing left on the cards first
      build: (body, api) => (qlayer(), choice([['Eén keer per jaar.'], ['Passend bij hoe vaak er iets wijzigt.'], ['Alleen na een incident.']], 1,
        'De controle is periodiek, met tussenpozen die passen bij hoe vaak er wijzigingen zijn.',
        ['De BIO noemt hier geen vaste termijn: de tussenpozen passen bij hoe vaak er iets wijzigt.', null,
          'De controle is periodiek, niet alleen na een incident: de tussenpozen passen bij hoe vaak er iets wijzigt.'])(body, api)),
    }], done);
  } }],

  ['gedrag', 'Gedragsregels in het contract', (m) => {
    const p = panel(0);
    S.hd = b_head(p, '5.10.02 · GEDRAGSREGELS');
    b_tab(1, .2);
    S.kop = b_kop(p, '5.10.02', 'gedragsregels in het contract');
    const tV = m('verpl'), tR = m('regels'), tW = m('wie'), tK = m('contract');
    // Where these two measures come from: they were moved here from 5.04 (chapter 6).
    const moved = G(p, { o: 0 });
    b_caps(moved, 'VERPLAATST · ZIE HOOFDSTUK 6', 800, 352, { fill: COL.faint, anchor: 'middle' });
    [['5.04.02', '5.10.02'], ['5.04.03', '5.10.03']].forEach(([a, b], k) => {
      const y = 380 + k * 80;
      put(b_chip(moved, 510, y, 180, a, { hgt: 50, size: 22, fill: COL.dim }), { o: 1 });
      path(moved, `M712 ${y + 25}H888 M874 ${y + 15}L888 ${y + 25}L874 ${y + 35}`, { stroke: COL.dim, 'stroke-width': 3 });
      put(b_chip(moved, 910, y, 180, b, { hgt: 50, size: 22, col: COL.task, fill: COL.task }), { o: 1 });
    });
    show(moved, tV); hide(moved, tR - .5, .4);
    // The rules of conduct.
    const rules = G(p, { o: 0 });
    b_icon(rules, 'doc', { x: 300, y: 400, s: 2.6 });
    T(rules, 'gedragsregels', { x: 300, y: 516, size: 27, weight: 600, anchor: 'middle' });
    T(rules, 'voor het gebruik van', { x: 300, y: 550, size: 21, fill: COL.dim, anchor: 'middle' });
    T(rules, 'bedrijfsmiddelen', { x: 300, y: 577, size: 21, fill: COL.dim, anchor: 'middle' });
    show(rules, tR);
    // For external staff and volunteers they are part of the contract: the rules slide into it.
    const rest = S.rest = G(p);
    [['extern personeel', 350], ['vrijwilligers', 560]].forEach(([str, y], k) => {
      const g = G(rest, { o: 0 });
      b_icon(g, 'persoon', { x: 1320, y, s: 1.4 });
      T(g, str, { x: 1320, y: y + 82, size: 23, weight: 600, anchor: 'middle' });
      show(g, tW + k * .9);
    });
    const doc = G(rest, { o: 0, y: 14 });
    b_rect(doc, 700, 262, 380, 440, { fill: COL.panel });
    b_caps(doc, 'CONTRACT', 730, 304, { size: 16 });
    [320, 230].forEach((w, k) => mk('rect', { x: 730, y: 330 + k * 24, width: w, height: 10, rx: 3, fill: COL.edge }, doc));
    [320, 280, 180].forEach((w, k) => mk('rect', { x: 730, y: 544 + k * 24, width: w, height: 10, rx: 3, fill: COL.edge }, doc));
    path(doc, 'M730 664H900', { stroke: COL.dim, 'stroke-width': 2 });
    b_rise(doc, tK);
    show(path(rest, 'M1092 440L1254 378 M1092 520L1254 556', { stroke: COL.dim, 'stroke-width': 3 }, { o: 0 }), tK + .4);
    const clause = G(rest, { o: 0, x: -430, y: -20 });
    b_rect(clause, 724, 392, 332, 116, { fill: COL.board, stroke: COL.task, sw: 3, rx: 6 });
    b_icon(clause, 'doc', { x: 772, y: 450, s: 1.1, stroke: COL.task });
