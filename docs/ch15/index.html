// Hoofdstuk 15, het laatste: de overheidsmaatregelen 8.20.01 tot en met 8.32.02 van de BIO2 (pagina 27 tot en met 29):

/* ---------- chapter data (used by the helpers and inside BEATS, so defined first) ---------- */

const C15_NET = [
  { code: '8.20', topic: ['beveiliging', 'netwerkcomponenten'], nrs: ['8.20.01', '8.20.02'] },

  { code: '8.26', topic: ['beveiligingseisen', 'voor toepassingen'], nrs: [] },
  { code: '8.27', topic: ['veilige architectuur', 'en uitgangspunten'], nrs: ['8.27.01'] },
  { code: '8.28', topic: ['veilig coderen'], nrs: [] },
  { code: '8.29', topic: ['testen bij ontwikkeling', 'en acceptatie'], nrs: ['8.29.01'] },

  { code: '8.32', topic: ['wijzigingsbeheer'], nrs: ['8.32.01', '8.32.02'] },
  { code: '8.33', topic: ['testgegevens'], nrs: [] },
  { code: '8.34', topic: ['systemen beschermen', 'tijdens audits'], nrs: [] },
];
// The seven topics the cryptography policy works out at least (8.24.01).
const C15_BELEID = [
  ['wanneer cryptografie wordt ingezet'],
  ['wie verantwoordelijk is voor de implementatie'],
  ['wie verantwoordelijk is voor het sleutelbeheer'],
  ['hoe wordt geregistreerd waar welke', 'cryptografie wordt toegepast'],
  ['welke normen als basis dienen, en hoe de normen', 'van het Forum Standaardisatie worden toegepast'],
  ['hoe het beschermingsniveau wordt vastgesteld'],
  ['bij communicatie tussen entiteiten wordt', 'het beleid onderling vastgesteld'],
];
// Cards for the two quick checks: [number, icon, label].
const C15_Q1 = [['8.20', 'keten', ['netwerk-', 'componenten']], ['8.21', 'slot', ['netwerkdiensten']], ['8.22', 'schild', ['gescheiden', 'groepen']]];
const c15_q1X = i => 314 + i * 336;
const C15_Q2 = [['8.24', 'sleutel', ['cryptografie']], ['8.29', 'loep', ['acceptatietesten']], ['8.31', 'server', ['testen en', 'productie']], ['8.32', 'proc', ['wijzigingsbeheer']]];

/* ---------- chapter drawing helpers (prefixed c15_; the shared b_ helpers live in ../lib/engine.js) ---------- */
// Topic k of the cryptography policy: a numbered row, four on the left and three on the right. Shown at t0.
const c15_topic = (p, k, t0) => {
  const [x, y] = k < 4 ? [128, 318 + k * 100] : [808, 318 + (k - 4) * 124], g = G(p, { o: 0, x: 12 });
  b_num(g, k + 1, x, y);
  C15_BELEID[k].forEach((str, n) => T(g, str, { x: x + 68, y: y + 32 + n * 28, size: 22, weight: n ? 500 : 600 }));
  tw(g, { o: 1, x: 0 }, t0, .5, out);
};
// The three environments in a row: development, test and production (the one that counts, in amber). Shown at t0.
const c15_envs = (p, t0) => [['ONTWIKKELOMGEVING', 'code'], ['TESTOMGEVING', 'loep'], ['PRODUCTIEOMGEVING', 'server']].forEach(([name, icon], k) => {
  const x = 120 + k * 460, g = G(p, { o: 0 });

  b_icon(g, icon, { x: x + 210, y: 366, s: 1.2 });
  show(g, t0 + k * .15);
  if (k < 2) b_arrow(p, x + 428, x + 452, 370, t0 + .4);
});

/* ---------- beats: [id, title, run(m, D), { ask, hold }?] ---------- */
const BEATS = [
  ['intro', 'Netwerk en cryptografie', (m, D) =>
    b_title(m, D, 'DEEL C · MENS, GEBOUW EN TECHNIEK · HOOFDSTUK 15', 'Netwerk en cryptografie', 'En veilig veranderen: ontwerpen, testen, uitbesteden en wijzigen.')],

  ['vijftien', '8.20 tot en met 8.24', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 2 · 8.20 TOT EN MET 8.34');
    b_txt(p, 'vijftien beheersmaatregelen, in twee delen', 800, 222, .4, { size: 25, fill: COL.dim });
    const tV = m('vijf'), tO = m('vier');
    // The strip of the first half: networks and cryptography. Web filters have no government measure.
    b_tabs(C15_TABS1, tV);
    b_tabNone(3);
    let withNr = 0;
    C15_NET.forEach((c, i) => b_ctrl(p, c, 120 + (i % 3) * 346, 262 + Math.floor(i / 3) * 184, i, c.nrs.length ? tO + .2 + withNr++ * .25 : tO + 1.4));

    T(sum, 'overheidsmaatregelen', { x: 977, y: 554, size: 25, weight: 600, fill: COL.task, anchor: 'middle' });
    show(sum, tO + 1.8);
    b_source(p, 656);
    b_txt(p, 'daarna: 8.25 tot en met 8.34, over ontwikkelen en veranderen', 120, 706, tV, { size: 20, fill: COL.dim, anchor: 'start' });
  }],

  ['niveau', 'Netwerkcomponenten', (m) => {
    const p = panel(0);
    b_head(p, '8.20.01 · NETWERKCOMPONENTEN');
    b_tab(0, .2);
    b_kop(p, '8.20.01', 'het niveau van het netwerk');
    const tC = m('comp'), tN = m('net');
    // A network with its confidentiality level, and the components that are part of it, schematic.
    const net = G(p, { o: 0 });
    b_rect(net, 120, 270, 760, 360, { fill: COL.panel });
    b_caps(net, 'NETWERK', 148, 312);
    put(b_chip(net, 420, 288, 432, 'vertrouwelijkheidsniveau', { col: COL.task, fill: COL.task, hgt: 40, size: 16 }), { o: 1 });
    show(net, .3);
    [250, 500, 750].forEach((x, k) => {
      const g = G(p, { o: 0 });
      b_icon(g, 'keten', { x, y: 430, s: 1.2 });
      T(g, 'component', { x, y: 492, size: 20, anchor: 'middle' });
      show(g, .5 + k * .15);
      show(put(b_tick(p, x, 550, COL.task), { o: 0 }), tC + 1 + k * .3);
    });
    show(b_box(p, 950, 396, 520, ['voldoen minimaal aan het', 'vertrouwelijkheidsniveau van hun netwerk'], { col: COL.task, fill: COL.task, hgt: 100, size: 22 }), tC);
    b_arrow(p, 936, 894, 446, tN, { stroke: COL.task });
  }],

  ['beheer', 'Beheerinterfaces', (m) => {
    const p = panel(0);
    b_head(p, '8.20.02 · NETWERKCOMPONENTEN');
    b_kop(p, '8.20.02', 'beheerinterfaces gescheiden');
    const tI = m('int'), tG = m('gebr');
    // The user network on one side; the component and its management interface on the other.
    const users = G(p, { o: 0 });
    b_rect(users, 120, 280, 520, 300, { fill: COL.panel });
    b_caps(users, 'GEBRUIKERSNETWERK', 148, 320);
    [250, 380, 510].forEach(x => b_icon(users, 'laptop', { x, y: 430, s: 1 }));
    show(users, .3);
    const mgmt = G(p, { o: 0 });
    b_rect(mgmt, 940, 280, 520, 300, { fill: COL.panel });
    b_caps(mgmt, 'NETWERKCOMPONENT', 968, 320);
    b_icon(mgmt, 'keten', { x: 1200, y: 400, s: 1.3 });
    put(b_chip(mgmt, 1070, 470, 260, 'beheerinterface', { col: COL.task, fill: COL.task, hgt: 44, size: 18 }), { o: 1 });
    show(mgmt, .3);
    // Separated as much as possible: no way through from the user network.
    show(put(path(p, 'M790 250V640', { stroke: COL.task, 'stroke-width': 3, 'stroke-dasharray': '10 9' }), { o: 0 }), tI);
    b_txt(p, 'toegang zo veel mogelijk gescheiden', 790, 692, tI, { size: 23, weight: 600, fill: COL.task });
    b_arrow(p, 652, 760, 430, tG);
    draw(path(p, 'M774 400V460', { stroke: COL.bad, 'stroke-width': 6 }, { d: 0 }), tG + .6, .4);

  ['koppel', 'Koppelpunten', (m) => {

    b_tab(1, .2);
    b_kop(p, '8.21.01', 'koppelpunten beschermen');
    const tP = m('punt'), tM = m('maat'), tS = m('sig');
    const ext = G(p, { o: 0 });
    b_rect(ext, 120, 280, 380, 250, { stroke: COL.dim, 'stroke-dasharray': '8 7' });
    b_caps(ext, 'EXTERNE OF ONVERTROUWDE ZONE', 140, 316, { size: 14 });
    b_icon(ext, 'wereld', { x: 310, y: 420, s: 1.3 });
    show(ext, .3);
    const own = G(p, { o: 0 });
    b_rect(own, 1080, 280, 380, 250, { stroke: COL.good, sw: 3 });
    b_caps(own, 'EIGEN NETWERK', 1104, 316, { fill: COL.good });

    show(own, .3);
    show(put(path(p, 'M500 410H1080', { stroke: COL.dim, 'stroke-width': 3 }), { o: 0 }), .5);
    // The connection point between them, where measures have been taken against attacks on availability.
    show(b_box(p, 670, 370, 240, ['koppelpunt'], { col: COL.task, fill: COL.task, hgt: 80, size: 24 }), tP);
    show(put(b_caps(p, 'OOK VANWEGE NETWERKSEGMENTATIE', 790, 354, { anchor: 'middle' }), { o: 0 }), tP + 2.8);
    show(b_box(p, 120, 600, 420, ['aanval op de beschikbaarheid'], { col: COL.bad, fill: COL.bad, hgt: 64, size: 21 }), tM);
    show(b_dart(p, 548, 610, 690, 462, { stroke: COL.bad }), tM + .4);
    show(put(b_caps(p, 'MAATREGELEN GETROFFEN OM AANVALLEN TE', 820, 584, { fill: COL.task }), { o: 0 }), tM);
    show(b_box(p, 820, 600, 230, ['signaleren'], { col: COL.task, fill: COL.task, hgt: 64, size: 22 }), tS);
    show(b_box(p, 1070, 600, 230, ['mitigeren'], { col: COL.task, fill: COL.task, hgt: 64, size: 22 }), tS + 1.2);
  }],

  ['verkeer', 'Verkeer bewaken', (m) => {
    const p = panel(0);
    S.hd = b_head(p, '8.21.02 · NETWERKDIENSTEN');
    S.kop = b_kop(p, '8.21.02', 'dataverkeer bewaken en analyseren');
    const tV = m('verk'), tA = m('anal');
    const zone = G(p, { o: 0 });
    b_rect(zone, 120, 262, 400, 230, { stroke: COL.good, sw: 3 });
    b_caps(zone, 'VERTROUWDE OMGEVING', 144, 298, { fill: COL.good });
    [230, 400].forEach(x => b_icon(zone, 'server', { x, y: 390, s: 1 }));
    show(zone, .3);
    show(b_party(p, 1380, 376, 'wereld', 'daarbuiten', { s: 1.3, lab: 80 }), .3);
    // The traffic to and from it is watched, and analysed for anything suspicious.
    b_arrow(p, 534, 1300, 376, tV, { both: true });

    show(b_icon(p, 'loep', { x: 880, y: 432, s: 1, o: 0, stroke: COL.task }), tV + 1);
    b_txt(p, 'bewaakt', 924, 440, tV + 1, { size: 21, weight: 600, fill: COL.task, anchor: 'start' });
    show(b_box(p, 640, 490, 540, ['geanalyseerd met detectievoorzieningen'], { col: COL.task, fill: COL.task, hgt: 60, size: 21 }), tA);
    show(b_chip(p, 1200, 500, 230, 'verdacht verkeer', { col: COL.bad, fill: COL.bad, hgt: 40, size: 16 }), tA + 1.6);
  }],

  ['delen', 'Dreigingen delen', (m) => {
    // Same picture: new threats found this way are passed on and shared within the government.
    const p = S.panel, tD = m('door'), tK = m('kader');
    hide(S.kop, 0, .3); hide(S.hd, 0, .3);
    b_head(p, '8.21.03 · NETWERKDIENSTEN', .3);
    b_kop(p, '8.21.03', 'nieuwe dreigingen delen', .3);
    show(b_box(p, 120, 610, 320, ['nieuwe dreiging'], { col: COL.bad, fill: COL.bad, hgt: 64, size: 22 }), .5);
    b_arrow(p, 452, 646, 642, tD, { stroke: COL.task });

    const gov = G(p, { o: 0 });

    show(gov, tD + .4);
    show(b_dashed(p, 120, 700, 620, ['met inachtneming van de geldende juridische kaders'], { hgt: 56, size: 19 }), tK);
  }],

  ['versleutel', 'Versleutelen', (m) => {
    const p = panel(0);
    b_head(p, '8.21.04 · NETWERKDIENSTEN');
    b_kop(p, '8.21.04', 'gegevens onderweg versleutelen');
    const tD = m('draad'), tB = m('buiten'), tM = m('meta');
    // Two kinds of connection on which data is encrypted: a lock on the line.
    const link = (y, a, b, dash, label, t0) => {
      const g = G(p, { o: 0 });
      b_icon(g, a, { x: 190, y, s: 1 });
      path(g, `M250 ${y}H700`, { stroke: COL.dim, 'stroke-width': 3, ...(dash ? { 'stroke-dasharray': '4 10' } : {}) });
      b_icon(g, b, { x: 760, y, s: 1 });
      mk('circle', { cx: 475, cy: y, r: 30, fill: COL.board, stroke: COL.task, 'stroke-width': 3 }, g);
      b_icon(g, 'slot', { x: 475, y: y - 3, s: .8, stroke: COL.task });
      T(g, label, { x: 150, y: y + 72, size: 21, weight: 600 });
      show(g, t0);
      return g;
    };
    link(320, 'laptop', 'server', true, 'draadloze verbinding, zoals wifi', tD);
    const wired = link(500, 'server', 'overheid', false, 'bedrade verbinding buiten het gecontroleerd gebied', tB);
    // The controlled area ends just past the server: the line leaves it.
    b_rect(wired, 130, 452, 170, 96, { stroke: COL.dim, 'stroke-dasharray': '8 7' });
    b_caps(wired, 'GECONTROLEERD GEBIED', 130, 440, { size: 13 });
    show(b_dashed(p, 120, 620, 760, ['uitgezonderd: metagegevens die nodig zijn voor het transport'], { hgt: 60, size: 20 }), tM);
  }],

  ['inrichting', 'De inrichting', (m) => {

    const p = S.panel, tT = m('term'), tN = m('niv'), tU = m('nbv'), tC = m('ciso');
    show(put(b_caps(p, 'DE INRICHTING: RISICOGERICHT', 1000, 290, { fill: COL.task }), { o: 0 }), .4);
    show(b_box(p, 1000, 306, 480, ['noodzakelijke beschermingstermijn'], { hgt: 60, size: 21 }), tT);
    show(b_box(p, 1000, 378, 480, ['noodzakelijk beschermingsniveau'], { hgt: 60, size: 21 }), tN);
    show(b_dashed(p, 1000, 466, 480, ['waar mogelijk: encryptiemiddelen met een', 'positief inzetadvies (Unit Weerbaarheid)'], { hgt: 90, size: 19 }), tU);
    show(b_box(p, 1000, 574, 480, ['geen geadviseerd middel? In overleg met', 'de CISO een andere geschikte methodiek'], { col: COL.task, fill: COL.task, hgt: 90, size: 19 }), tC);
  }],

    const p = panel(0);
    b_head(p, '8.22.01 · NETWERKSEGMENTATIE');
    b_tab(2, .2);
    b_kop(p, '8.22.01', 'elke groep een beveiligingsniveau');
    const tN = m('niv');

      show(b_chip(p, x + 60, 480, 300, 'beveiligingsniveau', { col: COL.task, fill: COL.task, hgt: 42, size: 17 }), tN + k * .4);

    b_txt(p, 'alle gescheiden groepen hebben een gedefinieerd beveiligingsniveau', 800, 660, tN + 1.4, { size: 23, weight: 600, fill: COL.task });
  }],

    const p = panel(0);

    const about = ['Dat gaat over netwerkcomponenten en hun beheer.', 'Dat gaat over netwerkdiensten: bewaken en versleutelen.', 'Dat gaat over gescheiden groepen in het netwerk.'];
    quiz(WIDE, [{
      id: 'c-netwerk-1', prompt: ['De beheerinterface van een switch is bereikbaar vanaf het kantoornetwerk. Welke maatregel?'],

    }, {
      id: 'c-netwerk-2', prompt: ['Verkeer over de wifi gaat onversleuteld. Welke maatregel geldt?'],

      id: 'c-netwerk-3', prompt: ['Een afgescheiden groep in het netwerk heeft geen beveiligingsniveau. Welke maatregel geldt?'],

  ['beleid1', 'Cryptografiebeleid', (m) => {
    const p = panel(0);
    b_head(p, '8.24.01 · CRYPTOGRAFIE');
    b_tab(4, .2);
    b_kop(p, '8.24.01', 'wat het cryptografiebeleid minimaal uitwerkt');
    // The policy as a sheet; the first four topics appear, each on its sentence.
    const sheet = G(p, { o: 0, y: 14 });
    b_rect(sheet, 100, 244, 1400, 500, { fill: COL.panel });
    b_caps(sheet, 'CRYPTOGRAFIEBELEID', 128, 286, { size: 16 });
    b_rise(sheet, m('beleid'));
    [0, 1, 2, 3].forEach(k => c15_topic(p, k, m('p' + (k + 1))));
  }],

  ['beleid2', 'Beleid, vervolg', (m) => {
    [4, 5, 6].forEach(k => c15_topic(S.panel, k, m('p' + (k + 1))));
  }],

  ['inventaris', 'In de inventaris', (m) => {
    const p = panel(0);
