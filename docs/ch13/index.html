<script>
'use strict';
// Hoofdstuk 13: de overheidsmaatregelen 8.01.01 tot en met 8.08.06 van de BIO2 (pagina 23 tot en met 25): mobiele
// apparatuur, speciale bevoegdheden, informatie met specifiek belang, netwerktoegang voor leveranciers, malware en

  { code: '8.4', topic: ['toegang tot', 'broncode'], nrs: [] },
  { code: '8.5', topic: ['beveiligde', 'authenticatie'], nrs: ['8.05.01'] },

  { code: '8.11', topic: ['gegevens maskeren'], nrs: [] },
  { code: '8.12', topic: ['gegevenslekken', 'voorkomen'], nrs: [] },

// Four controls as cards for the first quick check: [number, icon, label].

const C13_Q2 = [['uiterlijk binnen', 'een week'], ['minimaal jaarlijks'], ['bij iedere release', 'of major update'], ['ieder kwartaal']];

/* ---------- chapter drawing helpers (prefixed c13_; the shared b_ helpers live in ../lib/engine.js) ---------- */

// moved to the engine when chapter 14 needed them.

/* ---------- beats: [id, title, run(m, D), { ask, hold }?] ---------- */
const BEATS = [
  ['intro', 'Apparaten en malware', (m, D) =>
    b_title(m, D, 'DEEL C · MENS, GEBOUW EN TECHNIEK · HOOFDSTUK 13', 'Apparaten en malware', 'Mobiele apparatuur, toegang tot informatie, malware en kwetsbaarheden.')],

  ['twaalf', '8.01 tot en met 8.12', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 2 · 8.01 TOT EN MET 8.12');
    // The strip of this chapter. The controls without a government measure are dashed; the last four are one step.

    C13_CTRL.forEach((c, i) => b_ctrl(p, c, 120 + (i % 4) * 346, 150 + Math.floor(i / 4) * 184, i,
      c.nrs.length ? tZ + .2 + withNr++ * .25 : tG + .2 + without++ * .12));
    b_source(p, 716);
    b_txt(p, 'samen zestien overheidsmaatregelen', 800, 764, tZ + 1.8, { size: 27, weight: 600, fill: COL.task });

  ['zero', 'Mobiele apparatuur', (m) => {
    const p = panel(0);
    b_head(p, '8.01.01 · MOBIELE APPARATUUR');

    b_txt(p, 'niet standaard op het apparaat opgeslagen', 679, 372, tZ, { size: 22, weight: 600, fill: COL.task });
    show(b_term(p, 'Zero footprint', 'zero-footprint', { x: 679, y: 458, size: 28, anchor: 'middle' }), tZ + 2.5);
    b_txt(p, 'er blijft niets op achter', 679, 496, tN, { size: 21, fill: COL.dim });

  ['anders', 'Versleutelen en wissen', (m) => {

    const p = S.panel, tS = m('slot'), tW = m('wis');

    show(b_box(p, 860, 610, 560, ['wissen op afstand is mogelijk'], { col: COL.task, fill: COL.task, hgt: 96, size: 23 }), tW);
  }, { hold: true }],   // the lesson waits here: the English term of this picture can be heard before it goes on

  ['mobiel', 'Drie dingen', (m) => {

  }],

    b_txt(p, 'geldt voor alle mobiele apparatuur', 888, 512, tA, { size: 20, fill: COL.dim, anchor: 'start' });

    b_txt(p, 'minimaal ieder kwartaal', cx, cy + R + 60, tK + .6, { size: 23, weight: 600, fill: COL.task });
  }],

  ['isoleren', 'Isoleren', (m) => {
    const p = panel(0);

    const tI = m('iso'), tF = m('fys'), tL = m('log');

    b_rect(all, 760, 262, 700, 440, { fill: COL.panel });
    b_caps(all, 'INFORMATIE', 788, 302);
    b_caps(all, 'SCHEMATISCH', 1432, 684, { fill: COL.faint, anchor: 'end' });
    [[850, 400], [850, 520], [910, 630]].forEach(([x, y]) => b_icon(all, 'doc', { x, y, s: 1, stroke: COL.dim }));
    show(all, .3);
    const spec = G(p, { o: 0 });
    b_rect(spec, 980, 330, 440, 300, { fill: COL.board, stroke: COL.task, sw: 3 });
    b_caps(spec, 'INFORMATIE MET SPECIFIEK BELANG', 1004, 366, { fill: COL.task });
    S.parts = [...'ABC'].map((ch, k) => {
      const frame = b_rect(spec, 1010, 386 + k * 74, 380, 56, { fill: COL.panel, rx: 6 });
      T(spec, 'deel ' + ch, { x: 1034, y: 422 + k * 74, size: 21 });

    });
    show(spec, 1);
    show(put(b_caps(p, 'GEÏSOLEERD', 120, 300, { fill: COL.task }), { o: 0 }), tI);
    show(b_box(p, 120, 316, 220, ['fysiek'], { col: COL.task, fill: COL.task }), tF);
    b_txt(p, 'en/of', 384, 356, tL, { size: 21, fill: COL.dim });
    show(b_box(p, 428, 316, 220, ['logisch'], { col: COL.task, fill: COL.task }), tL);
  }],

  ['nodig', 'Alleen wat nodig is', (m) => {
    // Same picture: each user reaches only the part that the task needs.
    const p = S.panel, tA = m('alleen'), tT = m('taak');
    hide(S.kop, 0, .3); hide(S.hd, 0, .3);
    b_head(p, '8.03.02 · INFORMATIE MET SPECIFIEK BELANG', .3);
    b_kop(p, '8.03.02', 'alleen wat nodig is voor de taak', .3);
    [['A', 500, 0], ['B', 640, 2]].forEach(([ch, y, part], k) => {
      const g = G(p, { o: 0 });
      b_icon(g, 'persoon', { x: 170, y, s: 1 });
      T(g, 'gebruiker ' + ch, { x: 226, y: y - 2, size: 22, weight: 600 });
      T(g, 'taak: deel ' + 'ABC'[part], { x: 226, y: y + 26, size: 19, fill: COL.dim });
      show(g, tA + k * .6);
      show(b_dart(p, 400, y, 1000, 414 + part * 74, { stroke: COL.task }), tT + k * .6);
      tw(S.parts[part], { c_stroke: COL.task }, tT + k * .6, .4);
    });
    b_txt(p, 'alleen inzien en verwerken wat nodig is voor de taak', 430, 744, tT + 1.4, { size: 22, weight: 600, fill: COL.task });
  }],

  ['leverancier', 'Leveranciers', (m) => {
    const p = panel(0);
    b_head(p, '8.05.01 · TOEGANG VOOR LEVERANCIERS');
    b_tab(4, .2);
    b_kop(p, '8.05.01', 'netwerktoegang voor externe leveranciers');
    const tV = m('vooraf'), tW = m('voorw'), tL = m('lang'), tR = m('reg');
    show(b_party(p, 230, 420, 'bedrijf', 'externe leverancier', { s: 1.4, lab: 90 }), .3);
    const net = G(p, { o: 0 });
    b_rect(net, 1090, 290, 370, 260, { fill: COL.panel });
    b_caps(net, 'HET NETWERK', 1118, 330);
    [1190, 1360].forEach(x => b_icon(net, 'server', { x, y: 440, s: 1 }));
    show(net, .3);
    b_arrow(p, 340, 456, 420, .8);

    show(b_box(p, 470, 300, 460, ['vooraf: een risicoafweging'], { col: COL.task, fill: COL.task, hgt: 64 }), tV);
    show(put(b_matrix(p, 896, 332, .6), { o: 0 }), tV);
    show(b_box(p, 470, 380, 460, ['onder welke voorwaarden'], { hgt: 60, size: 22 }), tW);
    show(b_box(p, 470, 454, 460, ['voor hoelang'], { hgt: 60, size: 22 }), tL);
    b_arrow(p, 944, 1076, 420, tL + .8, { stroke: COL.task });
    // And a registration that shows how the rights were granted.
    b_down(p, 700, 524, 566, tR, COL.task);
    b_rise(b_sheet(p, 470, 578, 460, 110, 'REGISTRATIE', 1), tR);
    b_txt(p, 'hoe de rechten zijn toegekend', 498, 668, tR + .4, { size: 20, weight: 600, fill: COL.task, anchor: 'start' });
  }],

  ['q1', 'Controlevraag', () => {
    // Four controls of the first half as cards to point at.
    const p = panel(0);
    b_head(p, 'DEEL 2 · 8.01 TOT EN MET 8.05');
    b_tab(-1, .2);
    b_txt(p, 'apparaten en toegang', 800, 232, .3, { size: 26, fill: COL.dim });
    S.cards = b_cards(p, C13_Q1);
  }, { ask: done => {
    const items = b_cardItems(S.cards, C13_Q1);
    const about = ['Dat gaat over mobiele apparatuur.', 'Dat gaat over speciale bevoegdheden.', 'Dat gaat over informatie met specifiek belang.', 'Dat gaat over netwerktoegang voor leveranciers.'];
    quiz(WIDE, [{
      id: 'c-toegang-1', prompt: ['De rechten van een beheerder zijn een half jaar niet bekeken. Welke maatregel geldt?'],
      build: pickEls(items, 1, '8.02.01: speciale bevoegdheden worden minimaal ieder kwartaal beoordeeld, in opzet, bestaan en werking.',
        i => about[i] + ' Het beoordelen van speciale bevoegdheden staat in 8.02.01.'),
    }, {
      id: 'c-toegang-2', prompt: ['Een leverancier wil op afstand in het netwerk om een storing op te lossen. Welke maatregel?'],
      build: pickEls(items, 3, '8.05.01: vooraf een risicoafweging, die de voorwaarden en de duur bepaalt; de rechten staan in een registratie.',
        i => about[i] + ' Netwerktoegang voor externe leveranciers staat in 8.05.01.'),
    }, {
      id: 'c-toegang-3', prompt: ['Op een tablet van de buitendienst staan dossiers lokaal opgeslagen. Welke maatregel geldt?'],
      build: pickEls(items, 0, '8.01.01: bedrijfsinformatie wordt niet standaard op het apparaat opgeslagen; kan dat niet, dan minimaal versleuteling.',
        i => about[i] + ' Opslag op mobiele apparatuur staat in 8.01.01.'),
    }], done);
  } }],

  ['download', 'Downloaden', (m) => {
    const p = panel(0);
    b_head(p, '8.07.01 · MALWARE');
    b_tab(6, .2);
    b_kop(p, '8.07.01', 'downloaden beheerst en beperkt');
    const tB = m('beperkt'), tA = m('basis'), tS = m('scan');
    show(b_party(p, 200, 400, 'wereld', 'internet', { s: 1.4, lab: 84 }), .3);
    show(b_party(p, 1380, 400, 'laptop', 'gebruiker', { s: 1.4, lab: 84 }), .3);
    b_arrow(p, 280, 396, 400, .6);
    show(b_box(p, 410, 350, 330, ['downloaden:', 'beheerst en beperkt'], { col: COL.task, fill: COL.task, hgt: 100, size: 22 }), tB);
    // On what basis: the risk, and what the use needs.
    show(put(b_caps(p, 'OP BASIS VAN', 410, 500), { o: 0 }), tA);
    show(b_box(p, 410, 514, 150, ['het risico'], { hgt: 56, size: 21 }), tA);

    show(b_term(p, 'need-of-use', 'need-of-use', { x: 622, y: 550, size: 23 }), tA + 1.4);
    b_txt(p, 'wat voor het gebruik nodig is', 622, 582, tA + 1.4, { size: 18, fill: COL.dim, anchor: 'start' });
    // And the antimalware software always looks at every download.
    b_arrow(p, 752, 846, 400, tS);
    const scan = G(p, { o: 0, y: 14 });
    b_rect(scan, 860, 350, 400, 100, { fill: COL.panel, stroke: COL.task, sw: 3 });
    b_icon(scan, 'schild', { x: 912, y: 400, s: .9, stroke: COL.task });

    T(scan, 'beoordeelt altijd alle downloads', { x: 960, y: 422, size: 18 });
    b_rise(scan, tS);
    b_arrow(p, 1272, 1306, 400, tS + .8);
  }, { hold: true }],   // the lesson waits here: the English term can be heard before it goes on

  ['voorlichten', 'Voorlichten', (m) => {

    T(users, 'gebruikers', { x: 700, y: 470, size: 22, weight: 600, anchor: 'middle' });
    show(users, tV);
    show(put(b_caps(p, 'OVER DE RISICO’S VAN', 980, 316), { o: 0 }), tV + 1);
    show(b_box(p, 980, 330, 460, ['surfgedrag'], { col: COL.bad, fill: COL.bad, hgt: 66 }), tV + 1.8);
    show(b_box(p, 980, 412, 460, ['klikken op onbekende links'], { col: COL.bad, fill: COL.bad, hgt: 66 }), tK);

  ['actueel', 'Actueel houden', (m) => {
    const p = panel(0);
    b_head(p, '8.07.03 · MALWARE');
    b_kop(p, '8.07.03', 'software actueel houden');
    const tA = m('act'), tU = m('upd');
    [['schild', 'antimalware-software', 200], ['doorgaan', 'herstelsoftware', 700]].forEach(([icon, name, x], k) => {

      show(put(b_tick(p, x + 380, 312), { o: 0 }), tA + 1 + k * 1.2);

    b_periodic(p, 200, 1120, 610, tU);

  }],

  ['scannen', 'Waar gescand wordt', (m) => {
    const p = panel(0);
    b_head(p, '8.07.04 · MALWARE');
    b_kop(p, '8.07.04', 'waar de malwarescan plaatsvindt');
    const ys = [322, 468, 628];
    show(put(b_caps(p, 'MALWARESCAN', 1400, 262, { fill: COL.task, anchor: 'middle' }), { o: 0 }), m('s1'));
    // Three places, numbered; each appears on its sentence, with what is scanned there.
