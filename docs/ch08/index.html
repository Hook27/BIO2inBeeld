<script>
'use strict';
// Hoofdstuk 8: de overheidsmaatregelen 5.15.01 tot en met 5.18.02 van de BIO2 (pagina 16 en 17): de vertrouwde zone,
// identiteiten van gebruikers, multi-factorauthenticatie en wachtwoorden, en toegangsrechten.
// Beat ids match content/bio2/ch08/narration.nl.json. One idea per beat.
const CHAPTER = { number: 8, title: 'Toegang: accounts, MFA en rechten', minutes: 7, language: 'nl', next: '../ch09/' };

/* ---------- chapter data (used by the helpers and inside BEATS, so defined first) ---------- */
const C8_TABS = ['5.15', '5.16', '5.17', '5.18'];
// Four controls of ISO 27002 with their government measures in the BIO2; this time every one of them has some.
const C8_CTRL = [
  { code: '5.15', topic: ['toegangsbeveiliging'], nrs: ['5.15.01'] },
  { code: '5.16', topic: ['identiteitsbeheer'], nrs: ['5.16.01', '5.16.02'] },
  { code: '5.17', topic: ['authenticatie-', 'informatie'], nrs: ['5.17.01', '5.17.02', '5.17.03'] },
  { code: '5.18', topic: ['toegangsrechten'], nrs: ['5.18.01', '5.18.02'] },
];
// Where multi-factor authentication applies at least (5.17.01): [icon, label].
const C8_WAAR = [
  ['laptop', ['primair aanloggen op de', 'digitale werkomgeving']],
  ['wereld', ['accounts voor voorzieningen', 'bereikbaar via internet']],
  ['sleutel', ['accounts met', 'beheerrechten']],
];
// Three roles as cards for the first quick check: [icon, label].
const C8_Q1 = [['overheid', ['het bestuur']], ['persoon', ['de proceseigenaar']], ['schild', ['de CISO']]];
const c8_q1X = i => 220 + i * 400;
// The four controls as cards for the second quick check: [number, icon, label].
const C8_Q2 = [['5.15', 'schild', ['vertrouwde', 'zone']], ['5.16', 'persoon', ['identiteiten']], ['5.17', 'sleutel', ['authenticatie']], ['5.18', 'proc', ['toegangsrechten']]];
const c8_q2X = i => 146 + i * 336;
// The icons 'sleutel', 'kluis' and 'telefoon' started here and moved to the engine when chapters 12 and 13 needed them.

/* ---------- chapter drawing helpers (prefixed c8_; the shared b_ helpers live in ../lib/engine.js) ---------- */
// A copy of an icon travels from one place to another and fades as it arrives.
const c8_fly = (p, icon, [x0, y0, s0], [x1, y1, s1], t0) => {
  const g = b_icon(p, icon, { x: x0, y: y0, s: s0, o: 0 });
  show(g, t0, .15); tw(g, { x: x1, y: y1, s: s1 }, t0 + .1, .8, io); hide(g, t0 + .8, .25);
};
// A factor of authentication as a card of 96 high: an optional icon, a name and an optional small line in monospace
// (sub: true only keeps room for a second line). Returns the group, hidden.
const c8_factor = (p, x, y, w, icon, main, sub) => {
  const g = G(p, { o: 0 }), tx = x + (icon ? 96 : 28);
  b_rect(g, x, y, w, 96, { fill: COL.panel, rx: 6 });
  if (icon) b_icon(g, icon, { x: x + 48, y: y + 48, s: .8 });
  T(g, main, { x: tx, y: y + (sub ? 44 : 57), size: 23, weight: 600 });
  if (typeof sub === 'string') T(g, sub, { x: tx, y: y + 74, size: 17, fill: COL.dim, font: MONO });
  return g;
};
// (b_num, b_role and b_stamp, which started in this chapter, live in ../lib/engine.js.)

/* ---------- beats: [id, title, run(m, D), { ask, hold }?] ---------- */
const BEATS = [
  ['intro', 'Toegang', (m, D) =>
    b_title(m, D, 'DEEL B · MAATREGELEN VOOR DE ORGANISATIE · HOOFDSTUK 8', 'Toegang', 'Vertrouwde zones, identiteiten, inloggen en toegangsrechten.')],

  ['vier', '5.15 tot en met 5.18', (m) => {
    const p = panel(0);
    b_head(p, 'DEEL 2 · 5.15 TOT EN MET 5.18');
    // The strip of this chapter: the four controls. All of them have government measures, so no dashed frames.
    b_tabs(C8_TABS, .4);
    const tA = m('alle');
    C8_CTRL.forEach((c, i) => {
      const x = 120 + i * 346, y = 236, g = G(p, { o: 0, y: 12 });
      b_rect(g, x, y, 320, 330, { fill: COL.panel });
      T(g, c.code, { x: x + 24, y: y + 52, size: 34, fill: COL.iso, weight: 700, font: MONO });
      c.topic.forEach((str, k) => T(g, str, { x: x + 24, y: y + 92 + k * 28, size: 21 }));
      tw(g, { o: 1, y: 0 }, .3 + i * .1, .5, out);
      c.nrs.forEach((nr, k) => show(b_chip(g, x + 24, y + 156 + k * 52, 150, nr, { col: COL.task, fill: COL.task, hgt: 42, size: 19 }), tA + .2 + i * .25 + k * .1));
    });
    b_txt(p, 'BRON ONDERWERPEN: NEN-EN-ISO/IEC 27002:2022', 120, 606, 1.6, { size: 14, fill: COL.faint, anchor: 'start', weight: 700, font: MONO }).setAttribute('letter-spacing', '1.5');
    b_txt(p, 'samen acht overheidsmaatregelen', 800, 688, m('acht'), { size: 27, weight: 600, fill: COL.task });
  }],

  ['zone', 'De vertrouwde zone', (m) => {
    const p = panel(0);
    b_head(p, '5.15.01 · TOEGANG TOT EEN VERTROUWDE ZONE');
    b_tab(0, .2);
    b_kop(p, '5.15.01', 'toegang tot een vertrouwde zone');
    const tT = m('twee'), tS = m('schil');
    // The trusted zone, in green (trust), with what it protects inside.
    const zone = G(p, { o: 0 });
    b_rect(zone, 940, 250, 540, 470, { fill: COL.panel, stroke: COL.good, sw: 3 });
    b_caps(zone, 'VERTROUWDE ZONE', 968, 292, { fill: COL.good, size: 16 });
    b_icon(zone, 'server', { x: 1120, y: 480, s: 1.5 });
    b_icon(zone, 'db', { x: 1320, y: 480, s: 1.5 });
    show(zone, .3);
    b_txt(p, 'toegestaan in twee situaties', 120, 270, tT, { size: 24, fill: COL.dim, anchor: 'start' });
    // The two ways in, numbered; each gets an arrow into the zone.
    const way = (k, y, icon, lines, t0, shell) => {
      const g = G(p, { o: 0 });
      b_num(g, k, 120, y - 24);
      if (shell) b_rect(g, 196, y - 44, 108, 88, { stroke: COL.good, rx: 14, sw: 3 });   // the secure shell around the software
      else b_tick(g, 312, y - 36);                                                      // authenticated
      b_icon(g, icon, { x: 250, y, s: shell ? .95 : 1.15 });
      lines.forEach((str, n) => T(g, str, { x: 330, y: y - 6 + n * 28, size: 22, weight: 600 }));
      show(g, t0);
      show(b_dart(p, 660, y, 926, 430 + k * 34, { stroke: COL.good }), t0 + .6);
    };
    way(1, 350, 'laptop', ['geauthentiseerde', 'apparatuur'], m('app'));
    way(2, 500, 'code', ['programmatuur binnen', 'een veilige schil'], tS, true);
    // Anything else stays out: an appliance that is not authenticated is stopped at the wall.
    const no = G(p, { o: 0 });
    b_icon(no, 'laptop', { x: 250, y: 650, s: 1.15, stroke: COL.dim });
    T(no, 'niet geauthentiseerd', { x: 330, y: 658, size: 22, fill: COL.dim });
    path(no, 'M660 650H886', { stroke: COL.dim, 'stroke-width': 3 });
    path(no, 'M906 620V680', { stroke: COL.bad, 'stroke-width': 6 });
    T(no, 'geen toegang', { x: 773, y: 634, size: 20, fill: COL.bad, weight: 600, anchor: 'middle' });
    show(no, tS + 2.4);
  }],

  ['registratie', 'Registreren en afmelden', (m) => {
    const p = panel(0);
    b_head(p, '5.16.01 · IDENTITEITSBEHEER');
    b_tab(1, .2);
    b_kop(p, '5.16.01', 'registreren en afmelden');
    const tR = m('reg'), tA = m('af'), tS = m('sluit'), rowY = i => 316 + i * 78;
    // The list of user identities, schematic: three users in it.
    const sheet = G(p, { o: 0, y: 14 });
    b_rect(sheet, 540, 244, 520, 400, { fill: COL.panel });
    b_caps(sheet, 'GEBRUIKERSIDENTIFICATIES', 568, 284, { size: 16 });
    b_caps(sheet, 'SCHEMATISCH', 1032, 284, { fill: COL.faint, anchor: 'end' });
    path(sheet, 'M568 300H1032', { stroke: COL.edge, 'stroke-width': 2 });
    b_rise(sheet, .3);
    const rows = [...'ABCD'].map((c, i) => {
      const y = rowY(i), g = G(p, { o: 0 });
      b_icon(g, 'persoon', { x: 604, y: y + 36, s: .55 });
      T(g, 'gebruiker ' + c, { x: 644, y: y + 44, size: 22 });
      if (i < 3) path(g, `M568 ${y + 76}H1032`, { stroke: COL.edge, 'stroke-width': 1.5 });
      if (i < 3) show(g, .9 + i * .12);
      return g;
    });
    // Registering: a new user gets an identity.
    show(b_icon(p, 'persoon', { x: 250, y: 420, s: 1.5, o: 0 }), tR);
    b_txt(p, 'nieuwe gebruiker', 250, 512, tR, { size: 23, weight: 600 });
    b_arrow(p, 336, 524, 420, tR + .4);
    show(put(b_caps(p, 'REGISTREREN', 430, 398, { fill: COL.task, size: 16, anchor: 'middle' }), { o: 0 }), tR + .4);
    c8_fly(p, 'persoon', [250, 420, 1.5], [604, rowY(3) + 36, .55], tR + 1.1);
    show(rows[3], tR + 1.8, .3);
    // Signing off: a user who leaves loses it again.
    b_arrow(p, 1076, 1264, 420, tA);
    show(put(b_caps(p, 'AFMELDEN', 1170, 398, { fill: COL.task, size: 16, anchor: 'middle' }), { o: 0 }), tA);
    c8_fly(p, 'persoon', [604, rowY(0) + 36, .55], [1350, 420, 1.5], tA + .3);
    tw(rows[0], { o: .3 }, tA + .4, .5);
    draw(path(p, `M592 ${rowY(0) + 37}H780`, { stroke: COL.dim, 'stroke-width': 3 }, { d: 0 }), tA + .5, .5);
    show(b_icon(p, 'persoon', { x: 1350, y: 420, s: 1.5, o: 0, stroke: COL.dim }), tA + 1);
    b_txt(p, 'gebruiker vertrekt', 1350, 512, tA + 1, { size: 23, fill: COL.dim });
    // Closed and formal: whatever is issued is signed off again.
    show(b_box(p, 560, 672, 480, ['sluitend en formeel'], { col: COL.task, fill: COL.task, hgt: 56 }), tS);
    b_txt(p, 'elke uitgegeven identiteit wordt ook weer afgemeld', 800, 766, tS + 1.2, { size: 22, fill: COL.dim });
  }],

  ['groep', 'Groepsaccounts', (m) => {
    const p = panel(0);
    b_head(p, '5.16.02 · GROEPSACCOUNTS');
    b_kop(p, '5.16.02', 'geen groepsaccounts, tenzij');
    const tN = m('niet'), tT = m('tenzij');
    // Three people on one account: not allowed, so it is shown and struck through.
    const grp = G(p, { o: 0 });
    [200, 330, 460].forEach(x => {
      b_icon(grp, 'persoon', { x, y: 320, s: 1.2 });
      path(grp, `M${x} 376L330 446`, { stroke: COL.dim, 'stroke-width': 2.5 });
    });
    put(b_chip(grp, 215, 448, 230, 'groepsaccount', { hgt: 52, size: 20, bg: COL.panel }), { o: 1 });
    show(grp, .3);
    draw(path(p, 'M150 268L510 524', { stroke: COL.bad, 'stroke-width': 5 }, { d: 0 }), tN, .5);
    b_txt(p, 'niet toegestaan', 330, 578, tN + .3, { size: 26, weight: 600, fill: COL.bad });
    // Unless the process owner gives reasons, records it and agrees it with the CISO.
    b_txt(p, 'tenzij de proceseigenaar dit', 700, 290, tT, { size: 25, weight: 600, anchor: 'start' });
    show(b_role(p, 760, 450, 'proceseigenaar'), tT);
    [['mot', 'motiveert'], ['vast', 'vastlegt'], ['ciso', 'afstemt met de CISO']].forEach(([mark, str], k) => {
      const y = 340 + k * 86;
      show(b_dart(p, 824, 450, 928, y + 32), m(mark));
      show(b_box(p, 940, y, 300, [str], { col: COL.task, fill: COL.task }), m(mark));
    });
    const ciso = b_role(p, 1400, 544, 'CISO');
    path(ciso, 'M1252 544H1340', { stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '7 7' });
    show(ciso, m('ciso') + .3);
  }],

  ['q1', 'Controlevraag', () => {
    // Three roles as cards to point at.
    const p = panel(0);
    b_head(p, '5.16.02 · GROEPSACCOUNTS');
    b_txt(p, 'drie rollen', 800, 232, .3, { size: 26, fill: COL.dim });
    S.cards = C8_Q1.map(([icon, lines], i) => {
      const g = b_tile(p, { x: c8_q1X(i), y: 264, w: 360, h: 250, icon, lines, iconY: 96, iconS: 1.1, size: 23, textY: 452 });   // textY: clear of the tall 'overheid' icon
      b_rise(g, .3 + i * .1);
      return g;
    });
  }, { ask: done => {
    const items = S.cards.map((g, i) => ({ el: g, box: [c8_q1X(i), 264, 360, 250], label: C8_Q1[i][1].join(' ') }));
    quiz(WIDE, [{
      id: 'c-groep-1', prompt: ['Een team wil één account delen. Wie motiveert dat en legt het vast?'],
      build: pickEls(items, 1, 'De proceseigenaar motiveert het groepsaccount en legt dat vast.', i => [
        'Het bestuur noemt de maatregel hier niet. De proceseigenaar motiveert het en legt het vast.', null,
        'Met de CISO wordt afgestemd. Motiveren en vastleggen doet de proceseigenaar.'][i]),
    }, {
      id: 'c-groep-2', prompt: ['En met wie stemt de proceseigenaar dat af?'],
      build: pickEls(items, 2, 'De proceseigenaar stemt het groepsaccount af met de CISO.', i => [
        'Het bestuur noemt de maatregel hier niet. De afstemming is met de CISO.',
        'De proceseigenaar is zelf degene die afstemt, en wel met de CISO.', null][i]),
    }, {
      id: 'c-zone', prompt: ['Wanneer is toegang tot een vertrouwde zone toegestaan?'],
      // not a pointing question: clear the frames the pointing left on the cards first
      // (short options and one line of feedback: with more the card runs out of the picture)
      build: (body, api) => (qlayer(), choice([['Vanaf elk apparaat.'], ['Vanaf geauthentiseerde apparatuur.'], ['Alleen op kantoor.']], 1,
        'Vanaf geauthentiseerde apparatuur, of vanuit programmatuur binnen een veilige schil.',
        ['Niet elk apparaat: geauthentiseerde apparatuur, of programmatuur binnen een veilige schil.', null,
          'De plaats telt niet: geauthentiseerde apparatuur, of programmatuur binnen een veilige schil.'])(body, api)),
    }], done);
  } }],

  ['mfa', 'Multi-factorauthenticatie', (m) => {
    const p = panel(0);
    b_head(p, '5.17.01 · MULTI-FACTORAUTHENTICATIE');
    b_tab(2, .2);
    b_kop(p, '5.17.01', 'multi-factorauthenticatie (MFA)');
    const tM = m('mfa'), tE = m('een'), tR = m('meer');
    // A lock: one factor leaves it shut, a second one opens it.
    const lock = G(p, { x: 800, y: 440, s: 2.4, o: 0 }), look = { stroke: COL.chalk, 'stroke-width': 1.25 };
    const body = path(lock, 'M-26 -2H26V34H-26Z M0 11V21', look);
    const bow = path(lock, 'M-15 -2V-16a15 15 0 0 1 30 0V-2', look);
    show(lock, tM);
    show(b_box(p, 240, 380, 320, ['één factor']), tE);
    show(b_dart(p, 572, 412, 712, 452), tE + .3);
    const shut = b_txt(p, 'niet genoeg', 800, 600, tE + .9, { size: 26, weight: 600, fill: COL.bad });
    hide(shut, tR, .3);
    show(b_box(p, 240, 500, 320, ['een tweede factor']), tR);
    show(b_dart(p, 572, 532, 712, 492), tR + .3);
    tw(bow, { y: -9, c_stroke: COL.good }, tR + .8, .5, out); tw(body, { c_stroke: COL.good }, tR + .8, .5);
    b_txt(p, 'toegang', 800, 600, tR + 1.1, { size: 26, weight: 600, fill: COL.good });
    b_txt(p, 'meer dan één factor', 1180, 470, tR + .6, { size: 30, weight: 600, fill: COL.task });
  }],

  ['waar', 'Waar MFA geldt', (m) => {
    const p = panel(0);
    b_head(p, '5.17.01 · MULTI-FACTORAUTHENTICATIE');
    b_kop(p, '5.17.01', 'waar MFA ten minste geldt');
    const tR = m('ra'), badge = (g, x) => put(b_chip(g, x + 16, 300, 84, 'MFA', { col: COL.task, fill: COL.task, hgt: 36, size: 17 }), { o: 1 });
    b_kick(p, 'TEN MINSTE BIJ', 120, COL.task, m('min'), 264);
    // Three places where it is the minimum; each appears on its sentence.
    C8_WAAR.forEach(([icon, lines], i) => {
      const x = 120 + i * 346, g = b_tile(p, { x, y: 284, w: 320, h: 300, icon, lines, iconY: 128, iconS: 1.3, size: 19 });
      badge(g, x);
      b_rise(g, m('p' + (i + 1)));
    });
    // And wherever the risk analysis shows it fits: an open place, dashed.
    b_kick(p, 'EN VERDER', 1158, COL.dim, tR, 264);
    const more = G(p, { o: 0, y: 14 });
    b_rect(more, 1158, 284, 320, 300, { fill: COL.panel, stroke: COL.dim, 'stroke-dasharray': '8 7' });
    badge(more, 1158);
    b_matrix(more, 1318, 412, 1.3);
    ['andere situaties waar het', 'uit de risicoanalyse', 'passend blijkt'].forEach((str, k) => T(more, str, { x: 1318, y: 484 + k * 24, size: 19, weight: 600, anchor: 'middle' }));
    b_rise(more, tR);
  }],

  ['vormen', 'Twee vormen', (m) => {
    const p = panel(0);
    b_head(p, '5.17.01 · MULTI-FACTORAUTHENTICATIE');
    b_kop(p, '5.17.01', 'twee vormen van MFA');
    const tA = m('v1'), tZ = m('zoals'), tC = m('cert'), tB = m('v2'), tF = m('factor');
    const plus = (str, x, y, t0) => b_txt(p, str, x, y, t0, { size: 28, fill: COL.dim });
    // Form 1: access without a password, such as a PIN together with a hardware token or a personal certificate.
    const one = G(p, { o: 0 });
    b_num(one, 1, 120, 252);
    T(one, 'wachtwoordloze toegang', { x: 190, y: 287, size: 27, weight: 600 });
    show(one, tA);
    show(put(b_caps(p, 'ZOALS', 190, 334), { o: 0 }), tZ);
    show(c8_factor(p, 190, 348, 230, null, 'pincode', '• • • •'), tZ);
    plus('+', 446, 406, tZ + .5);
    show(c8_factor(p, 472, 348, 300, 'sleutel', 'hardware-token'), tZ + .5);
    plus('of', 800, 404, tC);
    const cert = c8_factor(p, 828, 348, 480, 'cert', 'persoonlijk uniek certificaat', true);   // the second line is the English term
    b_term(cert, 'passkey', 'passkey', { x: 924, y: 424, size: 19, fill: COL.dim, o: 1 });
    show(cert, tC);
    // Form 2: access with a password, together with at least a second factor.
    const two = G(p, { o: 0 });
    b_num(two, 2, 120, 506);
    T(two, 'toegang met een wachtwoord', { x: 190, y: 541, size: 27, weight: 600 });
    show(two, tB);
    show(c8_factor(p, 190, 578, 330, null, 'wachtwoord', '• • • • • • • • • •'), tB + .4);
    plus('+', 546, 636, tF);
    show(c8_factor(p, 572, 578, 470, 'telefoon', 'minimaal een tweede factor'), tF);
  }, { hold: true }],   // the lesson waits here: the English term can be heard before it goes on

  ['nietmogelijk', 'Als MFA niet kan', (m) => {
    const p = panel(0);
    b_head(p, '5.17.01 · MULTI-FACTORAUTHENTICATIE');
    b_kop(p, '5.17.01', 'als MFA niet mogelijk is');
    const tM = m('mit'), tC = m('ciso'), tE = m('eig');
    // An account where multi-factor authentication cannot be used.
    b_rise(b_tile(p, { x: 130, y: 300, w: 300, h: 200, icon: 'sleutel', lines: ['account'], iconY: 84, iconS: 1.3 }), .3);
    show(b_chip(p, 205, 526, 150, 'MFA', { hgt: 48, size: 22, fill: COL.dim }), .6);
    draw(path(p, 'M190 586L370 514', { stroke: COL.bad, 'stroke-width': 5 }, { d: 0 }), 1.7, .5);
    b_txt(p, 'niet mogelijk', 280, 632, 2, { size: 25, weight: 600, fill: COL.bad });
    // Then other mitigating measures take its place.
    b_arrow(p, 448, 566, 420, tM);
    show(b_box(p, 580, 360, 400, ['andere mitigerende', 'maatregelen'], { col: COL.task, fill: COL.task, hgt: 120, size: 25 }), tM + .3);
    // The CISO is involved (dashed: advice); the process owner approves, and the stamp lands on the measures.
    show(b_role(p, 1300, 300, 'CISO'), tC);
    show(b_dart(p, 1244, 318, 994, 388, { dash: true }), tC + .3);
    b_txt(p, 'wordt betrokken', 1300, 414, tC + .5, { size: 20, fill: COL.dim });
    show(b_role(p, 1300, 560, 'proceseigenaar', COL.task), tE);
    b_txt(p, 'keurt goed', 1300, 674, tE + .3, { size: 20, fill: COL.task, weight: 600 });
    const stamp = b_stamp(p, 1300, 722, 'GOEDGEKEURD');   // starts under the process owner, not across the face
    show(stamp, tE + .5, .3); tw(stamp, { x: 880, y: 342 }, tE + 1, .9, io);
  }],

  ['federatief', 'MFA gecombineerd', (m) => {
    const p = panel(0);
